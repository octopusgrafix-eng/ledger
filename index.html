<style>
  :root{
    --font-slab: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Noto Serif', 'Times New Roman', serif;
    --font-mono: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace;
    --font-stamp: var(--font-mono);
  }
  :root{
    /* Sampled from the OKTOPUS PRINTS logo: deep indigo through to azure. */
    --ok-deep:#0F0FBE;
    --ok-blue:#1131F4;
    --ok-bright:#104FFA;

    /* Ink carries a blue cast now so the whole page reads as one family with the
       logo, without turning body text into saturated brand colour. */
    --ink:#151E38;
    --paper:#F6F1E5;
    --paper-deep:#EFE7D4;
    --rule:#D9CFB4;
    --amber:#B9791C;
    --amber-deep:#8F5D12;
    --teal:#2E655F;
    --clay:#AB4530;
    --green:#3E6B45;
    --muted:#8A8168;
    --paper-shadow: rgba(21,30,56,0.10);

    /* Motion. Custom curves — the built-in CSS easings are too weak to read as
       deliberate, and ease-in is never used: it delays the first frame, which is
       exactly when the eye is watching. */
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  }
  *{box-sizing:border-box;}
  html{height:100%;-webkit-text-size-adjust:100%;}
  body{
    margin:0;min-height:100%;
    background:var(--paper);
    overflow-x:hidden;
  }
  #ledger-root{
    background:var(--paper);
    /* A 28px repeating tile the compositor can cheaply repeat, instead of one
       repeating-linear-gradient stretched over the entire document height. */
    background-image:linear-gradient(to bottom, transparent 27px, var(--rule) 27px);
    background-size:100% 28px;
    background-repeat:repeat-y;
    color:var(--ink);
    font-family:var(--font-mono);
    min-height:100vh;
    padding:0;
    position:relative;
  }
  #ledger-root h1,#ledger-root h2,#ledger-root h3{
    font-family:var(--font-slab);
    margin:0;
  }
  .lg-shell{max-width:1080px;margin:0 auto;padding:22px 20px 60px;}
  .lg-header{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:3px double var(--ink);
    padding-bottom:14px;margin-bottom:18px;flex-wrap:wrap;gap:10px;
  }
  .lg-header .lg-title{font-size:26px;font-weight:700;letter-spacing:0.5px;}
  .lg-header .lg-sub{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}
  .lg-date{font-size:12px;color:var(--muted);text-align:right;}
  .lg-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:20px;}
  .lg-tab{
    font-family:var(--font-slab);font-weight:600;font-size:14px;
    padding:8px 14px;border:1.5px solid var(--ink);background:transparent;
    color:var(--ink);cursor:pointer;border-radius:2px;
    /* Named properties only — `all` would sweep up layout properties too. */
    transition:background-color 160ms ease, color 160ms ease,
               border-color 160ms ease, transform 140ms var(--ease-out);
  }
  .lg-tab.active{background:var(--ok-deep);color:var(--paper);border-color:var(--ok-deep);}
  /* Tabs are pressed dozens of times a day, so the only motion is the press
     itself — instant feedback, no entrance or exit choreography. */
  .lg-tab:active{transform:scale(0.97);}
  @media (hover:hover) and (pointer:fine){
    .lg-tab:hover:not(.active){background:var(--paper-deep);border-color:var(--ok-blue);}
  }
  .lg-card{
    background:rgba(255,253,247,0.55);
    border:1px solid var(--rule);
    border-radius:3px;
    padding:16px 18px;
    margin-bottom:16px;
    box-shadow:0 1px 0 var(--paper-shadow);
  }
  .lg-card-title{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px;}
  .lg-grid{display:grid;gap:14px;}
  .lg-grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .lg-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .lg-grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:760px){.lg-grid.cols-4,.lg-grid.cols-3,.lg-grid.cols-2{grid-template-columns:1fr 1fr;}}
  .lg-kpi{border-left:3px solid var(--amber);padding-left:10px;}
  .lg-kpi .num{font-size:22px;font-weight:600;}
  .lg-kpi .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .lg-kpi.debt{border-left-color:var(--clay);}
  .lg-kpi.paid{border-left-color:var(--green);}
  .lg-kpi.teal{border-left-color:var(--teal);}

  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px;margin-top:10px;}
  input,select,textarea{
    width:100%;font-family:var(--font-mono);font-size:13.5px;
    padding:7px 8px;border:1px solid var(--rule);background:#FFFDF8;color:var(--ink);border-radius:2px;
  }
  input,select,textarea{transition:border-color 140ms ease, box-shadow 140ms ease;}
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--ok-blue);
    box-shadow:0 0 0 3px rgba(17,49,244,0.16);
  }
  .lg-btn{
    font-family:var(--font-slab);font-weight:700;font-size:13.5px;
    padding:9px 16px;border:1.5px solid var(--ok-deep);background:var(--ok-deep);color:var(--paper);
    cursor:pointer;border-radius:2px;letter-spacing:0.3px;
    transition:background-color 160ms ease, border-color 160ms ease,
               transform 140ms var(--ease-out), box-shadow 160ms ease;
  }
  /* Every pressable thing scales on press. It is the one animation worth having
     everywhere: it confirms the tap landed, and at 140ms it never delays anything. */
  .lg-btn:active{transform:scale(0.97);}
  .lg-btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(17,49,244,0.3);}
  .lg-btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink);}
  .lg-btn.danger{border-color:var(--clay);color:var(--clay);background:transparent;}
  @media (hover:hover) and (pointer:fine){
    .lg-btn:hover{background:var(--ok-blue);border-color:var(--ok-blue);}
    .lg-btn.ghost:hover{background:var(--paper-deep);border-color:var(--ok-blue);}
    .lg-btn.danger:hover{background:var(--clay);color:#fff;}
  }
  .lg-btn.small{padding:5px 10px;font-size:12px;}
  .lg-row-actions{display:flex;gap:6px;flex-wrap:wrap;}

  /* Stamp badge - signature element */
  .stamp{
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--font-stamp);
    font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    border:2px solid currentColor;border-radius:5px;
    padding:4px 9px;transform:rotate(-3deg);
    background:transparent;white-space:nowrap;
  }
  .stamp::before{content:"● ";font-size:9px;}
  .stamp.received{color:var(--amber-deep);}
  .stamp.production{color:var(--teal);}
  .stamp.ready{color:#8B5FBF;}
  .stamp.delivered{color:var(--green);transform:rotate(-2deg);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;font-family:var(--font-slab);font-weight:600;font-size:11.5px;
    text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);
    border-bottom:2px solid var(--ink);padding:6px 8px;
  }
  td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top;}
  tr:hover td{background:rgba(185,121,28,0.06);}
  .num-col{text-align:right;font-variant-numeric:tabular-nums;}
  .muted{color:var(--muted);}
  .lg-empty{padding:30px;text-align:center;color:var(--muted);font-style:italic;}

  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media(max-width:900px){.kanban{grid-template-columns:1fr 1fr;}}
  .kanban-col{background:rgba(255,253,247,0.4);border:1px dashed var(--rule);border-radius:4px;padding:8px;min-height:120px;}
  .kanban-col-head{font-family:var(--font-slab);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:1px;padding:6px 4px;margin-bottom:6px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;}
  .job-card{
    background:#FFFDF8;border:1px solid var(--rule);border-radius:3px;
    padding:9px 10px;margin-bottom:8px;font-size:12.5px;cursor:default;
  }
  .job-card .jc-top{display:flex;justify-content:space-between;font-weight:600;}
  .job-card .jc-desc{color:var(--muted);margin:3px 0 6px;}
  .job-card .jc-amt{font-weight:600;}
  .job-card select{font-size:11.5px;padding:4px;margin-top:4px;}

  .toast{
    position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--paper);
    font-family:var(--font-slab);font-size:13px;padding:10px 16px;border-radius:3px;
    box-shadow:0 6px 20px rgba(21,30,56,0.28);z-index:999;
    opacity:0;transform:translateY(12px) scale(0.97);
    /* A transition rather than keyframes: toasts fire in quick succession, and a
       transition retargets mid-flight where keyframes would restart from zero. */
    transition:opacity 220ms var(--ease-out), transform 220ms var(--ease-out);
  }
  .toast.show{opacity:1;transform:translateY(0) scale(1);}
  /* Item name + Qty + Unit + Unit Price + Amount + remove. The old layout carried a
     seventh column for a separate "quick pick" catalog dropdown; the name field is now
     a datalist, so the two are one control. */
  .item-row{display:grid;grid-template-columns:1.8fr 0.6fr 0.7fr 0.9fr 0.9fr auto;gap:6px;align-items:end;margin-bottom:6px;}
  @media(max-width:700px){.item-row{grid-template-columns:1fr 1fr;}}
  .item-desc-row{display:grid;grid-template-columns:2fr 0.6fr 0.7fr 0.9fr 0.9fr;gap:6px;align-items:end;margin-top:6px;}
  @media(max-width:700px){.item-desc-row{grid-template-columns:1fr 1fr;}}
  .material-row{display:grid;grid-template-columns:1.5fr 0.7fr 0.7fr 0.9fr 0.9fr auto;gap:6px;align-items:end;margin-bottom:6px;}
  @media(max-width:700px){.material-row{grid-template-columns:1fr 1fr;}}
  .flag{color:var(--clay);font-weight:600;}
  .subtle-link{background:none;border:none;color:var(--ok-blue);text-decoration:underline;cursor:pointer;font-family:var(--font-mono);font-size:12px;padding:0;
    transition:color 140ms ease, transform 120ms var(--ease-out);}
  .subtle-link:active{transform:scale(0.96);}
  @media (hover:hover) and (pointer:fine){ .subtle-link:hover{color:var(--ok-deep);} }

  /* ---- Receipt modal ---- */
  .lg-overlay{
    position:fixed; inset:0; background:rgba(27,42,61,.6); display:flex; align-items:flex-start;
    justify-content:center; padding:26px 14px; overflow-y:auto; z-index:200;
  }
  .lg-receipt{
    background:#fff; width:100%; max-width:340px; padding:20px 18px; border-radius:6px;
    font-family:var(--font-mono); color:var(--ink); box-shadow:0 12px 40px rgba(0,0,0,.3);
  }
  .lg-receipt h2{font-size:15px; text-align:center; margin:0 0 2px; letter-spacing:.5px;}
  .lg-receipt .r-sub{text-align:center; font-size:11px; color:#555; margin-bottom:10px;}
  .lg-receipt .r-dashed{border-top:1px dashed #999; margin:10px 0;}
  .lg-receipt .r-row{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:3px;}
  .lg-receipt .r-row.total{font-weight:700; font-size:13.5px;}
  .lg-receipt .r-title{text-align:center; font-weight:700; font-size:13px; letter-spacing:1px; margin:8px 0;}
  .lg-receipt .r-items div{font-size:12px; margin-bottom:2px;}
  .lg-receipt .r-foot{text-align:center; font-size:11px; color:#666; margin-top:10px;}
  /* Password gate on the two irreversible actions. Deliberately plain — the warning is the
     point, so it gets clay and weight while everything around it stays quiet. */
  .pw-warn{font-size:12.5px; line-height:1.5; color:var(--clay); background:rgba(171,69,48,.07);
    border-left:3px solid var(--clay); padding:9px 11px; border-radius:0 4px 4px 0;}
  .pw-msg{font-size:11.5px; min-height:15px; margin-top:6px;}
  .pw-msg.err{color:var(--clay); font-weight:600;}
  .lg-receipt-actions{display:flex; gap:8px; margin-top:14px; align-items:center; flex-wrap:wrap;}
  .lg-receipt-actions .lg-btn{flex:1; text-align:center;}
  /* Computed figures shown beside inputs. Rendered as text, not a disabled input —
     a greyed-out box that can't be typed in still reads as a field you should fill. */
  .item-row .it-amt, .item-desc-row .it-desc-amt{
    font-family:var(--font-mono);font-size:13.5px;padding:7px 2px;
    font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;
  }
  /* Optional section, collapsed by default so a walk-in job isn't buried in fields. */
  .lg-more > summary{
    cursor:pointer;list-style:none;
    font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);
  }
  .lg-more > summary::-webkit-details-marker{display:none;}
  .lg-more > summary::before{content:"\25B8 ";display:inline-block;transition:transform .15s;}
  .lg-more[open] > summary::before{transform:rotate(90deg);}
  .lg-more > summary:hover{color:var(--ink);}
  /* The browser's own "hide a closed <details>" rule loses to an author rule that sets
     display on a child — .lg-grid{display:grid} was enough to keep this section on screen
     while it reported itself closed. Hide the content explicitly instead of relying on it. */
  .lg-more:not([open]) > *:not(summary){display:none !important;}

  /* The owed amount doubles as the "record a payment" control. Styled to read as
     tappable without turning the figure into a link — it must still scan as a number
     in a column of numbers. */
  .owed-pay{
    background:none;border:none;padding:2px 0;cursor:pointer;
    font-family:var(--font-mono);font-size:13px;font-weight:600;
    font-variant-numeric:tabular-nums;color:var(--clay);
    border-bottom:1.5px dotted var(--clay);
  }
  .owed-pay{transition:background-color 140ms ease, transform 120ms var(--ease-out);}
  .owed-pay:active{transform:scale(0.96);}
  .owed-pay:hover,.owed-pay:focus-visible{background:rgba(171,69,48,.1);border-bottom-style:solid;}
  @media(max-width:760px){ .owed-pay{padding:6px 0;} }

  /* ---- Late-job alarm ---- */
  .lg-alarm{
    border:1.5px solid var(--clay);border-left:5px solid var(--clay);
    background:rgba(171,69,48,0.07);border-radius:3px;
    padding:11px 14px;margin-bottom:14px;
    display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  }
  .lg-alarm .al-main{font-family:var(--font-slab);font-weight:700;font-size:14px;color:var(--clay);}
  .lg-alarm .al-list{font-size:12px;color:var(--ink);margin-top:3px;line-height:1.5;}
  .lg-alarm .al-actions{display:flex;gap:6px;flex-wrap:wrap;}
  @keyframes lg-alarm-pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  .lg-alarm .al-dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--clay);margin-right:7px;animation:lg-alarm-pulse 1.6s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .lg-alarm .al-dot{animation:none;} }

  /* ---- Monthly target ---- */
  .lg-target{border-left:3px solid var(--ok-blue);}
  .lg-target .tg-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .lg-target .tg-big{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;}
  .lg-target .tg-of{font-size:13px;font-weight:400;color:var(--muted);}
  .lg-target .tg-pct{font-family:var(--font-slab);font-size:19px;font-weight:700;color:var(--ok-deep);}
  .lg-target .tg-bar{
    height:9px;border-radius:5px;background:var(--paper-deep);
    border:1px solid var(--rule);margin-top:8px;overflow:hidden;
  }
  .lg-target .tg-bar > span{
    display:block;height:100%;
    background:linear-gradient(90deg,var(--ok-deep),var(--ok-bright));
    /* Grows to the new figure rather than jumping, so recording a payment reads as
       progress being made. Width is safe to animate here — one bar, nothing laid out
       around it that a reflow would disturb. */
    transition:width 520ms var(--ease-out);
  }
  .lg-target .tg-pace{font-size:12px;margin-top:7px;}
  .lg-target .tg-pace.ok{color:var(--green);}
  .lg-target .tg-pace.behind{color:var(--clay);}
  .lg-target .tg-carry{
    font-size:11px;color:var(--muted);margin-top:7px;
    padding-top:7px;border-top:1px dashed var(--rule);
  }
  /* Distance from target, as colour. Clay → amber → green, the same three the rest of the
     app uses for debt / warning / paid, so the bar means what those already mean. The card's
     left edge and the percentage move with the bar, so the state reads at a glance without
     having to parse the number. */
  .lg-target.tg-far    .tg-bar > span{background:linear-gradient(90deg,#8C2F1B,var(--clay));}
  .lg-target.tg-mid    .tg-bar > span{background:linear-gradient(90deg,var(--clay),var(--amber));}
  .lg-target.tg-close  .tg-bar > span{background:linear-gradient(90deg,var(--amber),#5C8F3A);}
  .lg-target.tg-met    .tg-bar > span{background:linear-gradient(90deg,#5C8F3A,var(--green));}
  .lg-target.tg-far    {border-left-color:var(--clay);}
  .lg-target.tg-mid    {border-left-color:var(--amber);}
  .lg-target.tg-close  {border-left-color:var(--amber);}
  .lg-target.tg-met    {border-left-color:var(--green);}
  .lg-target.tg-far    .tg-pct{color:var(--clay);}
  .lg-target.tg-mid    .tg-pct{color:var(--amber);}
  .lg-target.tg-close  .tg-pct{color:var(--amber);}
  .lg-target.tg-met    .tg-pct{color:var(--green);}
  .lg-target .tg-bar > span{transition:width 520ms var(--ease-out), background 420ms linear;}
  .lg-target .tg-pct{transition:color 420ms linear;}
  .lg-target{transition:border-left-color 420ms linear;}
  /* Hitting the day's target is worth one beat of acknowledgement. Once, on the render that
     first shows it met — not on every payment recorded afterwards, which is why the class is
     added by script rather than sitting in the markup. */
  @keyframes tg-hit{
    0%{transform:scale(1);}
    40%{transform:scale(1.012);}
    100%{transform:scale(1);}
  }
  .lg-target.tg-just-hit{animation:tg-hit 460ms var(--ease-out);}
  @media (prefers-reduced-motion: reduce){
    .lg-target .tg-bar > span{transition:none;}
    .lg-target.tg-just-hit{animation:none;}
  }

  /* ---- Motion ----
     Budgeted by how often a thing is seen. The sign-in screen happens once per
     device, so it can afford a staged entrance. Tab content is seen dozens of
     times a day, so it gets one short fade — and only when the tab actually
     changes, never on the re-render that follows recording a payment or typing
     in a search box. Presses get 140ms and nothing else. */

  @keyframes lg-rise{ from{opacity:0;transform:translateY(10px) scale(0.985);} to{opacity:1;transform:none;} }
  @keyframes lg-fade{ from{opacity:0;} to{opacity:1;} }
  @keyframes lg-drop{ from{opacity:0;transform:translateY(-8px);} to{opacity:1;transform:none;} }

  /* Tab content. Applied by renderAll() only on a genuine tab change. */
  #lg-content.lg-enter{ animation:lg-rise 200ms var(--ease-out) both; }

  /* Sign-in: the one place a staged entrance is warranted. The card scales in and
     its rows rise — the card itself does not translate, or the two transforms
     compound and the rows appear to overshoot. Nothing starts from scale(0):
     things in the world do not appear out of nothing. */
  @keyframes lg-card-in{ from{opacity:0;transform:scale(0.96);} to{opacity:1;transform:none;} }
  .lg-auth-card{ animation:lg-card-in 420ms var(--ease-out) both; }
  .lg-auth-card > *{ animation:lg-rise 380ms var(--ease-out) both; }
  .lg-auth-card > *:nth-child(1){animation-delay:60ms;}
  .lg-auth-card > *:nth-child(2){animation-delay:100ms;}
  .lg-auth-card > *:nth-child(3){animation-delay:140ms;}
  .lg-auth-card > *:nth-child(4){animation-delay:170ms;}
  .lg-auth-card > *:nth-child(5){animation-delay:200ms;}
  .lg-auth-card > *:nth-child(6){animation-delay:225ms;}
  .lg-auth-card > *:nth-child(7){animation-delay:250ms;}
  .lg-auth-card > *:nth-child(n+8){animation-delay:275ms;}

  /* Things that appear on demand — occasional, so a standard entrance is right. */
  .lg-alarm{ animation:lg-drop 260ms var(--ease-out) both; }
  .pay-form,.guide-block{ animation:lg-rise 180ms var(--ease-out) both; }
  .lg-overlay{ animation:lg-fade 180ms var(--ease-out) both; }
  /* Modals stay centred — unlike a popover, they are not anchored to a trigger. */
  .lg-receipt{ animation:lg-rise 260ms var(--ease-out) both; transform-origin:center; }

  /* Reduced motion means gentler, not none: keep the opacity cues that explain
     what appeared, drop everything that moves. */
  @media (prefers-reduced-motion: reduce){
    #lg-content.lg-enter,.lg-auth-card,.lg-auth-card > *,
    .lg-alarm,.pay-form,.guide-block,.lg-receipt{
      animation:lg-fade 160ms ease both;
    }
    .lg-btn:active,.lg-tab:active,.subtle-link:active,.owed-pay:active{transform:none;}
    .toast{transition:opacity 200ms ease;transform:none;}
    .toast.show{transform:none;}
  }

  /* ---- Sign-in gate ---- */
  /* The ledger is hidden until Firebase Auth confirms a signed-in user, so the books
     are never painted for someone who isn't logged in. */
  #lg-auth{
    position:fixed; inset:0; z-index:500;
    background:var(--paper);
    background-image:linear-gradient(to bottom, transparent 27px, var(--rule) 27px);
    background-size:100% 28px;
    display:flex; align-items:center; justify-content:center; padding:24px 16px;
    overflow-y:auto;
  }
  #lg-auth[hidden]{display:none;}
  .lg-auth-card{
    background:#FFFDF8; border:1px solid var(--rule); border-radius:4px;
    box-shadow:0 8px 30px var(--paper-shadow);
    padding:26px 24px; width:100%; max-width:360px;
  }
  .lg-auth-card h1{font-family:var(--font-slab); font-size:23px; letter-spacing:.5px; margin:0;}
  .lg-auth-card .lg-auth-sub{
    font-size:11px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase;
    margin:3px 0 18px; border-bottom:3px double var(--ink); padding-bottom:12px;
  }
  .lg-auth-card .lg-btn{width:100%; margin-top:16px; padding:11px 16px;}
  .lg-auth-msg{font-size:12px; margin-top:12px; min-height:16px; line-height:1.45;}
  .lg-auth-msg.err{color:var(--clay);}
  .lg-auth-msg.ok{color:var(--green);}
  .lg-auth-foot{font-size:11px; color:var(--muted); margin-top:16px; line-height:1.5;}
  #lg-signout{margin-left:6px;}

  /* ---- Header grouping ---- */
  .lg-header-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .lg-header-actions{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}

  /* ---- Responsive ----
     These only ever take effect because the document now declares
     <meta name="viewport" content="width=device-width">. Without it every phone
     reports a 980px viewport and none of these queries match. */
  @media(max-width:760px){
    .lg-shell{padding:14px 12px 48px;}
    .lg-header{align-items:flex-start;}
    .lg-header-meta{align-items:flex-start;width:100%;}
    .lg-header-actions{justify-content:flex-start;}
    .lg-date{text-align:left;}
    .lg-header .lg-title{font-size:21px;}
    /* Wide data tables scroll inside their own card instead of stretching the page. */
    .lg-card{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .lg-card table{min-width:560px;}
    /* 16px prevents iOS Safari from auto-zooming when a field is focused. */
    input,select,textarea{font-size:16px;}
  }
  @media(max-width:560px){
    .lg-grid.cols-4,.lg-grid.cols-3,.lg-grid.cols-2{grid-template-columns:1fr;}
    .kanban{grid-template-columns:1fr;}
    .item-row,.item-desc-row,.material-row{grid-template-columns:1fr;}
    .lg-tab{font-size:13px;padding:7px 11px;}
    .lg-btn{padding:10px 14px;}
    .lg-row-actions .lg-btn{flex:1 1 auto;}
    .toast{left:12px;right:12px;bottom:12px;text-align:center;}
  }

  @media print{
    body *{visibility:hidden;}
    .lg-receipt, .lg-receipt *{visibility:visible;}
    .lg-receipt{position:fixed; top:0; left:0; box-shadow:none; max-width:100%;}
    .lg-receipt-actions{display:none;}
    .lg-overlay{position:static; background:none; padding:0;}
  }
</style>

<body>

<!-- Shown until Firebase Auth reports a signed-in user. Starts visible so the ledger
     is never briefly painted to someone who isn't logged in. -->
<div id="lg-auth">
  <form class="lg-auth-card" id="lg-auth-form" autocomplete="on">
    <h1>OKTOPUS LEDGER</h1>
    <div class="lg-auth-sub">Sign in to continue</div>
    <label for="lg-auth-email">Email</label>
    <input type="email" id="lg-auth-email" autocomplete="username" required>
    <label for="lg-auth-pass">Password</label>
    <input type="password" id="lg-auth-pass" autocomplete="current-password" required>
    <button class="lg-btn" id="lg-auth-btn" type="submit">Sign In</button>
    <div class="lg-auth-msg" id="lg-auth-msg">Starting…</div>
    <div class="lg-auth-foot">
      You stay signed in on this device until you sign out.
      Use the same account on your phone and both will show the same ledger.
    </div>
  </form>
</div>

<div id="ledger-root" hidden>
  <div class="lg-shell">
    <div class="lg-header">
      <div>
        <div class="lg-title">OKTOPUS LEDGER</div>
        <div class="lg-sub">Intake &middot; Production &middot; Delivery &middot; Cash Record</div>
      </div>
      <div class="lg-header-meta">
        <div class="lg-date" id="lg-clock"></div>
        <div class="lg-date" id="lg-storage-mode" style="font-size:10.5px;opacity:.85;margin-top:2px;"></div>
        <div class="lg-date" id="lg-last-saved" style="font-size:10.5px;opacity:.85;margin-top:2px;"></div>
        <div class="lg-header-actions">
          <button class="lg-btn ghost small" id="lg-backup-btn" type="button" title="Download all your data as a file you can keep safe">⬇ Backup</button>
          <button class="lg-btn ghost small" id="lg-restore-btn" type="button" title="Load a backup file back in">⬆ Restore</button>
          <button class="lg-btn danger small" id="lg-clear-btn" type="button" title="Wipe everything and start fresh">🗑 Clear All Data</button>
          <button class="lg-btn ghost small" id="lg-signout" type="button" title="Sign out of this device">Sign Out</button>
          <input type="file" id="lg-restore-file" accept="application/json" style="display:none;">
        </div>
      </div>
    </div>
    <div id="lg-alarm"></div>
    <div class="lg-tabs" id="lg-tabs"></div>
    <div id="lg-content"><div class="lg-empty">Loading ledger…</div></div>
  </div>
  <div class="toast" id="lg-toast"></div>
  <div id="lg-modal-root"></div>
</div>

<script>
(function(){
  // Daily View leads and is the landing tab — it's the day-to-day working screen.
  // Dashboard is the month-at-a-glance overview, so it sits at the end.
  const TABS = [
    {id:'dayview', label:'Daily View'},
    {id:'summary', label:'Summary'},
    {id:'newjob', label:'New Job'},
    {id:'jobs', label:'Jobs'},
    {id:'pending', label:'Pending Jobs'},
    {id:'quotes', label:'Quotes'},
    {id:'staff', label:'Staff'},
    {id:'prices', label:'Price List'},
    {id:'matprices', label:'Material Prices'},
    {id:'customers', label:'Customers'},
    {id:'inventory', label:'Inventory'},
    {id:'expenses', label:'Expenses'},
    {id:'cpaccount', label:'CP Account'},
    {id:'dashboard', label:'Dashboard'},
  ];
  const STATUSES = ['RECEIVED','IN PRODUCTION','READY','DELIVERED'];
  const STATUS_CLASS = {'RECEIVED':'received','IN PRODUCTION':'production','READY':'ready','DELIVERED':'delivered'};
  const STAGE_GUIDE = {
    'RECEIVED': [
      'Confirm the customer\u2019s name and phone number',
      'Confirm the job spec \u2014 quantity, size, and price agreed',
      'Collect any deposit and log it as a payment',
      'Note what materials the job will need'
    ],
    'IN PRODUCTION': [
      'Assign an operator to the job',
      'Log materials as they\u2019re used \u2014 this updates Inventory automatically',
      'Confirm the actual cost of production once it\u2019s known'
    ],
    'READY': [
      'Do a quality check before calling the customer',
      'Notify the customer the job is ready for pickup'
    ],
    'DELIVERED': [
      'Collect any balance owed, or confirm it\u2019s logged as debt',
      'Job complete \u2014 nothing more to do'
    ]
  };

  let state = {
    jobs: [],
    pricelist: [],
    customers: [],
    materials: [],
    expenses: [],
    cpspend: [],
    cpadjust: [],
    exadjust: [],
    quotes: [],
    recurring: [],
    settings: {tithePct:10, pfPct:65, exPct:25, monthlyTarget:0, targetBasis:'pf', targetWorksSundays:false, shopName:'YOUR BUSINESS NAME', shopPhone:'', shopAddress:'', receiptCounter:0, cpOpeningFloat:0, cpStartDate:'', exOpeningFloat:0, exStartDate:'', matOpeningFloat:0, matStartDate:''},
    tab: 'dayview',
    loaded: false,
  };

  const root = document.getElementById('ledger-root');
  const content = document.getElementById('lg-content');
  const tabsEl = document.getElementById('lg-tabs');
  const toastEl = document.getElementById('lg-toast');
  const clockEl = document.getElementById('lg-clock');

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  // Local calendar date as YYYY-MM-DD. Never go via toISOString() — that converts to UTC, and
  // west of it (Nigeria is UTC+1) local midnight falls on the previous UTC day, so "today"
  // reads as yesterday until 1am and every date shift lands a day short.
  function isoOf(d){
    const pad = x=>String(x).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }
  function todayISO(){ return isoOf(new Date()); }
  // ---------- stage timestamps (turnaround / efficiency) ----------
  // Every status change records `at`, a full ISO instant, alongside the existing
  // date-only `date` field which older code still reads. Jobs logged before this
  // existed have no `at` at all — they are reported as "not timed" rather than
  // guessed at, so an average is never quietly built on invented times.
  function nowISO(){ return new Date().toISOString(); }
  // Turns an ISO instant into the value a <input type="datetime-local"> expects,
  // in LOCAL time — toISOString() would shift it by the timezone offset.
  function toLocalInput(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d)) return '';
    const p = n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function fmtDateTime(iso){
    if(!iso) return '—';
    const d = new Date(iso);
    if(isNaN(d)) return '—';
    return d.toLocaleDateString('en-NG',{day:'2-digit',month:'short'}) + ' ' +
           d.toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'});
  }
  function fmtDuration(ms){
    if(ms==null || !isFinite(ms)) return '—';
    if(ms < 0) return '—';
    const mins = Math.round(ms/60000);
    if(mins < 60) return mins + 'm';
    const h = Math.floor(mins/60), m = mins%60;
    if(h < 24) return m ? `${h}h ${m}m` : `${h}h`;
    const d = Math.floor(h/24), rh = h%24;
    return rh ? `${d}d ${rh}h` : `${d}d`;
  }
  // First moment the job entered a given status.
  function stageAt(j, status){
    const hit = (j.history||[]).find(x=>x.status===status && x.at);
    return hit ? hit.at : null;
  }
  // Production = intake through to the work being finished. Delivering implies it
  // was ready, so a job taken straight to DELIVERED still counts as finished then.
  function productionMs(j){
    const start = stageAt(j,'RECEIVED');
    if(!start) return null;
    const readyish = (j.history||[])
      .filter(x=>x.at && (x.status==='READY' || x.status==='DELIVERED'))
      .map(x=>x.at).sort();
    if(!readyish.length) return null;
    const ms = new Date(readyish[0]) - new Date(start);
    return isFinite(ms) && ms >= 0 ? ms : null;
  }
  function fmtDate(iso){
    if(!iso) return '—';
    const d = new Date(iso+'T00:00:00');
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('en-NG',{day:'2-digit',month:'short',year:'numeric'});
  }
  function naira(n){
    n = Number(n)||0;
    return '₦' + n.toLocaleString('en-NG',{maximumFractionDigits:0});
  }
  function normName(s){ return (s||'').trim().toUpperCase(); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  // ---------- payment method (cash vs bank transfer) ----------
  // CP spends and expenses each carry ONE method. Job payments are different: a single
  // payment can be part cash and part transfer, so those store two amounts rather than
  // a method. Both shapes reduce to the same {cash, transfer, unknown, total} summary.
  //
  // Entries logged before this existed have no `method`, and are deliberately reported
  // as "Not recorded" rather than assumed to be cash — guessing would put figures in the
  // books that were never actually recorded, and you could never tell which.
  function methodLabel(m){
    return m==='cash' ? 'Cash' : (m==='transfer' ? 'Bank Transfer' : 'Not recorded');
  }
  function methodTag(m){
    const colour = m==='cash' ? 'var(--green)' : (m==='transfer' ? 'var(--teal)' : 'var(--clay)');
    const text = m==='cash' ? 'CASH' : (m==='transfer' ? 'TRANSFER' : 'NOT RECORDED');
    return `<span style="font-size:10px;letter-spacing:.8px;color:${colour};font-weight:600;">${text}</span>`;
  }
  // Inline picker used on existing rows so past entries can be filled in retroactively.
  function methodSelectHTML(cls, id, current){
    return `<select class="${cls}" data-id="${id}" style="font-size:11.5px;padding:3px 4px;width:auto;">
      <option value=""${!current?' selected':''}>— not recorded —</option>
      <option value="cash"${current==='cash'?' selected':''}>Cash</option>
      <option value="transfer"${current==='transfer'?' selected':''}>Bank Transfer</option>
    </select>`;
  }
  // For anything with {amount, method} — CP spends, expenses.
  function splitByMethod(rows){
    const out = {cash:0, transfer:0, unknown:0, total:0};
    (rows||[]).forEach(r=>{
      const a = Number(r.amount)||0;
      out.total += a;
      if(r.method==='cash') out.cash += a;
      else if(r.method==='transfer') out.transfer += a;
      else out.unknown += a;
    });
    return out;
  }
  // For job payments and old-debt payments, which carry separate cash/bank amounts.
  function splitPayments(payments){
    const out = {cash:0, transfer:0, unknown:0, total:0};
    (payments||[]).forEach(p=>{
      const c = Number(p.cash)||0, b = Number(p.bank)||0;
      out.cash += c; out.transfer += b; out.total += c + b;
    });
    return out;
  }
  // Shared presentation so the same breakdown reads identically everywhere it appears.
  function methodBreakdownHTML(split, opts){
    opts = opts || {};
    const noun = opts.noun || 'spent';
    return `<div class="lg-grid cols-${split.unknown>0?'4':'3'}">
      <div class="lg-card lg-kpi paid"><div class="num">${naira(split.cash)}</div><div class="lbl">Cash ${noun}</div></div>
      <div class="lg-card lg-kpi teal"><div class="num">${naira(split.transfer)}</div><div class="lbl">Bank Transfer ${noun}</div></div>
      ${split.unknown>0 ? `<div class="lg-card lg-kpi debt"><div class="num">${naira(split.unknown)}</div><div class="lbl">Method Not Recorded</div></div>` : ''}
      <div class="lg-card lg-kpi" style="border-left-color:var(--ink);"><div class="num">${naira(split.total)}</div><div class="lbl">Total</div></div>
    </div>`;
  }

  function isoWeekLabel(iso){
    const d = new Date(iso+'T00:00:00');
    const target = new Date(d.valueOf());
    const dayNr = (d.getDay()+6)%7;
    target.setDate(target.getDate()-dayNr+3);
    const firstThursday = new Date(target.getFullYear(),0,4);
    const diff = target - firstThursday;
    const week = 1 + Math.round(diff/(7*24*3600*1000));
    return target.getFullYear()+'-W'+String(week).padStart(2,'0');
  }
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>toastEl.classList.remove('show'), 2200);
  }
  clockEl.textContent = new Date().toLocaleDateString('en-NG',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  function updateStorageModeLabel(){
    const el = document.getElementById('lg-storage-mode');
    if(window.__FIREBASE_READY__ && currentUid){
      const user = window.__firebaseAuth__ && window.__firebaseAuth__.currentUser;
      el.textContent = '\u2601 Live sync \u2014 ' + ((user && user.email) || 'signed in');
      el.title = 'Changes appear on your other devices within a second, no refresh needed.';
    }else{
      el.textContent = window.storage ? '\u2601 Saved to this Claude conversation' : '\ud83d\udcbe Saved in this browser only';
      el.title = '';
    }
  }
  // Firebase loads with `defer` now, so on first paint we don't know yet whether it's ready —
  // show a neutral "connecting" state and update once syncFromCloud() resolves it below.
  document.getElementById('lg-storage-mode').textContent = '\u26a1 Connecting…';

  // ---------- storage ----------
  // Storage compatibility layer, in priority order:
  // 1. Firebase Firestore (if configured and reachable) — the permanent, cross-device store.
  //    localStorage is also written on every save as an offline cache, so the app keeps working
  //    if the internet drops, and catches up next time it's online.
  // 2. window.storage — when viewed inside Claude (as an artifact), persists per conversation.
  // 3. localStorage — plain downloaded file opened in a browser with no internet/Firebase reachable;
  //    persists on THIS device as long as you reopen the same file from the same browser.
  //
  // Loading is split in two so the ledger paints instantly instead of sitting blank while the
  // network is contacted:
  //   loadLocalCache() — synchronous, reads everything from this browser's local cache.
  //   syncFromCloud()  — ONE background Firestore read for the whole ledger (not one read per
  //                       field), which quietly reconciles + re-renders only if something changed.
  // The signed-in user's ledger is stored under their own uid, and the local cache is
  // namespaced the same way — so two people signing in on the same browser never see
  // each other's cached books. LEGACY_LS_PREFIX is the pre-login key layout, adopted
  // once on first sign-in so existing data on this device isn't stranded.
  const LEGACY_LS_PREFIX = 'ledgerapp_';
  let currentUid = null;
  let LS_PREFIX = LEGACY_LS_PREFIX;
  let needsFirebaseMigration = false;
  // Last value we know is safely persisted, per storage key. Lets the periodic
  // safety-net save skip fields that haven't changed instead of rewriting the
  // whole ledger to the network every 5 minutes.
  const lastPersisted = Object.create(null);
  const STORAGE_KEYS = [['jobs','jobs-v1'],['pricelist','pricelist-v1'],['customers','customers-v1'],['materials','materials-v1'],['expenses','expenses-v1'],['cpspend','cpspend-v1'],['cpadjust','cpadjust-v1'],['exadjust','exadjust-v1'],['quotes','quotes-v1'],['recurring','recurring-v1'],['settings','settings-v1']];
  const DEFAULT_SETTINGS = {tithePct:10, pfPct:65, exPct:25, monthlyTarget:0, targetBasis:'pf', targetWorksSundays:false, shopName:'YOUR BUSINESS NAME', shopPhone:'', shopAddress:'', receiptCounter:0, cpOpeningFloat:0, cpStartDate:'', exOpeningFloat:0, exStartDate:'', matOpeningFloat:0, matStartDate:''};
  function fsAllDoc(){
    // Everything lives as fields on ONE document, so a fresh load costs one round trip
    // instead of eleven. The document is the signed-in user's uid, which is what the
    // Firestore security rules match on — nobody else can read or write it.
    if(!currentUid) throw new Error('Not signed in');
    return window.__firestoreDb__.collection('ledgerData').doc(currentUid);
  }
  // Firestore's SDK can occasionally hang instead of failing outright on a flaky or
  // restricted connection — this makes sure we never wait forever for it. If it doesn't
  // finish in time we treat it as failed and fall back to the local cache, same as any
  // other Firestore error.
  function withTimeout(promise, ms, label){
    ms = ms || 8000;
    return Promise.race([
      promise,
      new Promise((_, reject)=> setTimeout(()=> reject(new Error((label||'Firestore request')+' timed out')), ms))
    ]);
  }
  // The Firebase <script> tags are loaded with `defer` (so they don't block first paint),
  // which means they may not have finished loading yet when we first want to talk to
  // Firestore. Poll briefly for readiness rather than assuming it's there.
  function waitForFirebase(timeoutMs){
    timeoutMs = timeoutMs || 4000;
    return new Promise((resolve)=>{
      const start = Date.now();
      (function check(){
        if(window.__FIREBASE_READY__){ resolve(true); return; }
        if(window.firebase && window.firebase.initializeApp && window.firebase.auth){
          try{
            window.__firebaseApp__ = firebase.initializeApp(window.__FIREBASE_CONFIG__);
            window.__firestoreDb__ = firebase.firestore();
            window.__firebaseAuth__ = firebase.auth();
            window.__FIREBASE_READY__ = true;
          }catch(e){
            console.error('Firebase failed to initialize:', e);
            window.__FIREBASE_READY__ = false;
          }
          resolve(window.__FIREBASE_READY__);
          return;
        }
        if(Date.now()-start > timeoutMs){ resolve(false); return; } // give up, stay offline-first
        setTimeout(check, 50);
      })();
    });
  }
  async function storageGetSingle(key){
    // Fallback path for the window.storage (Claude artifact) environment only —
    // the deployed Firebase path never calls this.
    if(window.storage){
      try{ return await window.storage.get(key, false); }catch(e){ /* fall through */ }
    }
    try{
      const v = localStorage.getItem(LS_PREFIX+key);
      return v!=null ? {key, value:v, shared:false} : null;
    }catch(e){ return null; }
  }
  async function storageSet(key, value){
    // Always mirror to localStorage first — cheap, and guarantees nothing is lost even if the
    // network call below fails.
    try{ localStorage.setItem(LS_PREFIX+key, value); }catch(e){}
    if(window.__FIREBASE_READY__ || await waitForFirebase(1500)){
      try{
        await withTimeout(fsAllDoc().set({[key]: value, [key+'_updatedAt']: new Date().toISOString()}, {merge:true}), 8000, 'Cloud save');
        return {key, value, shared:false};
      }catch(e){
        console.error('Firestore save failed, kept in local cache:', e);
        toast('Cloud save failed — kept locally, will retry next save');
        return {key, value, shared:false};
      }
    }
    if(window.storage){
      try{ return await window.storage.set(key, value, false); }catch(e){ /* fall through */ }
    }
    return {key, value, shared:false};
  }

  // Reads straight from this browser's local cache, synchronously, so the very first
  // renderAll() has real data to show instead of a blank "Loading…" screen.
  function loadLocalCache(){
    STORAGE_KEYS.forEach(([prop,key])=>{
      try{
        const raw = localStorage.getItem(LS_PREFIX+key);
        if(raw != null) lastPersisted[key] = raw;
        if(prop==='settings'){
          state.settings = Object.assign({}, DEFAULT_SETTINGS, raw ? JSON.parse(raw) : {});
        }else{
          state[prop] = raw ? JSON.parse(raw) : [];
        }
      }catch(e){
        if(prop==='settings') state.settings = Object.assign({}, DEFAULT_SETTINGS);
        else state[prop] = [];
      }
    });
    state.loaded = true;
  }

  async function seedDefaultsIfEmpty(){
    if(state.pricelist.length === 0){
      state.pricelist = defaultPriceList();
      await save('pricelist');
    }
    if(state.customers.length === 0){
      state.customers = defaultCustomerRoster();
      await save('customers');
    }
  }

  // Folds a Firestore snapshot of the whole ledger into state. Returns true if anything
  // actually differed from what's already on screen.
  function applyCloudData(data){
    let changed = false;
    STORAGE_KEYS.forEach(([prop,key])=>{
      if(data[key] == null) return;
      try{
        const parsed = prop==='settings'
          ? Object.assign({}, DEFAULT_SETTINGS, JSON.parse(data[key]))
          : JSON.parse(data[key]);
        if(JSON.stringify(state[prop]) !== JSON.stringify(parsed)){
          state[prop] = parsed;
          changed = true;
        }
        lastPersisted[key] = data[key];
        try{ localStorage.setItem(LS_PREFIX+key, data[key]); }catch(e){}
      }catch(e){ /* ignore malformed field, keep local value */ }
    });
    return changed;
  }

  // A remote change arriving mid-edit would wipe whatever is being typed, because every
  // render replaces #lg-content wholesale. If a field is focused we hold the repaint until
  // it's given up focus, rather than yanking the form out from under the user.
  let pendingRemoteRender = false;
  function renderFromRemote(){
    const el = document.activeElement;
    const typing = el && el !== document.body &&
      /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) &&
      document.getElementById('ledger-root').contains(el);
    if(typing){
      if(!pendingRemoteRender){
        pendingRemoteRender = true;
        el.addEventListener('blur', ()=>{
          pendingRemoteRender = false;
          renderAll();
          toast('Updated from your other device');
        }, {once:true});
      }
      return;
    }
    renderAll();
    toast('Updated from your other device');
  }

  // Live subscription: replaces the old one-shot get(). Firestore pushes the whole
  // document whenever it changes anywhere, so a save on the desktop lands on the phone
  // in about a second without a refresh. Local echoes of our own writes are skipped.
  let unsubscribeCloud = null;
  function subscribeToCloud(){
    if(unsubscribeCloud){ unsubscribeCloud(); unsubscribeCloud = null; }
    let first = true;
    unsubscribeCloud = fsAllDoc().onSnapshot(
      {includeMetadataChanges:false},
      (snap)=>{
        // Our own un-acknowledged write bouncing back — state already reflects it.
        if(snap.metadata.hasPendingWrites) return;
        if(!snap.exists){
          const hasLocalData = STORAGE_KEYS.some(([prop])=> prop!=='settings' && Array.isArray(state[prop]) && state[prop].length);
          if(hasLocalData) needsFirebaseMigration = true;
          if(first){ first = false; onCloudFirstLoad(); }
          return;
        }
        const changed = applyCloudData(snap.data() || {});
        if(first){
          first = false;
          if(changed) renderAll();
          onCloudFirstLoad();
        }else if(changed){
          renderFromRemote();
        }
      },
      (err)=>{
        console.error('Live sync dropped, staying on local cache:', err);
        document.getElementById('lg-storage-mode').textContent = '⚠ Offline — saved on this device';
      }
    );
  }
  let cloudFirstLoadDone = null;
  function onCloudFirstLoad(){ if(cloudFirstLoadDone){ cloudFirstLoadDone(); cloudFirstLoadDone = null; } }

  // Waits for the live subscription's first payload so boot can seed defaults / migrate
  // only once the real cloud state is known.
  async function syncFromCloud(){
    const firebaseReady = await waitForFirebase();
    if(firebaseReady && currentUid){
      try{
        await withTimeout(new Promise(res=>{ cloudFirstLoadDone = res; subscribeToCloud(); }), 8000, 'Cloud sync');
      }catch(e){
        console.error('Firestore sync failed, staying on local cache:', e);
      }
    }else if(window.storage){
      // Claude artifact preview environment — no combined-doc concept, fall back to per-key.
      let changed = false;
      await Promise.all(STORAGE_KEYS.map(async ([prop,key])=>{
        try{
          const r = await storageGetSingle(key);
          if(!r || r.value==null) return;
          const parsed = prop==='settings' ? Object.assign({}, DEFAULT_SETTINGS, JSON.parse(r.value)) : JSON.parse(r.value);
          if(JSON.stringify(state[prop]) !== JSON.stringify(parsed)){ state[prop] = parsed; changed = true; }
        }catch(e){ /* keep local value */ }
      }));
      if(changed) renderAll();
    }
    await seedDefaultsIfEmpty();
  }

  const SAVE_KEY_MAP = {jobs:'jobs-v1', pricelist:'pricelist-v1', customers:'customers-v1', materials:'materials-v1', expenses:'expenses-v1', cpspend:'cpspend-v1', cpadjust:'cpadjust-v1', exadjust:'exadjust-v1', quotes:'quotes-v1', recurring:'recurring-v1', settings:'settings-v1'};
  async function save(prop){
    try{
      const value = JSON.stringify(state[prop]);
      const res = await storageSet(SAVE_KEY_MAP[prop], value);
      if(!res){ toast('Save failed — try again'); markSaveStatus(false); }
      else{ lastPersisted[SAVE_KEY_MAP[prop]] = value; markSaveStatus(true); }
    }catch(e){
      toast('Save error: could not reach storage');
      markSaveStatus(false);
    }
  }
  // Saves several state properties in ONE cloud round trip instead of one per property.
  // Use this instead of chaining multiple `await save(x)` calls back to back — those each
  // wait on their own network trip, which is what made buttons like "Save Job" feel frozen.
  async function saveMany(props){
    const payload = {};
    props.forEach(prop=>{
      const key = SAVE_KEY_MAP[prop];
      const value = JSON.stringify(state[prop]);
      try{ localStorage.setItem(LS_PREFIX+key, value); }catch(e){}
      payload[key] = value;
      payload[key+'_updatedAt'] = new Date().toISOString();
    });
    if(window.__FIREBASE_READY__ || await waitForFirebase(1500)){
      try{
        await withTimeout(fsAllDoc().set(payload, {merge:true}), 8000, 'Cloud save');
        props.forEach(prop=>{ lastPersisted[SAVE_KEY_MAP[prop]] = payload[SAVE_KEY_MAP[prop]]; });
        markSaveStatus(true);
        return true;
      }catch(e){
        console.error('Firestore save failed, kept in local cache:', e);
        toast('Cloud save failed — kept locally, will retry next save');
        markSaveStatus(false);
        return false;
      }
    }
    if(window.storage){
      try{
        await Promise.all(props.map(prop=>window.storage.set(SAVE_KEY_MAP[prop], JSON.stringify(state[prop]), false)));
      }catch(e){ /* local cache already has it */ }
    }
    props.forEach(prop=>{ lastPersisted[SAVE_KEY_MAP[prop]] = payload[SAVE_KEY_MAP[prop]]; });
    markSaveStatus(true);
    return true;
  }
  // Disables a button and swaps its label while an async action runs, so a slow save can't
  // be re-triggered by an impatient second click (this is what caused duplicate job entries).
  async function withButtonGuard(btn, busyLabel, fn){
    if(!btn || btn.disabled) return; // already running — ignore the extra click
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = busyLabel;
    try{
      await fn();
    }finally{
      btn.disabled = false;
      btn.textContent = original;
    }
  }
  function markSaveStatus(ok){
    const el = document.getElementById('lg-last-saved');
    if(!el) return;
    const t = new Date().toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    el.textContent = ok ? ('\u2713 Saved ' + t) : ('\u26a0 Save failed ' + t);
    el.style.color = ok ? '' : '#d9534f';
  }
  // Redundant safety net: re-save everything every 5 minutes, even if nothing seems to have
  // changed. This catches the case where an earlier save silently failed (e.g. a storage
  // hiccup) so you're never more than 5 minutes from a confirmed-good save.
  // Previously this fanned out into 11 separate save() calls, i.e. 11 network writes to the
  // SAME Firestore document every 5 minutes regardless of whether anything had changed.
  // Now: stringify once, skip fields already known to be persisted, and hand whatever is
  // left to saveMany() as ONE merge write. An idle ledger costs zero network traffic.
  async function autoSaveAll(force){
    const dirty = Object.keys(SAVE_KEY_MAP).filter(prop=>{
      if(force) return true;
      try{ return lastPersisted[SAVE_KEY_MAP[prop]] !== JSON.stringify(state[prop]); }
      catch(e){ return false; }
    });
    if(!dirty.length) return;
    await saveMany(dirty);
  }

  // ---------- backup / restore ----------
  // Your only copy of this data lives in this one browser's storage on this one device.
  // These let you download a snapshot you can keep somewhere safe, and load it back in —
  // on this device after clearing your browser, or on a different device entirely.
  function downloadBackup(){
    try{
      const payload = {
        exportedAt: new Date().toISOString(),
        app: 'THE DAYBOOK',
        version: 1,
        data: {
          jobs: state.jobs, pricelist: state.pricelist, customers: state.customers,
          materials: state.materials, expenses: state.expenses,
          cpspend: state.cpspend, cpadjust: state.cpadjust, exadjust: state.exadjust, quotes: state.quotes, recurring: state.recurring, settings: state.settings,
        },
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = `daybook-backup-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('Backup downloaded');
      return true;
    }catch(err){
      toast('Backup failed — could not create the file in this browser');
      return false;
    }
  }
  // Clearing the ledger and overwriting it from a backup are the two actions with no undo,
  // and the header keeps them one tap away — easy for someone borrowing the phone to hit.
  // Both now ask for the account password and check it against Firebase: nothing is stored,
  // nothing is compared in the page, and the real password never lands in state. Fails
  // closed — if the check can't run (offline, signed out) the action simply doesn't happen,
  // which is the safe direction for something irreversible.
  function requirePassword({title, warning, confirmLabel}){
    return new Promise(resolve=>{
      // firebase.auth() THROWS if the app never initialised — it doesn't return null. Letting
      // that escape rejected the promise and left the button silently dead, so it's caught here
      // and treated as "cannot verify", which still refuses the action but says why.
      let user = null;
      try{ user = (window.firebase && firebase.auth) ? firebase.auth().currentUser : null; }
      catch(e){ user = null; }
      if(!user || !user.email){
        toast('Cannot check your password right now — sign in again, or check your connection');
        resolve(false); return;
      }
      const root = document.getElementById('lg-modal-root');
      root.innerHTML = `
        <div class="lg-overlay" id="pw-overlay">
          <div class="lg-receipt">
            <h2>${esc(title)}</h2>
            <div class="r-sub">Signed in as ${esc(user.email)}</div>
            <div class="r-dashed"></div>
            <div class="pw-warn">${warning}</div>
            <label for="pw-input" style="display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#555;margin:12px 0 4px;">Account password</label>
            <input type="password" id="pw-input" autocomplete="current-password" placeholder="Your sign-in password"
                   style="width:100%;padding:9px 10px;border:1px solid #bbb;border-radius:4px;font-family:var(--font-mono);font-size:13px;">
            <div class="pw-msg" id="pw-msg"></div>
            <div class="lg-receipt-actions">
              <button class="lg-btn danger small" id="pw-go" type="button">${esc(confirmLabel)}</button>
              <button class="lg-btn ghost small" id="pw-cancel" type="button">Cancel</button>
            </div>
          </div>
        </div>`;
      const input = document.getElementById('pw-input');
      const msg   = document.getElementById('pw-msg');
      const go    = document.getElementById('pw-go');
      const done  = (ok)=>{ root.innerHTML=''; resolve(ok); };
      document.getElementById('pw-cancel').addEventListener('click', ()=>done(false));
      document.getElementById('pw-overlay').addEventListener('click', (e)=>{
        if(e.target.id==='pw-overlay') done(false);
      });
      input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); go.click(); } });
      go.addEventListener('click', async ()=>{
        const pass = input.value;
        if(!pass){ msg.textContent = 'Enter your password to continue.'; msg.className='pw-msg err'; input.focus(); return; }
        go.disabled = true; go.textContent = 'Checking…';
        try{
          const cred = firebase.auth.EmailAuthProvider.credential(user.email, pass);
          await user.reauthenticateWithCredential(cred);
          done(true);
        }catch(err){
          const code = err && err.code;
          msg.textContent = (code==='auth/wrong-password' || code==='auth/invalid-credential')
            ? 'That password is not correct.'
            : friendlyAuthError(code).replace('Could not sign in.', 'Could not check the password.');
          msg.className = 'pw-msg err';
          go.disabled = false; go.textContent = confirmLabel;
          input.value = ''; input.focus();
        }
      });
      setTimeout(()=>input.focus(), 40);
    });
  }

  async function restoreBackup(file){
    let parsed;
    try{
      const text = await file.text();
      parsed = JSON.parse(text);
    }catch(e){
      toast('That file could not be read — is it a DAYBOOK backup .json file?');
      return;
    }
    const d = parsed && parsed.data;
    if(!d || !Array.isArray(d.jobs) || !Array.isArray(d.customers)){
      toast('That file doesn\'t look like a DAYBOOK backup');
      return;
    }
    const jobCount = (d.jobs||[]).length, custCount = (d.customers||[]).length;
    const ok = await requirePassword({
      title: 'Restore from backup',
      warning: `This <b>replaces everything</b> currently in the ledger with the contents of this file
                — ${jobCount} job${jobCount===1?'':'s'} and ${custCount} customer${custCount===1?'':'s'}.
                Your current ${state.jobs.length} job${state.jobs.length===1?'':'s'} will be gone. There is no undo.`,
      confirmLabel: 'Replace everything'
    });
    if(!ok) return;
    state.jobs = d.jobs || [];
    state.pricelist = d.pricelist || [];
    state.customers = d.customers || [];
    state.materials = d.materials || [];
    state.expenses = d.expenses || [];
    state.cpspend = d.cpspend || [];
    state.cpadjust = d.cpadjust || [];
    state.exadjust = d.exadjust || [];
    state.quotes = d.quotes || [];
    state.recurring = d.recurring || [];
    // Restoring from a backup taken before a setting existed must still land on the
    // current defaults, so this derives from DEFAULT_SETTINGS rather than repeating it.
    state.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
    await Promise.all(['jobs','pricelist','customers','materials','expenses','cpspend','cpadjust','exadjust','quotes','recurring','settings'].map(save));
    toast('Backup restored');
    renderAll();
  }

    await saveMany(['jobs','pricelist','customers','materials','expenses','cpspend','cpadjust','exadjust','quotes','recurring','settings']);

  // ---------- derived / aggregation ----------
  function jobMaterialsList(job){
    if(Array.isArray(job.materials) && job.materials.length) return job.materials.map(m=>({name:m.name, qty:Number(m.qty)||0, unitCost:Number(m.unitCost)||0, waste:Number(m.waste)||0}));
    if(job.material){ return [{name: job.material, qty: Number(job.materialQty)||0, unitCost: Number(job.materialUnitCost)||0, waste:0}]; }
    return [];
  }
  function jobTotals(job){
    const rawTotal = (job.items||[]).reduce((s,it)=>s + (Number(it.qty)||0)*(Number(it.unitPrice)||0) + (Number(it.descQty)||0)*(Number(it.descUnitPrice)||0), 0);
    const discount = Math.min(Number(job.discount)||0, rawTotal);
    const totalBilled = rawTotal - discount;
    let totalPaid;
    if(Array.isArray(job.payments) && job.payments.length){
      totalPaid = job.payments.reduce((s,p)=>s+(Number(p.cash)||0)+(Number(p.bank)||0), 0);
    } else {
      // older jobs saved before payment history existed
      totalPaid = (Number(job.paidCash)||0) + (Number(job.paidBank)||0);
    }
    const debt = Math.max(totalBilled - totalPaid, 0);
    const credit = Math.max(totalPaid - totalBilled, 0);
    const cp = Number(job.cp)||0;
    // materialUsedCost / materialWasteCost value the material this job consumed and spoiled at
    // today's price. They don't reduce THIS job's `profit` (which stays billed - cp), but both are
    // deducted at the day/month level to give Net Profit — see dayStats(), monthStats() and the
    // Summary day table. Money spent BUYING stock is a separate figure (materialPurchaseCost*),
    // tracked on the date cash left the till and never deducted from Net Profit.
    const materialUsedCost = jobMaterialsList(job).reduce((s,m)=>s+(Number(m.qty)||0)*(Number(m.unitCost)||0), 0);
    const materialWasteCost = jobMaterialsList(job).reduce((s,m)=>s+(Number(m.waste)||0)*(Number(m.unitCost)||0), 0);
    const profit = totalBilled - cp;
    return {rawTotal, discount, totalBilled, totalPaid, debt, credit, cp, materialUsedCost, materialWasteCost, profit};
  }

  // ---------- due dates ----------
  // A job's promised date. Once it's DELIVERED nothing is overdue any more — the work is out
  // the door, whatever the date says.
  function dueInfo(j){
    if(!j.dueDate) return {has:false, overdue:false, label:'—', note:''};
    const label = fmtDate(j.dueDate);
    if(j.status==='DELIVERED') return {has:true, overdue:false, label, note:''};
    const diff = Math.round((new Date(j.dueDate+'T00:00:00') - new Date(todayISO()+'T00:00:00'))/86400000);
    if(diff < 0)  return {has:true, overdue:true,  days:diff, label, note:`${Math.abs(diff)} day${Math.abs(diff)===1?'':'s'} late`};
    if(diff === 0) return {has:true, overdue:false, soon:true, days:0, label, note:'due today'};
    if(diff === 1) return {has:true, overdue:false, soon:true, days:1, label, note:'due tomorrow'};
    return {has:true, overdue:false, days:diff, label, note:`in ${diff} days`};
  }
  function dueCell(j){
    const d = dueInfo(j);
    if(!d.has) return '<span class="muted">—</span>';
    if(d.overdue) return `<span class="flag">${d.label}<br><span style="font-size:10px;">${d.note}</span></span>`;
    if(d.soon) return `<span style="color:var(--amber-deep);font-weight:600;">${d.label}<br><span style="font-size:10px;">${d.note}</span></span>`;
    return `${d.label}${d.note?`<br><span style="font-size:10px;" class="muted">${d.note}</span>`:''}`;
  }
  function overdueJobs(){
    return state.jobs.filter(j=>dueInfo(j).overdue).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));
  }
  // Sort: soonest promised date first, jobs with no date last.
  function byDueThenDate(a,b){
    const ad = a.dueDate || '9999-12-31', bd = b.dueDate || '9999-12-31';
    if(ad !== bd) return ad.localeCompare(bd);
    return (a.dateReceived||'').localeCompare(b.dateReceived||'');
  }

  // ---------- CSV export ----------
  // Opens in Excel, Google Sheets, or anything an accountant uses. The JSON backup is for
  // restoring the app; this is for working with the numbers elsewhere.
  function csvCell(v){
    const s = String(v==null?'':v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }
  function downloadCSV(filename, rows){
    try{
      const csv = rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
      const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('Downloaded ' + filename);
    }catch(err){
      toast('Export failed — this browser blocked the download');
    }
  }
  function plainNum(n){ return Number(n)||0; }

  // ---------- simple bar chart (hand-rolled SVG, no libraries) ----------
  function barChartSVG(data, opts){
    opts = opts || {};
    const w = 720, h = opts.height || 150, padL = 8, padB = 22, padT = 10;
    if(!data.length) return '<div class="lg-empty">Nothing to chart yet.</div>';
    const max = Math.max(...data.map(d=>Math.abs(d.value)), 1);
    const bw = (w - padL*2) / data.length;
    const bars = data.map((d,i)=>{
      const bh = Math.max((Math.abs(d.value)/max) * (h-padT-padB), d.value?2:0);
      const x = padL + i*bw;
      const y = h - padB - bh;
      const colour = d.value < 0 ? 'var(--clay)' : (opts.colour || 'var(--teal)');
      return `<rect x="${(x+bw*0.15).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${bh.toFixed(1)}" fill="${colour}" opacity="0.85"><title>${esc(d.label)}: ${naira(d.value)}</title></rect>`
        + (d.tick ? `<text x="${(x+bw/2).toFixed(1)}" y="${h-8}" font-size="9" fill="var(--muted)" text-anchor="middle" font-family="ui-monospace,monospace">${esc(d.tick)}</text>` : '');
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;" role="img" aria-label="${esc(opts.title||'chart')}">
      <line x1="${padL}" y1="${h-padB}" x2="${w-padL}" y2="${h-padB}" stroke="var(--ink)" stroke-width="1.5"/>
      ${bars}
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:2px;">
      <span>${esc(opts.left||'')}</span><span>peak ${naira(max)}</span><span>${esc(opts.right||'')}</span>
    </div>`;
  }

  // ---------- WhatsApp receipt sharing (no backend — opens wa.me with the message pre-filled) ----------
  function waPhoneDigits(phone){
    let d = (phone||'').replace(/[^0-9]/g,'');
    if(!d) return '';
    if(d.startsWith('0')) d = '234' + d.slice(1);          // local Nigerian format -> country code
    else if(d.length===10 && !d.startsWith('234')) d = '234' + d; // typed without the leading 0
    return d;
  }
  function waLink(phone, text){
    const digits = waPhoneDigits(phone);
    if(!digits) return '';
    return `https://wa.me/${digits}?text=${encodeURIComponent(text)}`;
  }

  function recomputeAllCustomers(){
    // start from the existing roster (keeps name+phone for customers with no jobs yet),
    // then fold in stats from every job — adding any customer typed on a job that isn't in the roster.
    const map = new Map();
    state.customers.forEach(c=>{
      if(c.name === 'WALKIN') return;
      map.set(c.name, {name:c.name, phone:c.phone||'', jobCount:0, totalBilled:0, totalPaid:0, totalDebt:0, lastDate:c.lastDate||'',
        openingDebt: Number(c.openingDebt)||0, openingDebtPayments: c.openingDebtPayments||[]});
    });
    state.jobs.forEach(j=>{
      const key = normName(j.customerName || 'WALKIN');
      if(!map.has(key)) map.set(key, {name:key, phone:'', jobCount:0, totalBilled:0, totalPaid:0, totalDebt:0, lastDate:'', openingDebt:0, openingDebtPayments:[]});
      const c = map.get(key);
      if(j.phone) c.phone = j.phone;
      const t = jobTotals(j);
      c.jobCount += 1;
      c.totalBilled += t.totalBilled;
      c.totalPaid += t.totalPaid;
      c.totalDebt += t.debt;
      if(!c.lastDate || j.dateReceived > c.lastDate) c.lastDate = j.dateReceived;
    });
    map.forEach(c=>{
      const paidOnOpening = (c.openingDebtPayments||[]).reduce((s,p)=>s+(Number(p.cash)||0)+(Number(p.bank)||0),0);
      c.openingDebtRemaining = c.openingDebt - paidOnOpening;
      c.totalDebt += c.openingDebtRemaining;
    });
    state.customers = Array.from(map.values());
  }

  function allOldDebtPayments(){
    const list = [];
    state.customers.forEach(c=>{
      (c.openingDebtPayments||[]).forEach(p=> list.push({customerName:c.name, date:p.date, cash:Number(p.cash)||0, bank:Number(p.bank)||0, note:p.note||'Old debt payment'}));
    });
    return list;
  }
  // "Material Cost" as a business expense = money spent buying new stock (from the Stock Purchase
  // Log on the Inventory tab), attributed to the date each purchase was made — not the cost of
  // whatever happened to be used on a job. This lines up with how cash actually leaves the till.
  function materialPurchaseCostOnDate(dateStr){
    return allStockPurchases().filter(p=>p.date===dateStr).reduce((s,p)=>s+p.qty*p.unitCost, 0);
  }
  function materialPurchaseCostInRange(fromDate, toDate){
    return allStockPurchases().filter(p=>p.date>=fromDate && p.date<=toDate).reduce((s,p)=>s+p.qty*p.unitCost, 0);
  }
  function monthStats(){
    recomputeAllCustomers();
    const now = new Date(); const ym = now.toISOString().slice(0,7);
    const monthStart = ym+'-01', monthEnd = ym+'-31';
    const monthJobs = state.jobs.filter(j => (j.dateReceived||'').slice(0,7) === ym);
    let billed=0,paid=0,debt=0,cp=0,matCostUsed=0,matWasteCost=0;
    monthJobs.forEach(j=>{
      const t=jobTotals(j); billed+=t.totalBilled; paid+=t.totalPaid; debt+=t.debt; cp+=t.cp;
      matCostUsed += t.materialUsedCost; matWasteCost += t.materialWasteCost;
    });
    const matCost = materialPurchaseCostInRange(monthStart, monthEnd);
    const monthExpenses = state.expenses.filter(e=>(e.date||'').slice(0,7)===ym);
    const monthExpenseTotal = monthExpenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
    const todayJobs = state.jobs.filter(j=>j.dateReceived===todayISO());
    let tbilled=0,tpaid=0,todayMatCostUsed=0,todayMatWasteCost=0;
    todayJobs.forEach(j=>{ const t=jobTotals(j); tbilled+=t.totalBilled; tpaid+=t.totalPaid; todayMatCostUsed+=t.materialUsedCost; todayMatWasteCost+=t.materialWasteCost; });
    const todayJobIncome = tpaid;
    const todayMatCost = materialPurchaseCostOnDate(todayISO());
    const oldPays = allOldDebtPayments();
    const oldPaidMonth = oldPays.filter(p=>(p.date||'').slice(0,7)===ym).reduce((s,p)=>s+p.cash+p.bank,0);
    const oldPaidToday = oldPays.filter(p=>p.date===todayISO()).reduce((s,p)=>s+p.cash+p.bank,0);
    paid += oldPaidMonth; tpaid += oldPaidToday;
    const outstandingOld = state.customers.reduce((s,c)=>s+Math.max(c.openingDebtRemaining||0,0),0);
    const outstanding = state.jobs.reduce((s,j)=>s+jobTotals(j).debt,0) + outstandingOld;
    const byStatus = {};
    STATUSES.forEach(s=>byStatus[s]=0);
    state.jobs.forEach(j=>{ byStatus[j.status] = (byStatus[j.status]||0)+1; });
    return {billed, paid, debt, cp, matCost, todayMatCost, matCostUsed, todayMatCostUsed, matWasteCost, todayMatWasteCost,
            profit: paid-cp-matCostUsed-matWasteCost, collectionRate: billed? paid/billed:0,
            monthExpenseTotal, netCash: paid - monthExpenseTotal - matCost,
            todayBilled:tbilled, todayJobIncome, todayPaid:tpaid, oldDebtPaidToday:oldPaidToday, oldDebtPaidMonth:oldPaidMonth,
            outstanding, outstandingOld, byStatus, jobCount: monthJobs.length};
  }
