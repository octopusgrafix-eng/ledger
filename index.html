      </select>
      <div class="lg-row-actions" style="margin-top:6px;">
        <button class="subtle-link job-guide-toggle" data-id="${j.id}">what to do</button>
        ${t.debt>0 ? `<button class="subtle-link job-payment-toggle" data-id="${j.id}">record payment</button>` : ''}
        <button class="subtle-link job-waste-toggle" data-id="${j.id}">record waste</button>
        <button class="subtle-link job-cp-toggle" data-id="${j.id}">details</button>
        ${j.phone?`<a class="subtle-link" href="${waLink(j.phone, statusWaText(j))}" target="_blank" rel="noopener">notify</a>`:''}
        ${(job=>job.payments&&job.payments.length)(j) ? `<button class="subtle-link job-receipt" data-id="${j.id}">receipt</button>` : ''}
        <button class="subtle-link job-delete" data-id="${j.id}">remove</button>
      </div>
      ${openGuideId===j.id ? renderGuideBlock(j) : ''}
      ${openPaymentId===j.id ? renderPaymentForm(j) : ''}
      ${openWasteId===j.id ? renderWasteForm(j) : ''}
      ${openCPId===j.id ? renderCPForm(j) : ''}
    </div>`;
  }
  function renderPaymentForm(j){
    const t = jobTotals(j);
    return `<div class="pay-form" data-id="${j.id}" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">Balance owed: ${naira(t.debt)}</div>
      <div class="lg-grid cols-2">
        <div><label style="margin-top:0">Cash</label><input class="pay-cash" type="number" min="0" value="0"></div>
        <div><label style="margin-top:0">Bank</label><input class="pay-bank" type="number" min="0" value="0"></div>
      </div>
      <div class="lg-row-actions" style="margin-top:6px;">
        <button class="lg-btn small pay-submit" data-id="${j.id}" type="button">Add Payment</button>
        <button class="lg-btn ghost small pay-cancel" type="button">Cancel</button>
      </div>
      ${(j.payments&&j.payments.length) ? `<div style="margin-top:8px;font-size:11px;color:var(--muted);">
        ${j.payments.map(p=>`${fmtDate(p.date)} — ${naira((Number(p.cash)||0)+(Number(p.bank)||0))}${p.note?' ('+p.note+')':''}`).join('<br>')}
      </div>` : ''}
    </div>`;
  }
  function renderWasteForm(j){
    const materials = jobMaterialsList(j);
    const options = materials.length ? materials.map(m=>m.name) : [];
    return `<div class="pay-form" data-id="${j.id}" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">Record material that got spoiled/wasted on this job — paper jam, misprint, etc. This deducts from stock and counts as a cost, just like material actually used.</div>
      <div class="lg-grid cols-2">
        <div><label style="margin-top:0">Material</label>
          <input class="waste-material" list="waste-material-list-${j.id}" placeholder="e.g. A4" value="${options[0]?esc(options[0]):''}">
          <datalist id="waste-material-list-${j.id}">${state.materials.map(m=>`<option value="${esc(m.name)}">`).join('')}</datalist>
        </div>
        <div><label style="margin-top:0">Qty wasted</label><input class="waste-qty" type="number" min="0" value="0"></div>
      </div>
      <div class="lg-row-actions" style="margin-top:6px;">
        <button class="lg-btn small waste-submit" data-id="${j.id}" type="button">Add Waste</button>
        <button class="lg-btn ghost small waste-cancel" type="button">Cancel</button>
      </div>
      ${materials.some(m=>Number(m.waste)>0) ? `<div style="margin-top:8px;font-size:11px;color:var(--muted);">
        Already recorded: ${materials.filter(m=>Number(m.waste)>0).map(m=>`${esc(m.name)} ×${m.waste}`).join(', ')}
      </div>` : ''}
    </div>`;
  }
  function renderCPForm(j){
    return `<div class="pay-form" data-id="${j.id}" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">Cost of Production is often only known once the job is done. Operator and promised date can be filled in or changed here too.</div>
      <div class="lg-grid cols-3">
        <div><label style="margin-top:0">Cost of Production (\u20a6)</label><input class="cp-value" type="number" min="0" value="${Number(j.cp)||0}"></div>
        <div><label style="margin-top:0">Operator</label><input class="cp-operator" value="${esc(j.operator||'')}" list="lg-operator-list" placeholder="who's handling it"></div>
        <div><label style="margin-top:0">Promised / Due Date</label><input class="cp-due" type="date" value="${esc(j.dueDate||'')}"></div>
      </div>
      <datalist id="lg-operator-list">${knownOperators().map(o=>`<option value="${esc(o)}">`).join('')}</datalist>
      <div class="lg-row-actions" style="margin-top:6px;">
        <button class="lg-btn small cp-submit" data-id="${j.id}" type="button">Save details</button>
        <button class="lg-btn ghost small cp-cancel" type="button">Cancel</button>
      </div>
    </div>`;
  }
  function knownOperators(){
    const set = new Set();
    state.jobs.forEach(j=>{ if((j.operator||'').trim()) set.add(j.operator.trim()); });
    return Array.from(set).sort();
  }
  function renderJobsTable(jobs, withActions){
    if(!jobs.length) return '<div class="lg-empty">No jobs yet</div>';
    return `<table><thead><tr>
      <th>Date</th><th>Customer</th><th>Description</th><th>Due</th><th>Status</th>
      <th class="num-col">Billed</th><th class="num-col">Paid</th><th class="num-col">Debt</th>${withActions?'<th></th>':''}
    </tr></thead><tbody>
    ${jobs.map(j=>{
      const t = jobTotals(j);
      return `<tr>
        <td>${fmtDate(j.dateReceived)}</td>
        <td>${esc(j.customerName)}</td>
        <td class="muted">${esc(j.description || (j.items[0]?j.items[0].service:'—'))}</td>
        <td style="font-size:11.5px;">${dueCell(j)}</td>
        <td>${withActions ? `<select class="job-status-select" data-id="${j.id}">${STATUSES.map(s=>`<option value="${s}" ${s===j.status?'selected':''}>${s}</option>`).join('')}</select>` : `<span class="stamp ${STATUS_CLASS[j.status]}">${j.status}</span>`}</td>
        <td class="num-col">${naira(t.totalBilled)}</td>
        <td class="num-col">${naira(t.totalPaid)}</td>
        <td class="num-col ${t.debt>0?'flag':''}">${
          // The owed figure is itself the way to settle it. The 'pay' link lives in the
          // actions column, which is the last of nine and scrolls off-screen entirely on
          // a phone — so the debt you can see is the control you can reach.
          t.debt>0 && withActions
            ? `<button class="owed-pay job-payment-toggle" data-id="${j.id}" title="Record a payment against this job">${naira(t.debt)}</button>`
            : (t.debt>0 ? naira(t.debt) : (t.credit>0?naira(-t.credit):naira(0)))
        }</td>
        ${withActions?`<td class="lg-row-actions"><button class="subtle-link job-guide-toggle" data-id="${j.id}">what to do</button>${t.debt>0?`<button class="subtle-link job-payment-toggle" data-id="${j.id}">pay</button>`:''}<button class="subtle-link job-waste-toggle" data-id="${j.id}">waste</button><button class="subtle-link job-cp-toggle" data-id="${j.id}">details</button>${j.phone?`<a class="subtle-link" href="${waLink(j.phone, statusWaText(j))}" target="_blank" rel="noopener" title="Send this customer a status update on WhatsApp">notify</a>`:''}${(j.payments&&j.payments.length)?`<button class="subtle-link job-receipt" data-id="${j.id}">receipt</button>`:''}<button class="subtle-link job-delete" data-id="${j.id}">remove</button></td>`:''}
      </tr>
      ${withActions && openGuideId===j.id ? `<tr><td colspan="9" style="padding-top:0;">${renderGuideBlock(j)}</td></tr>` : ''}
      ${withActions && openPaymentId===j.id ? `<tr><td colspan="9" style="padding-top:0;">${renderPaymentForm(j)}</td></tr>` : ''}
      ${withActions && openWasteId===j.id ? `<tr><td colspan="9" style="padding-top:0;">${renderWasteForm(j)}</td></tr>` : ''}
      ${withActions && openCPId===j.id ? `<tr><td colspan="9" style="padding-top:0;">${renderCPForm(j)}</td></tr>` : ''}`;
    }).join('')}
    </tbody></table>`;
  }
  function defaultJobsReRender(){
    renderJobsBody(jobsSearch);
  }

  // ---------- PENDING JOBS ----------
  // Anything not yet DELIVERED lands here automatically — including brand-new jobs and any
  // backlog you log (via New Job, using its real intake date) for work that was already
  // in progress before this ledger existed.
  let pendingSearch = '';
  // renderPending() rebuilds the entire tab, which destroys and recreates #pd-search.
  // These carry focus + caret across that rebuild so typing isn't interrupted, and
  // debounce the rebuild so it runs once after typing settles instead of per keystroke.
  let pendingSearchTimer = null, pendingSearchFocused = false, pendingSearchCaret = 0;
  function pendingJobsList(q){
    // Every job that isn't delivered yet, whatever day it came in on — work left
    // unfinished yesterday is still outstanding today and has to roll over.
    // Deliberately does NOT use filteredJobs(), whose date filter belongs to the
    // Jobs tab and was previously hiding the entire backlog from this list.
    return state.jobs
      .filter(j => j.status!=='DELIVERED' && matchesJobQuery(j, q))
      .sort(byDueThenDate);
  }
  function renderPending(){
    const jobs = pendingJobsList(pendingSearch);
    const totalBilled = jobs.reduce((s,j)=>s+jobTotals(j).totalBilled,0);
    const totalOwed = jobs.reduce((s,j)=>s+jobTotals(j).debt,0);
    const lateCount = jobs.filter(j=>dueInfo(j).overdue).length;
    content.innerHTML = `
      <div class="lg-card">
        <div class="lg-card-title">Pending Jobs — anything not yet Delivered</div>
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">
          This list keeps itself up to date — every job you create in New Job stays here until you mark it Delivered, soonest promised date first. Jobs with no promised date sit at the bottom.
          Got jobs that were already in progress before you started using this ledger? Log them in New Job with their real (past) intake date — they'll show up here right away, right alongside new work.
        </div>
        <div class="lg-row-actions">
          <button class="lg-btn" id="pd-add" type="button">+ Enter a Pending / Backlog Job</button>
          <input id="pd-search" placeholder="Search customer or description…" style="max-width:240px;" value="${esc(pendingSearch)}">
          <button class="lg-btn ghost small" id="pd-export" type="button">\u2b07 Export CSV</button>
        </div>
      </div>
      <div class="lg-grid cols-4">
        <div class="lg-card lg-kpi"><div class="num">${jobs.length}</div><div class="lbl">Jobs Pending</div></div>
        <div class="lg-card lg-kpi ${lateCount?'debt':''}"><div class="num">${lateCount}</div><div class="lbl">Past Promised Date</div></div>
        <div class="lg-card lg-kpi"><div class="num">${naira(totalBilled)}</div><div class="lbl">Total Value Pending</div></div>
        <div class="lg-card lg-kpi debt"><div class="num">${naira(totalOwed)}</div><div class="lbl">Still Owed on These</div></div>
      </div>
      <div class="lg-card">${renderJobsTable(jobs, true)}</div>
    `;
    document.getElementById('pd-add').addEventListener('click', ()=>{ state.tab='newjob'; renderAll(); });
    document.getElementById('pd-export').addEventListener('click', ()=>exportJobsCSV(jobs, 'pending-jobs'));
    const search = document.getElementById('pd-search');
    if(pendingSearchFocused){
      search.focus();
      try{ search.setSelectionRange(pendingSearchCaret, pendingSearchCaret); }catch(e){}
      pendingSearchFocused = false;
    }
    search.addEventListener('input', ()=>{
      pendingSearch = search.value;
      pendingSearchCaret = search.selectionStart;
      pendingSearchFocused = true;
      clearTimeout(pendingSearchTimer);
      pendingSearchTimer = setTimeout(renderPending, 180);
    });
    attachStatusHandlers(renderPending);
    attachDeleteHandlers(renderPending);
    attachPaymentHandlers(renderPending);
    attachWasteHandlers(renderPending);
    attachCPHandlers(renderPending);
    attachGuideHandlers(renderPending);
  }
  function attachStatusHandlers(reRender){
    reRender = reRender || defaultJobsReRender;
    document.querySelectorAll('.job-status-select').forEach(sel=>{
      sel.addEventListener('change', async ()=>{
        const j = state.jobs.find(j=>j.id===sel.dataset.id);
        if(!j) return;
        j.status = sel.value;
        j.history = j.history||[];
        j.history.push({status:sel.value, date: todayISO(), at: nowISO()});
        await save('jobs');
        toast(j.customerName + ' → ' + sel.value);
        reRender();
      });
    });
  }
  function attachDeleteHandlers(reRender){
    reRender = reRender || defaultJobsReRender;
    document.querySelectorAll('.job-delete').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        await withButtonGuard(e.currentTarget, 'Removing…', async ()=>{
          state.jobs = state.jobs.filter(j=>j.id!==btn.dataset.id);
          recomputeAllCustomers();
          await saveMany(['jobs','customers']);
          toast('Job removed');
          reRender();
        });
      });
    });
  }
  function attachGuideHandlers(reRender){
    reRender = reRender || defaultJobsReRender;
    document.querySelectorAll('.job-guide-toggle').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        openGuideId = (openGuideId===btn.dataset.id) ? null : btn.dataset.id;
        reRender();
      });
    });
    document.querySelectorAll('.stage-at').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const j = state.jobs.find(x=>x.id===inp.dataset.id);
        if(!j) return;
        const entry = (j.history||[]).find(x=>x.status===inp.dataset.status);
        if(!entry) return;
        if(!inp.value){
          delete entry.at;                       // cleared — back to "not timed"
        }else{
          const d = new Date(inp.value);         // datetime-local parses as local time
          if(isNaN(d)){ toast('That date and time could not be read'); return; }
          entry.at = d.toISOString();
          entry.date = entry.at.slice(0,10);     // keep the date field consistent
        }
        await save('jobs');
        const prod = productionMs(j);
        toast(prod!=null ? ('Updated — production took ' + fmtDuration(prod)) : 'Time updated');
        reRender();
      });
    });
    document.querySelectorAll('.guide-chk').forEach(cb=>{
      cb.addEventListener('change', async ()=>{
        const j = state.jobs.find(j=>j.id===cb.dataset.id);
        if(!j) return;
        const idx = Number(cb.dataset.idx);
        j.checklist = j.checklist || {};
        const arr = j.checklist[j.status] || [];
        arr[idx] = cb.checked;
        j.checklist[j.status] = arr;
        await save('jobs');
        reRender();
      });
    });
  }
  function attachPaymentHandlers(reRender){
    reRender = reRender || defaultJobsReRender;
    document.querySelectorAll('.job-payment-toggle').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        openPaymentId = (openPaymentId===btn.dataset.id) ? null : btn.dataset.id;
        reRender();
      });
    });
    document.querySelectorAll('.pay-cancel').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        openPaymentId = null;
        reRender();
      });
    });
    document.querySelectorAll('.job-receipt').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const j = state.jobs.find(j=>j.id===btn.dataset.id);
        if(!j || !j.payments || !j.payments.length) return;
        const last = j.payments[j.payments.length-1];
        await showReceipt(j, (Number(last.cash)||0)+(Number(last.bank)||0), {cash:Number(last.cash)||0, bank:Number(last.bank)||0});
      });
    });
    document.querySelectorAll('.pay-submit').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const form = btn.closest('.pay-form');
        const cash = Number(form.querySelector('.pay-cash').value)||0;
        const bank = Number(form.querySelector('.pay-bank').value)||0;
        if(cash<=0 && bank<=0){ toast('Enter a cash or bank amount'); return; }
        const j = state.jobs.find(j=>j.id===btn.dataset.id);
        if(!j) return;
        j.payments = j.payments || [];
        j.payments.push({date: todayISO(), cash, bank, note:'Payment'});
        recomputeAllCustomers();
        await saveMany(['jobs','customers']);
        toast('Payment recorded — ' + naira(cash+bank));
        openPaymentId = null;
        reRender();
        await showReceipt(j, cash+bank, {cash, bank});
      });
    });
  }

  function attachWasteHandlers(reRender){
    reRender = reRender || defaultJobsReRender;
    document.querySelectorAll('.job-waste-toggle').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        openWasteId = (openWasteId===btn.dataset.id) ? null : btn.dataset.id;
        reRender();
      });
    });
    document.querySelectorAll('.waste-cancel').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        openWasteId = null;
        reRender();
      });
    });
    document.querySelectorAll('.waste-submit').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const form = btn.closest('.pay-form');
        const materialName = form.querySelector('.waste-material').value.trim();
        const qty = Number(form.querySelector('.waste-qty').value)||0;
        if(!materialName){ toast('Enter a material name'); return; }
        if(qty<=0){ toast('Enter a quantity greater than 0'); return; }
        const j = state.jobs.find(j=>j.id===btn.dataset.id);
        if(!j) return;
        j.materials = jobMaterialsList(j); // normalize old single-material jobs into the array format
        const key = normName(materialName);
        let m = j.materials.find(mm=>normName(mm.name)===key);
        if(m){
          m.waste = (Number(m.waste)||0) + qty;
        } else {
          // material wasn't already on this job — look up its going rate so the cost is still counted
          const known = state.materials.find(mm=>normName(mm.name)===key);
          j.materials.push({name: materialName, qty:0, unitCost: known?known.unitCost:0, waste: qty});
          if(!known){
            state.materials.push({id: uid(), name: materialName, unit:'unit', unitCost:0, opening:0, restocked:0, reorderLevel:0});
            await save('materials');
          }
        }
        await save('jobs');
        toast('Waste recorded — ' + materialName + ' \u00d7' + qty);
        openWasteId = null;
        reRender();
      });
    });
  }

  function attachCPHandlers(reRender){
    reRender = reRender || defaultJobsReRender;

  // ---------- INVENTORY ----------
  function computeMaterialUsage(){
    const map = {}; // NORM_KEY -> {qty, cost, waste, wasteCost}
    state.jobs.forEach(j=>{
      jobMaterialsList(j).forEach(m=>{
        if(!m.name) return;
        const key = normName(m.name);
        if(!map[key]) map[key] = {qty:0, cost:0, waste:0, wasteCost:0};
        map[key].qty += Number(m.qty)||0;
        map[key].cost += (Number(m.qty)||0) * (Number(m.unitCost)||0);
        map[key].waste += Number(m.waste)||0;
        map[key].wasteCost += (Number(m.waste)||0) * (Number(m.unitCost)||0);
      });
    });
    return map;
  }
  function computeDailyMaterialUsage(){
    const map = {}; // NORM_KEY -> {date: {qty, cost}}
    state.jobs.forEach(j=>{
      if(!j.dateReceived) return;
      jobMaterialsList(j).forEach(m=>{
        if(!m.name) return;
        const key = normName(m.name);
        if(!map[key]) map[key] = {};
        if(!map[key][j.dateReceived]) map[key][j.dateReceived] = {qty:0, cost:0};
        map[key][j.dateReceived].qty += Number(m.qty)||0;
        map[key][j.dateReceived].cost += (Number(m.qty)||0) * (Number(m.unitCost)||0);
      });
    });
    return map;
  }
  function totalRestocked(m){
    const legacy = Number(m.restocked)||0;
    const logged = (m.purchases||[]).reduce((s,p)=>s+(Number(p.qty)||0),0);
    return legacy + logged;
  }
  function allStockPurchases(){
    const list = [];
    state.materials.forEach(m=>{
      (m.purchases||[]).forEach(p=>{
        list.push({materialId:m.id, materialName:m.name, unit:m.unit, date:p.date, qty:Number(p.qty)||0, unitCost:Number(p.unitCost)||0, note:p.note||'', purchaseId:p.id});
      });
    });
    return list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  }

  // ---------- material purse (Inventory tab) ----------
  // Works exactly like the CP Account purse, for material instead of production money.
  // IN  = the material charged against each job (used + wasted), keyed to the job intake date.
  //       This is the same figure that comes out of Net Profit, so the purse collects precisely
  //       what the profit calculation already gave up.
  // OUT = money spent restocking, keyed to the purchase date.
  // Restocking is therefore funded by material already charged out, NOT by profit — buying stock
  // has never entered the Net Profit formula and still doesn't. A negative closing balance means
  // you've restocked beyond what the jobs so far have paid for.
  let matViewDate = todayISO();
  function materialUsedCostOnDate(dateStr){
    return state.jobs.filter(j=>j.dateReceived===dateStr)
      .reduce((s,j)=>s+jobTotals(j).materialUsedCost, 0);
  }
  function materialWasteCostOnDate(dateStr){
    return state.jobs.filter(j=>j.dateReceived===dateStr)
      .reduce((s,j)=>s+jobTotals(j).materialWasteCost, 0);
  }
  function matInflowFor(dateStr){
    return materialUsedCostOnDate(dateStr) + materialWasteCostOnDate(dateStr);
  }
  function matSpentFor(dateStr){ return materialPurchaseCostOnDate(dateStr); }
  // Every date that moves the purse — a day material was charged to a job, or stock was bought.
  function matActiveDates(){
    const set = new Set();
    state.jobs.forEach(j=>{
      if(!j.dateReceived) return;
      const t = jobTotals(j);
      if(t.materialUsedCost || t.materialWasteCost) set.add(j.dateReceived);
    });
    allStockPurchases().forEach(p=>{ if(p.date) set.add(p.date); });
    return Array.from(set).sort();
  }
  function matOpeningFor(dateStr){
    const start = state.settings.matStartDate || '';
    let bal = Number(state.settings.matOpeningFloat)||0;
    matActiveDates().forEach(d=>{
      if(d >= dateStr) return;
      if(start && d < start) return;
      bal += matInflowFor(d) - matSpentFor(d);
    });
    return bal;
  }
  function matCostDayRow(dateStr){
    const bought = materialPurchaseCostOnDate(dateStr);
    const used   = materialUsedCostOnDate(dateStr);
    const wasted = materialWasteCostOnDate(dateStr);
    const opening = matOpeningFor(dateStr);
    const inflow = used + wasted;
    return {bought, used, wasted, deducted: inflow,
            opening, inflow, spent: bought,
            available: opening + inflow,
            closing: opening + inflow - bought};
  }
  function matCostMonthTable(ym){
    const [yy, mm] = ym.split('-').map(Number);
    const n = daysInMonth(yy, mm-1);
    const pad = x=>String(x).padStart(2,'0');
    let running = matOpeningFor(`${ym}-01`);
    const monthOpening = running;
    let rows = '', inTotal = 0, outTotal = 0, shown = 0;
    for(let d=1; d<=n; d++){
      const date = `${ym}-${pad(d)}`;
      const inflow = matInflowFor(date);
      const spent  = matSpentFor(date);
      const opening = running;
      running = opening + inflow - spent;
      if(!inflow && !spent) continue;
      shown++;
      inTotal += inflow; outTotal += spent;
      const isToday = date === matViewDate;
      rows += `<tr style="${isToday?'background:rgba(185,121,28,0.10);font-weight:600;':''}">
        <td><button class="subtle-link mat-jump" data-date="${date}">${fmtDate(date)}</button></td>
        <td class="num-col">${naira(opening)}</td>

  function renderMaterialsTable(){

  function renderStockUsageGrid(){
    const dailyMap = computeDailyMaterialUsage();
    const materialKeys = Object.keys(dailyMap);
    if(materialKeys.length===0) return '<div class="lg-empty">No material usage logged yet — add one on the New Job tab.</div>' + renderNewStockSpendSummary();
    const materialCols = materialKeys.map(k=>{
      const m = state.materials.find(m=>normName(m.name)===k);
      return {key:k, name: m ? m.name : k};
    }).sort((a,b)=>a.name.localeCompare(b.name));

    const datesSet = new Set();
    materialKeys.forEach(k=> Object.keys(dailyMap[k]).forEach(d=>datesSet.add(d)));
    const dates = Array.from(datesSet).sort();

    let rowsHtml = '';
    let weekTotals = {}; materialCols.forEach(m=>weekTotals[m.key]=0);
    let weekRowTotal = 0, weekCostTotal = 0;
    let currentWeek = null;
    const grandTotals = {}; materialCols.forEach(m=>grandTotals[m.key]=0);
    let grandRowTotal = 0, grandCostTotal = 0;

    function flushWeek(){
      if(currentWeek===null) return '';
      return `<tr style="font-weight:700;background:rgba(185,121,28,0.08);">
        <td colspan="2">${currentWeek} TOTAL</td>
        ${materialCols.map(m=>`<td class="num-col">${weekTotals[m.key]}</td>`).join('')}
        <td class="num-col">${weekRowTotal}</td>
        <td class="num-col">${naira(weekCostTotal)}</td>
      </tr>`;
    }

    dates.forEach(date=>{
      const wk = isoWeekLabel(date);
      if(currentWeek!==null && wk!==currentWeek){
        rowsHtml += flushWeek();
        weekTotals = {}; materialCols.forEach(m=>weekTotals[m.key]=0);
        weekRowTotal = 0; weekCostTotal = 0;
      }
      currentWeek = wk;
      let rowTotal = 0, rowCost = 0;
      const cells = materialCols.map(m=>{
        const entry = (dailyMap[m.key] && dailyMap[m.key][date]) || {qty:0, cost:0};
        rowTotal += entry.qty;
        rowCost += entry.cost;
        weekTotals[m.key] += entry.qty;
        grandTotals[m.key] += entry.qty;
        return `<td class="num-col">${entry.qty||'—'}</td>`;
      }).join('');
      weekRowTotal += rowTotal; weekCostTotal += rowCost;
      grandRowTotal += rowTotal; grandCostTotal += rowCost;
      rowsHtml += `<tr><td>${fmtDate(date)}</td><td class="muted">${wk}</td>${cells}<td class="num-col">${rowTotal}</td><td class="num-col">${naira(rowCost)}</td></tr>`;
    });
    rowsHtml += flushWeek();
    rowsHtml += `<tr style="font-weight:700;border-top:2px solid var(--ink);">
      <td colspan="2">GRAND TOTAL</td>
      ${materialCols.map(m=>`<td class="num-col">${grandTotals[m.key]}</td>`).join('')}
      <td class="num-col">${grandRowTotal}</td>
      <td class="num-col">${naira(grandCostTotal)}</td>
    </tr>`;

    const usageTable = `<div style="overflow-x:auto;"><table><thead><tr>
      <th>Date</th><th>Week</th>
      ${materialCols.map(m=>`<th>${esc(m.name)}</th>`).join('')}
      <th>Daily Qty</th><th>Daily Cost (\u20a6)</th>
    </tr></thead><tbody>${rowsHtml}</tbody></table></div>`;

    return usageTable + renderNewStockSpendSummary();
  }
  function renderNewStockSpendSummary(){
    const rows = state.materials
      .map(m=>{
        const logged = (m.purchases||[]).reduce((s,p)=>s+(Number(p.qty)||0),0);
        const loggedSpend = (m.purchases||[]).reduce((s,p)=>s+(Number(p.qty)||0)*(Number(p.unitCost)||0),0);
        const legacyQty = Number(m.restocked)||0;
        const legacySpend = legacyQty * (Number(m.unitCost)||0); // best estimate — no per-purchase history for this portion
        return {name:m.name, restocked: legacyQty+logged, spend: loggedSpend+legacySpend};
      })
      .filter(r=>r.restocked>0)
      .sort((a,b)=>b.spend-a.spend);
    const grandSpend = rows.reduce((s,r)=>s+r.spend,0);
    if(!rows.length){
      return `<div style="margin-top:16px;padding-top:12px;border-top:1px dashed var(--rule);">
        <div class="lg-card-title" style="margin-top:0;">Money Spent on New Stock</div>
        <div class="lg-empty">No stock purchases recorded yet — use "Record Stock Purchase" on the Inventory tab when you buy new material.</div>
      </div>`;
    }
    return `<div style="margin-top:16px;padding-top:12px;border-top:1px dashed var(--rule);">
      <div class="lg-card-title" style="margin-top:0;">Money Spent on New Stock</div>
      <div style="font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:8px;">
        Based on your logged stock purchases (real cost paid at the time) — for comparison against the material cost actually used on jobs (Grand Total, above).
      </div>
      <div style="overflow-x:auto;"><table><thead><tr>
        <th>Material</th><th class="num-col">Restocked Qty</th><th class="num-col">Money Spent (\u20a6)</th>
      </tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="num-col">${r.restocked}</td><td class="num-col">${naira(r.spend)}</td></tr>`).join('')}

      </tbody></table></div>
    </div>`;
  }

  // ---------- EXPENSES ----------
  // The Expenses tab runs as a purse, same idea as the CP Account: each day the EX share of
  // that day's Net Profit drops in, the expenses you log are what comes out, and the
  // remainder carries into the next day. The expense entries themselves are unchanged —
  // they still feed Net Cash exactly as before. The purse is a layer on top that answers
  // "is there still expense money left, and how much did I carry over?"
  let expensesViewDate = todayISO();

  // Net Profit for one day, mirroring dayStats() — money collected that day, less the cost
  // of production and material used/wasted on jobs received that day.
  function exNetProfitForDate(dateStr){
    let cp=0, matUsed=0, matWaste=0;
    state.jobs.forEach(j=>{
      if(j.dateReceived!==dateStr) return;
      const t = jobTotals(j);
      cp += t.cp; matUsed += t.materialUsedCost; matWaste += t.materialWasteCost;
    });
    let paid = 0;
    state.jobs.forEach(j=>{
      (j.payments||[]).forEach(p=>{ if(p.date===dateStr) paid += (Number(p.cash)||0)+(Number(p.bank)||0); });
    });
    allOldDebtPayments().forEach(p=>{ if(p.date===dateStr) paid += p.cash + p.bank; });
    return Math.max(paid - cp - matUsed - matWaste, 0);
  }
  function exAutoForDate(dateStr){
    return exNetProfitForDate(dateStr) * (Number(state.settings.exPct)||0) / 100;
  }
  function exAdjustFor(dateStr){
    const a = state.exadjust.find(x=>x.date===dateStr);
    return a ? (Number(a.amount)||0) : null;   // null = no override, use the EX share
  }
  function exInflowFor(dateStr){
    const a = exAdjustFor(dateStr);
    return a===null ? exAutoForDate(dateStr) : a;
  }
  function exSpentFor(dateStr){
    return state.expenses.filter(e=>e.date===dateStr).reduce((s,e)=>s+(Number(e.amount)||0),0);
  }
  // Every date that moves the purse — a day that earned EX, a manual adjustment, or spending.
  function exActiveDates(){
    const set = new Set();
    state.jobs.forEach(j=>{
      if(j.dateReceived) set.add(j.dateReceived);
      (j.payments||[]).forEach(p=>{ if(p.date) set.add(p.date); });
    });
    allOldDebtPayments().forEach(p=>{ if(p.date) set.add(p.date); });
    state.exadjust.forEach(a=>{ if(a.date) set.add(a.date); });
    state.expenses.forEach(e=>{ if(e.date) set.add(e.date); });
    return Array.from(set).sort();
  }
  function exOpeningFor(dateStr){
    const start = state.settings.exStartDate || '';
    let bal = Number(state.settings.exOpeningFloat)||0;
    exActiveDates().forEach(d=>{
      if(d >= dateStr) return;
      if(start && d < start) return;
      bal += exInflowFor(d) - exSpentFor(d);
    });
    return bal;
  }
  function exDayRow(dateStr){
    const opening = exOpeningFor(dateStr);
    const inflow  = exInflowFor(dateStr);
    const spent   = exSpentFor(dateStr);
    return {
      opening, inflow, spent,
      available: opening + inflow,
      closing: opening + inflow - spent,
      auto: exAutoForDate(dateStr),
      netProfit: exNetProfitForDate(dateStr),
      adjusted: exAdjustFor(dateStr) !== null,
    };
  }
  function exMonthTable(ym){
    const [yy, mm] = ym.split('-').map(Number);
    const n = daysInMonth(yy, mm-1);
    const pad = x=>String(x).padStart(2,'0');
    let running = exOpeningFor(`${ym}-01`);
    const monthOpening = running;
    let rows = '', inTotal = 0, outTotal = 0, shown = 0;
    for(let d=1; d<=n; d++){
      const date = `${ym}-${pad(d)}`;
      const inflow = exInflowFor(date);
      const spent  = exSpentFor(date);
      const opening = running;
      running = opening + inflow - spent;
      if(!inflow && !spent) continue;
      shown++;
      inTotal += inflow; outTotal += spent;
      const isToday = date === expensesViewDate;
      rows += `<tr style="${isToday?'background:rgba(185,121,28,0.10);font-weight:600;':''}">
        <td><button class="subtle-link ex-jump" data-date="${date}">${fmtDate(date)}</button></td>
        <td class="num-col">${naira(opening)}</td>
        <td class="num-col">${naira(inflow)}${exAdjustFor(date)!==null?' <span class="muted" title="manually adjusted">*</span>':''}</td>
        <td class="num-col">${naira(opening+inflow)}</td>
        <td class="num-col">${naira(spent)}</td>
        <td class="num-col ${running<0?'flag':''}">${naira(running)}</td>
      </tr>`;
    }
    if(!shown) return `<div class="lg-empty">Nothing has moved through the purse this month yet.</div>`;
    return `<div style="overflow-x:auto;"><table><thead><tr>
      <th>Day</th><th class="num-col">Carried In</th><th class="num-col">EX In</th>
      <th class="num-col">Available</th><th class="num-col">Spent</th><th class="num-col">Carried Forward</th>
    </tr></thead><tbody>
      ${rows}
      <tr style="font-weight:700;border-top:2px solid var(--ink);">
        <td>MONTH TOTAL</td>
        <td class="num-col">${naira(monthOpening)}</td>
        <td class="num-col">${naira(inTotal)}</td>
        <td class="num-col">—</td>
        <td class="num-col">${naira(outTotal)}</td>
        <td class="num-col ${running<0?'flag':''}">${naira(running)}</td>
      </tr>
    </tbody></table></div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px;">Days with no EX in and nothing spent are skipped. A <b>*</b> marks a day whose EX figure you adjusted by hand.</div>`;
  }
  // A recurring bill counts as posted for a month once an expense carrying its id exists there.
  function isRecurringPosted(rc, ym){

      <div class="lg-card">

        ${!dayRows.length ? '<div class="lg-empty">No expenses logged on this day.</div>' : `

        <tr style="font-weight:700;border-top:2px solid var(--ink);">

        <div style="font-size:11px;color:var(--muted);margin-top:8px;">All-time total, every day: ${naira(allTimeTotal)}</div>
      </div>

      <div class="lg-card">
        <div class="lg-card-title">${monthLabel} \u2014 Purse, Day by Day</div>
        <div style="font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:8px;">Each day's <b>Carried Forward</b> becomes the next day's <b>Carried In</b>. Click a date to jump to it.</div>
        ${exMonthTable(ym)}

        <div class="lg-grid cols-4">

          <div><label style="margin-top:0">Amount (\u20a6)</label><input id="rc-amount" type="number" min="0" value="0"></div>
          <div><label style="margin-top:0">Day of month</label><input id="rc-day" type="number" min="1" max="28" value="1"></div>
          <div><label style="margin-top:0">Paid with</label>
            <select id="rc-method">

        <div><label>Note</label><input id="rc-note" placeholder="optional"></div>
        <div style="margin-top:10px;" class="lg-row-actions">
          <button class="lg-btn ghost small" id="rc-add" type="button">Save recurring expense</button>
          ${state.recurring.length?`<button class="lg-btn small" id="rc-post" type="button">Post ${unpostedCount} to ${monthLabel}</button>`:''}

        <table style="margin-top:10px;"><thead><tr><th>Category</th><th>Note</th><th class="num-col">Day</th><th class="num-col">Amount</th><th>Paid with</th><th>${monthLabel}</th><th></th></tr></thead><tbody>
        ${state.recurring.map(rc=>{
          const posted = isRecurringPosted(rc, ym);
          return `<tr>
            <td>${esc(rc.category)}</td><td class="muted">${esc(rc.note)||'\u2014'}</td>
            <td class="num-col">${rc.day||1}</td><td class="num-col">${naira(rc.amount)}</td>
            <td>${methodTag(rc.method)}</td>
            <td>${posted?'<span style="color:var(--green);font-weight:600;">posted</span>':'<span class="muted">not yet</span>'}</td>
            <td><button class="subtle-link rc-delete" data-id="${rc.id}">remove</button></td>

        <div style="font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:10px;">
          Set these once. <b>Opening float</b> is expense money already set aside before the purse started. <b>Start from</b> tells the purse to ignore EX and expenses before that date.
        </div>
        <div class="lg-grid cols-3">
          <div><label style="margin-top:0">Opening float (\u20a6)</label><input id="ex-float" type="number" value="${Number(s.exOpeningFloat)||0}"></div>
          <div><label style="margin-top:0">Start purse from</label><input id="ex-start" type="date" value="${esc(s.exStartDate||'')}"></div>
          <div style="align-self:end;" class="lg-row-actions">
            <button class="lg-btn ghost small" id="ex-setup-save" type="button">Save setup</button>
            ${s.exStartDate?`<button class="lg-btn ghost small" id="ex-start-clear" type="button">Count all history</button>`:''}
          </div>
        </div>
      </div>
    `;
    document.getElementById('ex-nav-date').addEventListener('change', (e)=>{ expensesViewDate = e.target.value || todayISO(); renderExpenses(); });
    document.getElementById('ex-nav-prev').addEventListener('click', ()=>{ expensesViewDate = shiftDate(expensesViewDate,-1); renderExpenses(); });
    document.getElementById('ex-nav-next').addEventListener('click', ()=>{ expensesViewDate = shiftDate(expensesViewDate,1); renderExpenses(); });
    document.getElementById('ex-nav-today').addEventListener('click', ()=>{ expensesViewDate = todayISO(); renderExpenses(); });

    document.getElementById('ex-adjust-save').addEventListener('click', async ()=>{
      const raw = document.getElementById('ex-adjust').value.trim();

      } else {
        toast('Using the ' + state.settings.exPct + '% share again');

      await save('exadjust');
      renderExpenses();

  // ---------- CP ACCOUNT ----------
  // A running "production purse", kept deliberately separate from Expenses and from the
  // profit maths. Each day the CP of that day's jobs drops into the purse, you log what you
  // actually spent producing the work, and whatever is left carries into the next day.
  // Nothing here touches Net Profit, Net Cash, or the Tithe/PF/EX split — this is a
  // cash-in-hand tracker for production money, and it answers one question: is the money
  // still in the purse, and where did the rest of it go?
  let cpViewDate = todayISO();
  const CP_SPEND_SUGGESTIONS = ['Ink / Toner','Paper','Transport','Casual labour','Fuel / Generator','Outsourced printing','Repairs','Miscellaneous'];

  function cpAutoForDate(dateStr){
    return state.jobs.filter(j=>j.dateReceived===dateStr).reduce((s,j)=>s+(Number(j.cp)||0),0);
  }
  function cpAdjustFor(dateStr){
    const a = state.cpadjust.find(x=>x.date===dateStr);
    return a ? (Number(a.amount)||0) : null;   // null = no override, use the auto figure
  }
  function cpInflowFor(dateStr){
    const a = cpAdjustFor(dateStr);
    return a===null ? cpAutoForDate(dateStr) : a;
  }
  function cpSpentFor(dateStr){
    return state.cpspend.filter(e=>e.date===dateStr).reduce((s,e)=>s+(Number(e.amount)||0),0);
  }
  // Every date that moves the purse — a day with job CP, a manual adjustment, or spending.
  function cpActiveDates(){
    const set = new Set();
    state.jobs.forEach(j=>{ if(j.dateReceived && (Number(j.cp)||0)!==0) set.add(j.dateReceived); });
    state.cpadjust.forEach(a=>{ if(a.date) set.add(a.date); });
    state.cpspend.forEach(e=>{ if(e.date) set.add(e.date); });
    return Array.from(set).sort();
  }
  // Opening balance = the float you started with, plus every earlier day's inflow minus
  // its spending. Days before the chosen start date are ignored entirely.
  function cpOpeningFor(dateStr){
    const start = state.settings.cpStartDate || '';
    let bal = Number(state.settings.cpOpeningFloat)||0;
    cpActiveDates().forEach(d=>{
      if(d >= dateStr) return;
      if(start && d < start) return;
      bal += cpInflowFor(d) - cpSpentFor(d);
    });
    return bal;
  }
  function cpDayRow(dateStr){
    const opening = cpOpeningFor(dateStr);
    const inflow  = cpInflowFor(dateStr);
    const spent   = cpSpentFor(dateStr);
    return {
      opening, inflow, spent,
      available: opening + inflow,
      closing: opening + inflow - spent,
      auto: cpAutoForDate(dateStr),
      adjusted: cpAdjustFor(dateStr) !== null,
    };
  }

  function cpMonthTable(ym){
    const [yy, mm] = ym.split('-').map(Number);
    const n = daysInMonth(yy, mm-1);
    const pad = x=>String(x).padStart(2,'0');
    let running = cpOpeningFor(`${ym}-01`);
    const monthOpening = running;
    let rows = '', inTotal = 0, outTotal = 0, shown = 0;
    for(let d=1; d<=n; d++){
      const date = `${ym}-${pad(d)}`;
      const inflow = cpInflowFor(date);
      const spent  = cpSpentFor(date);
      const opening = running;
      running = opening + inflow - spent;
      if(!inflow && !spent) continue;
      shown++;
      inTotal += inflow; outTotal += spent;
      const isToday = date === cpViewDate;
      rows += `<tr style="${isToday?'background:rgba(185,121,28,0.10);font-weight:600;':''}">
        <td><button class="subtle-link cp-jump" data-date="${date}">${fmtDate(date)}</button></td>
        <td class="num-col">${naira(opening)}</td>
        <td class="num-col">${naira(inflow)}${cpAdjustFor(date)!==null?' <span class="muted" title="manually adjusted">*</span>':''}</td>
        <td class="num-col">${naira(opening+inflow)}</td>
        <td class="num-col">${naira(spent)}</td>
        <td class="num-col ${running<0?'flag':''}">${naira(running)}</td>
      </tr>`;
    }
    if(!shown){
      return `<div class="lg-empty">Nothing has moved through the purse this month yet.</div>`;
    }
    return `<div style="overflow-x:auto;"><table><thead><tr>
      <th>Day</th><th class="num-col">Carried In</th><th class="num-col">CP In</th>
      <th class="num-col">Available</th><th class="num-col">Spent</th><th class="num-col">Carried Forward</th>
    </tr></thead><tbody>
      ${rows}
      <tr style="font-weight:700;border-top:2px solid var(--ink);">
        <td>MONTH TOTAL</td>
        <td class="num-col">${naira(monthOpening)}</td>
        <td class="num-col">${naira(inTotal)}</td>
        <td class="num-col">—</td>
        <td class="num-col">${naira(outTotal)}</td>
        <td class="num-col ${running<0?'flag':''}">${naira(running)}</td>
      </tr>
    </tbody></table></div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px;">Days with no CP in and nothing spent are skipped. A <b>*</b> marks a day whose CP figure you adjusted by hand.</div>`;
  }

          <div style="align-self:end;" class="lg-row-actions">

      <div class="lg-card">

        ${!dayRows.length ? '<div class="lg-empty">Nothing logged against the purse today. Add the first entry above.</div>' : `
        <table><thead><tr><th>Spent on</th><th>Note</th><th class="num-col">Amount</th><th>Paid with</th><th></th></tr></thead>
        <tbody>${dayRows.map(e=>`<tr>
          <td>${esc(e.item)||'\u2014'}</td>

          <div><label style="margin-top:0">Opening float (\u20a6)</label><input id="cp-float" type="number" value="${Number(s.cpOpeningFloat)||0}"></div>

      const method = document.getElementById('cp-sp-method').value;
      if(amount<=0){ toast('Enter an amount greater than 0'); return; }

      state.cpspend.push({

        await save('cpspend');
        toast(sel.value ? ('Marked as ' + methodLabel(sel.value)) : 'Method cleared');
        renderCPAccount();
      });
    });
    content.querySelectorAll('.cp-sp-delete').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        state.cpspend = state.cpspend.filter(e=>e.id!==btn.dataset.id);
        await save('cpspend');
        toast('Entry removed');
        renderCPAccount();
      });
    });
    content.querySelectorAll('.cp-jump').forEach(btn=>{
      btn.addEventListener('click', ()=>{ cpViewDate = btn.dataset.date; renderCPAccount(); });

    document.getElementById('cp-setup-save').addEventListener('click', async ()=>{
      state.settings.cpOpeningFloat = Number(document.getElementById('cp-float').value)||0;
      state.settings.cpStartDate = document.getElementById('cp-start').value || '';
      await save('settings');
      toast('Purse setup saved');
      renderCPAccount();

    const startClear = document.getElementById('cp-start-clear');
    if(startClear) startClear.addEventListener('click', async ()=>{

      renderCPAccount();

  }

  // ---------- QUOTES ----------
  // A quote is a priced job that hasn't been agreed yet. It counts for nothing — no revenue,
  // no debt, no CP, no material deduction — until you convert it, at which point it becomes
  // an ordinary job with whatever intake date you give it.
  function renderQuotes(){
    const rows = state.quotes.slice().sort((a,b)=>(b.dateCreated||'').localeCompare(a.dateCreated||''));
    const totalValue = rows.reduce((s,q)=>s+jobTotals(q).totalBilled,0);
    const expired = rows.filter(q=>q.validUntil && q.validUntil < todayISO()).length;
    content.innerHTML = `
      <div class="lg-card">
        <div class="lg-card-title">Quotes \u2014 priced, not yet agreed</div>
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">
          Nothing here counts anywhere else in the ledger \u2014 not as income, not as debt, not as material used. Build a quote on the New Job tab and press <b>Save as Quote</b> instead of Save Job. When the customer agrees, convert it and it becomes a real job.

        ${rows.map(q=>{
          const t = jobTotals(q);
          const stale = q.validUntil && q.validUntil < todayISO();
          return `<tr>
            <td>${fmtDate(q.dateCreated)}</td>
            <td>${esc(q.customerName)}</td>
            <td class="muted">${esc(q.description || (q.items[0]?q.items[0].service:'\u2014'))}</td>
            <td class="${stale?'flag':''}">${q.validUntil?fmtDate(q.validUntil):'\u2014'}${stale?'<br><span style="font-size:10px;">expired</span>':''}</td>
            <td class="num-col">${naira(t.totalBilled)}</td>
            <td class="lg-row-actions">
              <button class="subtle-link qt-convert" data-id="${q.id}">convert to job</button>
              ${q.phone?`<a class="subtle-link" href="${waLink(q.phone, quoteWaText(q))}" target="_blank" rel="noopener">send</a>`:''}
              <button class="subtle-link qt-delete" data-id="${q.id}">remove</button>
            </td>
          </tr>`;
        }).join('')}
        </tbody></table>`}
      </div>
    `;
    document.getElementById('qt-new').addEventListener('click', ()=>{ state.tab='newjob'; renderAll(); });
    content.querySelectorAll('.qt-convert').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const q = state.quotes.find(x=>x.id===btn.dataset.id);
        if(!q) return;
        if(!confirm(`Turn this quote for ${q.customerName} into a real job?\n\nIt will be added with today's date as the intake date, status RECEIVED, and no payment recorded yet. The quote is removed from this list.`)) return;
        const job = {
          id: uid(),
          customerName: q.customerName, phone: q.phone || '',
          dateReceived: todayISO(),
          description: q.description || '',
          items: q.items || [],
          discount: Number(q.discount)||0,
          paidCash: 0, paidBank: 0,
          payments: [],
          cp: Number(q.cp)||0,
          materials: q.materials || [],
          operator: q.operator || '',
          dueDate: q.dueDate || '',
          status: 'RECEIVED',
          history: [{status:'RECEIVED', date: todayISO(), at: nowISO()}],
          fromQuote: q.id,
        };
        state.jobs.push(job);
        state.quotes = state.quotes.filter(x=>x.id!==q.id);
        recomputeAllCustomers();
        (job.items||[]).forEach(it=>upsertPriceListFromJob(it));
        await save('jobs'); await save('quotes'); await save('customers'); await save('pricelist');
        toast('Quote converted \u2014 ' + job.customerName);
        state.tab = 'jobs';
        renderAll();
      });
    });
    content.querySelectorAll('.qt-delete').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        state.quotes = state.quotes.filter(x=>x.id!==btn.dataset.id);
        await save('quotes');
        toast('Quote removed');
        renderQuotes();
      });
    });
  }

  // ---------- STAFF ----------
  // Rolls up every job by whoever was recorded as the operator. Jobs with no operator are
  // grouped under "Not recorded" so the gap is visible rather than silently dropped.
  let staffScope = 'month';
  function renderStaff(){
    const now = new Date(), ym = now.toISOString().slice(0,7);
    const monthLabel = now.toLocaleDateString('en-NG',{month:'long',year:'numeric'});
    const scoped = staffScope==='month'
      ? state.jobs.filter(j=>(j.dateReceived||'').slice(0,7)===ym)
      : state.jobs.slice();
    const map = new Map();
    scoped.forEach(j=>{
      const key = (j.operator||'').trim() || 'Not recorded';
      if(!map.has(key)) map.set(key, {name:key, jobs:0, billed:0, paid:0, debt:0, cp:0, delivered:0, late:0});
      const e = map.get(key);
      const t = jobTotals(j);
      e.jobs += 1; e.billed += t.totalBilled; e.paid += t.totalPaid; e.debt += t.debt; e.cp += t.cp;
      if(j.status==='DELIVERED') e.delivered += 1;
      if(dueInfo(j).overdue) e.late += 1;
    });
    const rows = Array.from(map.values()).sort((a,b)=>b.billed-a.billed);
    const totals = rows.reduce((s,r)=>({jobs:s.jobs+r.jobs, billed:s.billed+r.billed, cp:s.cp+r.cp}), {jobs:0,billed:0,cp:0});
    const unassigned = map.get('Not recorded');
    content.innerHTML = `
      <div class="lg-card">
        <div class="lg-card-title">Staff \u2014 who handled what</div>
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">

        </div>
        <div class="lg-row-actions">
          <button class="lg-btn ${staffScope==='month'?'':'ghost'} small" id="st-month" type="button">${monthLabel}</button>
          <button class="lg-btn ${staffScope==='all'?'':'ghost'} small" id="st-all" type="button">All time</button>
          <button class="lg-btn ghost small" id="st-export" type="button">\u2b07 Export CSV</button>
        </div>
      </div>
      ${unassigned && unassigned.jobs ? `<div class="lg-card" style="border-left:3px solid var(--amber);">
        <div style="font-size:12.5px;">${unassigned.jobs} job${unassigned.jobs===1?'':'s'} ${staffScope==='month'?'this month ':''}have no operator recorded, worth ${naira(unassigned.billed)}.</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px;">Fill the operator in via the <b>details</b> link on a job and it'll move into the right row here.</div>
      </div>` : ''}
      <div class="lg-card">
        ${!rows.length ? '<div class="lg-empty">No jobs in this period.</div>' : `
        <div style="overflow-x:auto;"><table><thead><tr>
          <th>Operator</th><th class="num-col">Jobs</th><th class="num-col">Delivered</th><th class="num-col">Late</th>
          <th class="num-col">Billed</th><th class="num-col">Collected</th><th class="num-col">Still Owed</th>
          <th class="num-col">Cost of Prod.</th><th class="num-col">Avg / Job</th>
        </tr></thead><tbody>
        ${rows.map(r=>`<tr>
          <td>${esc(r.name)}${r.name==='Not recorded'?' <span class="muted" style="font-size:10px;">(no operator)</span>':''}</td>
          <td class="num-col">${r.jobs}</td>
          <td class="num-col">${r.delivered}</td>
          <td class="num-col ${r.late?'flag':''}">${r.late||'\u2014'}</td>
          <td class="num-col">${naira(r.billed)}</td>
          <td class="num-col">${naira(r.paid)}</td>
          <td class="num-col ${r.debt>0?'flag':''}">${r.debt>0?naira(r.debt):'\u2014'}</td>
          <td class="num-col">${naira(r.cp)}</td>
          <td class="num-col">${naira(r.jobs?r.billed/r.jobs:0)}</td>
        </tr>`).join('')}
        <tr style="font-weight:700;border-top:2px solid var(--ink);">
          <td>TOTAL</td><td class="num-col">${totals.jobs}</td><td colspan="2"></td>
          <td class="num-col">${naira(totals.billed)}</td><td colspan="2"></td>
          <td class="num-col">${naira(totals.cp)}</td>
          <td class="num-col">${naira(totals.jobs?totals.billed/totals.jobs:0)}</td>
        </tr>
        </tbody></table></div>`}
      </div>
      ${rows.length ? `<div class="lg-card">
        <div class="lg-card-title">Billed by Operator</div>
        ${barChartSVG(rows.map(r=>({label:r.name, value:r.billed, tick:r.name.slice(0,8)})), {colour:'var(--amber)', height:130})}
      </div>` : ''}
    `;
    document.getElementById('st-month').addEventListener('click', ()=>{ staffScope='month'; renderStaff(); });
    document.getElementById('st-all').addEventListener('click', ()=>{ staffScope='all'; renderStaff(); });
    document.getElementById('st-export').addEventListener('click', ()=>{
      const out = [['Operator','Jobs','Delivered','Late','Billed','Collected','Still Owed','Cost of Production','Avg per Job']];
      rows.forEach(r=>out.push([r.name, r.jobs, r.delivered, r.late, plainNum(r.billed), plainNum(r.paid), plainNum(r.debt), plainNum(r.cp), plainNum(r.jobs?r.billed/r.jobs:0)]));
      downloadCSV(`staff-${staffScope==='month'?ym:'all-time'}.csv`, out);
    });
  }

  // ---------- auth ----------
  // The ledger is gated behind a Firebase Auth sign-in. Accounts are created by the owner
  // in the Firebase console (Authentication → Users), not here — there is deliberately no
  // public sign-up form, so a stranger can't provision themselves an account on this site.
  const authEl = document.getElementById('lg-auth');
  const authForm = document.getElementById('lg-auth-form');
  const authMsgEl = document.getElementById('lg-auth-msg');
  const authBtn = document.getElementById('lg-auth-btn');

  function authMsg(text, kind){
    authMsgEl.textContent = text || '';
    authMsgEl.className = 'lg-auth-msg' + (kind ? ' '+kind : '');
  }
  // Firebase's raw error codes ("auth/invalid-credential") aren't much use to a person
  // trying to get into their own books.
  function friendlyAuthError(code){
    switch(code){
      case 'auth/invalid-email':        return 'That doesn’t look like a valid email address.';
      case 'auth/user-disabled':        return 'This account has been disabled.';
      case 'auth/user-not-found':
      case 'auth/wrong-password':
      case 'auth/invalid-credential':   return 'Email or password is not correct.';
      case 'auth/too-many-requests':    return 'Too many attempts. Wait a minute and try again.';
      case 'auth/network-request-failed': return 'No connection. Check your internet and try again.';
      case 'auth/operation-not-allowed': return 'Email/password sign-in is not enabled for this project yet.';
      default: return 'Could not sign in. Please try again.';
    }
  }

  // Points the local cache at this user's own namespace. On a device that used the app
  // before sign-in existed, the old un-namespaced keys are adopted once so existing
  // books on that device carry over instead of appearing to vanish.
  function setLedgerScope(uid){
    currentUid = uid;
    const scoped = 'ledgerapp_' + uid + '_';
    try{
      const alreadyScoped = STORAGE_KEYS.some(([,key])=> localStorage.getItem(scoped+key) != null);
      const hasLegacy = STORAGE_KEYS.some(([,key])=> localStorage.getItem(LEGACY_LS_PREFIX+key) != null);
      if(!alreadyScoped && hasLegacy){
        STORAGE_KEYS.forEach(([,key])=>{
          const v = localStorage.getItem(LEGACY_LS_PREFIX+key);
          if(v != null) localStorage.setItem(scoped+key, v);
        });
      }
    }catch(e){ /* private mode / quota — fall through, cloud is still the source of truth */ }
    LS_PREFIX = scoped;
  }

  authForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('lg-auth-email').value.trim();
    const pass  = document.getElementById('lg-auth-pass').value;
    if(!email || !pass){ authMsg('Enter your email and password.', 'err'); return; }
    authBtn.disabled = true;
    authBtn.textContent = 'Signing in…';
    authMsg('');
    try{
      const ready = await waitForFirebase(8000);
      if(!ready) throw {code:'auth/network-request-failed'};
      // LOCAL persistence: stays signed in on this device across restarts.
      await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      await firebase.auth().signInWithEmailAndPassword(email, pass);
      // onAuthStateChanged takes it from here.
    }catch(err){
      console.error('Sign-in failed:', err);
      authMsg(friendlyAuthError(err && err.code), 'err');
      authBtn.disabled = false;
      authBtn.textContent = 'Sign In';
    }
  });

  document.getElementById('lg-signout').addEventListener('click', async ()=>{
    if(!confirm('Sign out of this device? Your ledger stays safe in the cloud.')) return;
    try{
      if(unsubscribeCloud){ unsubscribeCloud(); unsubscribeCloud = null; }
      await firebase.auth().signOut();
      location.reload();
    }catch(e){ toast('Could not sign out — try again'); }
  });

  let ledgerStarted = false;

  // ---------- boot ----------
  async function startLedger(){
    if(ledgerStarted) return;
    ledgerStarted = true;
    authEl.hidden = true;
    document.getElementById('ledger-root').hidden = false;
    renderTabs();
    document.getElementById('lg-backup-btn').addEventListener('click', downloadBackup);
    document.getElementById('lg-restore-btn').addEventListener('click', ()=>{
      document.getElementById('lg-restore-file').click();
    });
    document.getElementById('lg-restore-file').addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(file) await restoreBackup(file);
      e.target.value = '';
    });
    document.getElementById('lg-clear-btn').addEventListener('click', clearAllData);
    root.addEventListener('click', (e)=>{
      if(e.target.classList && e.target.classList.contains('goto-purchase-log')){
        e.preventDefault();
        state.tab = 'inventory';
        renderAll();
      }
      if(e.target.classList && e.target.classList.contains('goto-cp-account')){
        e.preventDefault();
        if(e.target.dataset.date) cpViewDate = e.target.dataset.date;
        state.tab = 'cpaccount';
        renderAll();
      }
    });
    // Paint immediately from whatever's already cached in this browser — no waiting on
    // the network. If this is the very first visit ever, arrays are just empty for a moment.
    loadLocalCache();
    renderAll();
    // Now reconcile with the cloud in the background, one round trip, re-rendering only
    // if the cloud actually had something different.
    await syncFromCloud();
    updateStorageModeLabel();
    if(needsFirebaseMigration){
      toast('Moving your existing data to the cloud…');
      await autoSaveAll(true);
      toast('Done \u2014 your data is now backed by Firebase');
    }
    markSaveStatus(true);
    setInterval(()=>autoSaveAll(), 5*60*1000);
    startAlarmWatch();
  }

  // Entry point. Nothing is read or painted until Firebase tells us who (if anyone) is
  // signed in on this device.
  (async function init(){
    const ready = await waitForFirebase(8000);
    if(!ready){
      authMsg('Cannot reach the sign-in service. Check your internet connection and reload.', 'err');
      authBtn.disabled = true;
      return;
    }
    firebase.auth().onAuthStateChanged(async (user)=>{
      if(user){
        setLedgerScope(user.uid);
        await startLedger();
      }else{
        // Signed out (or never signed in) — show the gate, keep the books hidden.
        authEl.hidden = false;
        document.getElementById('ledger-root').hidden = true;
        authBtn.disabled = false;
        authBtn.textContent = 'Sign In';
        authMsg('');
      }
    });
  })();
})();
</script>

<script>
/* Service worker registration — kept outside the app's main closure so a failure
   here can never stop the ledger from loading.

   Because the worker serves the shell from cache first, a freshly deployed version
   would otherwise not appear until the second visit. So when a new worker finishes
   installing we ask before switching, rather than reloading under the user mid-edit. */
(function(){
  if(!('serviceWorker' in navigator)) return;
  // Service workers need a secure origin; file:// and plain http are skipped.
  var secure = location.protocol === 'https:' ||
               location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if(!secure) return;

  function showUpdateBanner(worker){
    if(document.getElementById('lg-update-bar')) return;
    var bar = document.createElement('div');
    bar.id = 'lg-update-bar';
    bar.setAttribute('role', 'status');
    bar.style.cssText =
      'position:fixed;left:12px;right:12px;bottom:12px;z-index:900;max-width:520px;' +
      'margin:0 auto;background:#1B2A3D;color:#F6F1E5;border-radius:4px;' +
      'padding:11px 14px;box-shadow:0 6px 22px rgba(0,0,0,.3);display:flex;' +
      'gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;' +
      "font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:12.5px;";
    var msg = document.createElement('span');
    msg.textContent = 'A new version of the ledger is ready.';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Reload';
    btn.style.cssText =
      'background:#F6F1E5;color:#1B2A3D;border:none;border-radius:3px;' +
      'padding:7px 15px;font-weight:700;cursor:pointer;font-family:inherit;font-size:12.5px;';
    btn.addEventListener('click', function(){
      btn.disabled = true;
      btn.textContent = 'Updating…';
      worker.postMessage({type:'SKIP_WAITING'});
    });
    bar.appendChild(msg);
    bar.appendChild(btn);
    document.body.appendChild(bar);
  }

  navigator.serviceWorker.register('sw.js').then(function(reg){
    // A new worker was already waiting when this page loaded.
    if(reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);

    reg.addEventListener('updatefound', function(){
      var installing = reg.installing;
      if(!installing) return;
      installing.addEventListener('statechange', function(){
        // "installed" with an existing controller means an update, not a first install.
        if(installing.state === 'installed' && navigator.serviceWorker.controller){
          showUpdateBanner(installing);
        }
      });
    });
  }).catch(function(err){
    console.warn('Service worker registration failed (the app still works):', err);
  });

  // Fires once the new worker takes over after SKIP_WAITING.
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(reloading) return;
    reloading = true;
    location.reload();
  });
})();
</script>
