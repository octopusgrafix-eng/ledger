  // ---------- SUMMARY (monthly, day-by-day — mirrors the day-sheet totals) ----------
  function daysInMonth(year, month){ return new Date(year, month+1, 0).getDate(); }
  function renderSummary(){
    recomputeAllCustomers();
    const now = new Date();
    const year = now.getFullYear(), month = now.getMonth();
    const nDays = daysInMonth(year, month);
    const s = state.settings;
    const pad = n=>String(n).padStart(2,'0');
    const dateFor = d => `${year}-${pad(month+1)}-${pad(d)}`;

    // Billed & new-debt keyed by job creation date
    const byDay = {};
    for(let d=1; d<=nDays; d++) byDay[dateFor(d)] = {billed:0, newDebt:0};
    state.jobs.forEach(j=>{
      if(!j.dateReceived || !byDay.hasOwnProperty(j.dateReceived)) return;
      const t = jobTotals(j);
      byDay[j.dateReceived].billed += t.totalBilled;
      byDay[j.dateReceived].newDebt += t.debt;
    });

    // Paid, keyed by the ACTUAL date each payment was recorded (not just job intake day —
    // this is what makes debt collected later show up on the day it was really paid)
    const paidByDay = {};
    for(let d=1; d<=nDays; d++) paidByDay[dateFor(d)] = 0;
    state.jobs.forEach(j=>{
      (j.payments||[]).forEach(p=>{
        if(paidByDay.hasOwnProperty(p.date)) paidByDay[p.date] += (Number(p.cash)||0)+(Number(p.bank)||0);
      });
    });
    allOldDebtPayments().forEach(p=>{
      if(paidByDay.hasOwnProperty(p.date)) paidByDay[p.date] += p.cash+p.bank;
    });

    // Cost of production keyed by job intake date; material cost (bought) keyed by purchase date;
    // material cost (used) also keyed by job intake date, kept as a separate informational figure
    const cpByDay = {}, matCostByDay = {}, matCostUsedByDay = {};
    for(let d=1; d<=nDays; d++){ cpByDay[dateFor(d)] = 0; matCostByDay[dateFor(d)] = 0; matCostUsedByDay[dateFor(d)] = 0; }
    state.jobs.forEach(j=>{
      if(!j.dateReceived || !cpByDay.hasOwnProperty(j.dateReceived)) return;
      cpByDay[j.dateReceived] += Number(j.cp)||0;
      matCostUsedByDay[j.dateReceived] += jobTotals(j).materialUsedCost;
    });
    allStockPurchases().forEach(p=>{
      if(matCostByDay.hasOwnProperty(p.date)) matCostByDay[p.date] += p.qty*p.unitCost;
    });

    // Expenses keyed by date
    const expByDay = {};
    for(let d=1; d<=nDays; d++) expByDay[dateFor(d)] = 0;
    state.expenses.forEach(e=>{
      if(expByDay.hasOwnProperty(e.date)) expByDay[e.date] += Number(e.amount)||0;
    });

    let cumDebt = 0, mBilled=0, mPaid=0, mNewDebt=0, mGrand=0, mTithe=0, mPf=0, mEx=0, activeDays=0, mCp=0, mMatCost=0, mMatCostUsed=0;
    const rows = [];
    for(let d=1; d<=nDays; d++){
      const date = dateFor(d);
      const billed = byDay[date].billed;
      const newDebt = byDay[date].newDebt;
      const paid = paidByDay[date];
      const cp = cpByDay[date];
      const matCost = matCostByDay[date];
      const matCostUsed = matCostUsedByDay[date];
      cumDebt += newDebt;
      const grand = Math.max(paid - cp - matCostUsed, 0); // net profit: cash collected minus cost of production minus material cost actually USED that day
      const tithe = grand * s.tithePct/100;
      const pf = grand * s.pfPct/100;
      const ex = grand * s.exPct/100;
      if(billed>0 || paid>0) activeDays++;
      mBilled+=billed; mPaid+=paid; mNewDebt+=newDebt; mGrand+=grand; mTithe+=tithe; mPf+=pf; mEx+=ex; mCp+=cp; mMatCost+=matCost; mMatCostUsed+=matCostUsed;
      rows.push({d, date, billed, paid, newDebt, grand, tithe, pf, ex, cumDebt, matCostUsed, week: isoWeekLabel(date)});
    }
    const collectionRate = mBilled ? mPaid/mBilled : 0;
    const debtPct = mBilled ? mNewDebt/mBilled : 0;
    const monthLabel = now.toLocaleDateString('en-NG',{month:'long', year:'numeric'});

    function buildDailyWeeklyTable(){
      let html=''; let wk=null; let wkHasData=false;
      let acc={billed:0,paid:0,newDebt:0,grand:0,tithe:0,pf:0,ex:0,matCostUsed:0};
      function flush(){
        if(wk===null || !wkHasData) return '';
        return `<tr style="font-weight:700;background:rgba(185,121,28,0.08);">
          <td>${wk} TOTAL</td>
          <td class="num-col">${naira(acc.billed)}</td><td class="num-col">${naira(acc.paid)}</td>
          <td class="num-col">${naira(acc.newDebt)}</td><td class="num-col">${naira(acc.matCostUsed)}</td><td class="num-col">${naira(acc.grand)}</td>
          <td class="num-col">${naira(acc.tithe)}</td><td class="num-col">${naira(acc.pf)}</td>
          <td class="num-col">${naira(acc.ex)}</td><td></td>
        </tr>`;
      }
      rows.forEach(r=>{
        if(wk!==null && r.week!==wk){ html += flush(); acc={billed:0,paid:0,newDebt:0,grand:0,tithe:0,pf:0,ex:0,matCostUsed:0}; wkHasData=false; }
        wk = r.week;
        if(r.billed>0 || r.paid>0){
          wkHasData = true;
          html += `<tr>
            <td>${r.d}</td><td class="num-col">${naira(r.billed)}</td><td class="num-col">${naira(r.paid)}</td>
            <td class="num-col ${r.newDebt>0?'flag':''}">${naira(r.newDebt)}</td>
            <td class="num-col muted">${naira(r.matCostUsed)}</td>
            <td class="num-col">${naira(r.grand)}</td>
            <td class="num-col">${naira(r.tithe)}</td><td class="num-col">${naira(r.pf)}</td><td class="num-col">${naira(r.ex)}</td>
            <td class="num-col">${naira(r.cumDebt)}</td>
          </tr>`;
        }
        acc.billed+=r.billed; acc.paid+=r.paid; acc.newDebt+=r.newDebt; acc.grand+=r.grand; acc.tithe+=r.tithe; acc.pf+=r.pf; acc.ex+=r.ex; acc.matCostUsed+=r.matCostUsed;
      });
      html += flush();
      return html || `<tr><td colspan="10" class="lg-empty">No jobs logged yet this month</td></tr>`;
    }

    function buildIncomeExpenseTable(){
      let html=''; let running=0; let wk=null; let wkHasData=false;
      let acc={income:0,expense:0,net:0};
      function flush(){
        if(wk===null || !wkHasData) return '';
        return `<tr style="font-weight:700;background:rgba(46,101,95,0.08);">
          <td>${wk} TOTAL</td>
          <td class="num-col">${naira(acc.income)}</td><td class="num-col">${naira(acc.expense)}</td>
          <td class="num-col ${acc.net<0?'flag':''}">${naira(acc.net)}</td><td></td>
        </tr>`;
      }
      rows.forEach(r=>{
        const income = r.paid, expense = expByDay[r.date], net = income-expense;
        running += net;
        if(wk!==null && r.week!==wk){ html += flush(); acc={income:0,expense:0,net:0}; wkHasData=false; }
        wk = r.week;
        if(income>0 || expense>0){
          wkHasData = true;
          html += `<tr>
            <td>${r.d}</td><td class="num-col">${naira(income)}</td>
            <td class="num-col">${expense>0?naira(expense):'—'}</td>
            <td class="num-col ${net<0?'flag':''}">${naira(net)}</td>
            <td class="num-col">${naira(running)}</td>
          </tr>`;
        }
        acc.income+=income; acc.expense+=expense; acc.net+=net;
      });
      html += flush();
      const totalExpense = Object.values(expByDay).reduce((s,v)=>s+v,0);
      return {rowsHtml: html || `<tr><td colspan="5" class="lg-empty">No income or expenses logged yet this month</td></tr>`,
        totalIncome: mPaid, totalExpense, netTotal: mPaid-totalExpense};
    }
    const ie = buildIncomeExpenseTable();

    // Best sellers and top customers, scoped to jobs received this month.
    const ymNow = `${year}-${pad(month+1)}`;
    const monthJobsList = state.jobs.filter(j=>(j.dateReceived||'').slice(0,7)===ymNow);
    const svcMap = new Map();
    monthJobsList.forEach(j=>(j.items||[]).forEach(it=>{
      const key = normName(it.service) || 'ITEM';
      const value = (Number(it.qty)||0)*(Number(it.unitPrice)||0) + (Number(it.descQty)||0)*(Number(it.descUnitPrice)||0);
      const count = (Number(it.qty)||0) + (Number(it.descQty)||0);
      if(!svcMap.has(key)) svcMap.set(key, {name:key, count:0, value:0});
      const e = svcMap.get(key); e.count += count; e.value += value;
    }));
    const topServices = Array.from(svcMap.values()).filter(x=>x.value>0).sort((a,b)=>b.value-a.value).slice(0,6);
    const custMap = new Map();
    monthJobsList.forEach(j=>{
      const key = normName(j.customerName || 'WALKIN');
      const t = jobTotals(j);
      if(!custMap.has(key)) custMap.set(key, {name:key, jobs:0, billed:0, debt:0});
      const e = custMap.get(key); e.jobs += 1; e.billed += t.totalBilled; e.debt += t.debt;
    });
    const topCustomers = Array.from(custMap.values()).filter(x=>x.billed>0).sort((a,b)=>b.billed-a.billed).slice(0,6);

    // ---- Cash vs bank transfer for the month ----
    // Money in comes from the cash/bank amounts already recorded on every payment.
    // Money out comes from the method recorded on each CP spend and expense.
    const inMonth = iso => (iso||'').slice(0,7) === ymNow;
    const monthPayments = [];
    state.jobs.forEach(j=>(j.payments||[]).forEach(p=>{ if(inMonth(p.date)) monthPayments.push(p); }));
    allOldDebtPayments().forEach(p=>{ if(inMonth(p.date)) monthPayments.push(p); });
    const inSplit = splitPayments(monthPayments);
    const cpSplit = splitByMethod(state.cpspend.filter(e=>inMonth(e.date)));
    const exSplit = splitByMethod(state.expenses.filter(e=>inMonth(e.date)));
    const netCashMethod     = inSplit.cash - cpSplit.cash - exSplit.cash;
    const netTransferMethod = inSplit.transfer - cpSplit.transfer - exSplit.transfer;
    const outUnknown = cpSplit.unknown + exSplit.unknown;
    const money = v => `<td class="num-col">${naira(v)}</td>`;
    const gap = v => v>0
      ? `<td class="num-col flag">${naira(v)}</td>`
      : `<td class="num-col muted">—</td>`;

    // Same cash/transfer figures, but keyed by day so the month can be read as a
    // running record rather than a single lump.
    const methodByDay = {};
    for(let d=1; d<=nDays; d++) methodByDay[dateFor(d)] = {inCash:0, inTransfer:0, outCash:0, outTransfer:0, outUnknown:0};
    state.jobs.forEach(j=>(j.payments||[]).forEach(p=>{
      const m = methodByDay[p.date]; if(!m) return;
      m.inCash += Number(p.cash)||0; m.inTransfer += Number(p.bank)||0;
    }));
    allOldDebtPayments().forEach(p=>{
      const m = methodByDay[p.date]; if(!m) return;
      m.inCash += p.cash; m.inTransfer += p.bank;
    });
    state.cpspend.concat(state.expenses).forEach(e=>{
      const m = methodByDay[e.date]; if(!m) return;
      const a = Number(e.amount)||0;
      if(e.method==='cash') m.outCash += a;
      else if(e.method==='transfer') m.outTransfer += a;
      else m.outUnknown += a;
    });
    const showUnknownCol = outUnknown > 0;
    const methodCols = showUnknownCol ? 8 : 7;

    function buildMethodDayTable(){
      let html=''; let wk=null; let wkHasData=false;
      let acc={inCash:0,inTransfer:0,outCash:0,outTransfer:0,outUnknown:0};
      const cells = (m, bold) => {
        const netCash = m.inCash - m.outCash, netTr = m.inTransfer - m.outTransfer;
        return `<td class="num-col">${m.inCash?naira(m.inCash):'—'}</td>
          <td class="num-col">${m.outCash?naira(m.outCash):'—'}</td>
          <td class="num-col" style="${bold?'':'font-weight:600;'}color:${netCash<0?'var(--clay)':'var(--green)'};">${naira(netCash)}</td>
          <td class="num-col">${m.inTransfer?naira(m.inTransfer):'—'}</td>
          <td class="num-col">${m.outTransfer?naira(m.outTransfer):'—'}</td>
          <td class="num-col" style="${bold?'':'font-weight:600;'}color:${netTr<0?'var(--clay)':'var(--teal)'};">${naira(netTr)}</td>
          ${showUnknownCol ? `<td class="num-col ${m.outUnknown?'flag':'muted'}">${m.outUnknown?naira(m.outUnknown):'—'}</td>` : ''}`;
      };
      function flush(){
        if(wk===null || !wkHasData) return '';
        return `<tr style="font-weight:700;background:rgba(46,101,95,0.08);">
          <td>${wk} TOTAL</td>${cells(acc, true)}
        </tr>`;
      }
      rows.forEach(r=>{
        const m = methodByDay[r.date];
        const active = m.inCash || m.inTransfer || m.outCash || m.outTransfer || m.outUnknown;
        if(wk!==null && r.week!==wk){ html += flush(); acc={inCash:0,inTransfer:0,outCash:0,outTransfer:0,outUnknown:0}; wkHasData=false; }
        wk = r.week;
        if(active){
          wkHasData = true;
          html += `<tr><td>${r.d}</td>${cells(m)}</tr>`;
        }
        acc.inCash+=m.inCash; acc.inTransfer+=m.inTransfer;
        acc.outCash+=m.outCash; acc.outTransfer+=m.outTransfer; acc.outUnknown+=m.outUnknown;
      });
      html += flush();
      return html || `<tr><td colspan="${methodCols}" class="lg-empty">Nothing moved in or out yet this month</td></tr>`;
    }
    const methodDayRows = buildMethodDayTable();

    // Everything still missing a method, across ALL dates and both kinds of spending.
    // Without this you would have to page through the CP Account and Expenses tabs one
    // day at a time hunting for entries logged before the field existed.
    const unrecorded = []
      .concat(state.cpspend.filter(e=>!e.method).map(e=>({kind:'cp', id:e.id, date:e.date, what:e.item, note:e.note, amount:Number(e.amount)||0})))
      .concat(state.expenses.filter(e=>!e.method).map(e=>({kind:'ex', id:e.id, date:e.date, what:e.category, note:e.note, amount:Number(e.amount)||0})))
      .sort((a,b)=>(b.date||'').localeCompare(a.date||''));

    content.innerHTML = `
      <div class="lg-card">
        <div class="lg-card-title">Cash vs Bank Transfer, day by day — ${monthLabel}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:10px;">
          Exactly how much moved as physical cash and how much moved through the bank, each day.
          <b>Net</b> is what the cash box and the bank should each have gained that day — days with no movement are skipped.
          ${outUnknown>0 ? `<span class="flag">${naira(outUnknown)} of spending has no method recorded yet</span> — set it in the card below and it will move into the right column.` : ''}
        </div>
        <div style="overflow-x:auto;"><table>
          <thead>
            <tr>
              <th></th>
              <th colspan="3" style="text-align:center;border-bottom:1px solid var(--rule);">Cash</th>
              <th colspan="3" style="text-align:center;border-bottom:1px solid var(--rule);">Bank Transfer</th>
              ${showUnknownCol ? '<th></th>' : ''}
            </tr>
            <tr>
              <th>Day</th>
              <th class="num-col">In</th><th class="num-col">Out</th><th class="num-col">Net</th>
              <th class="num-col">In</th><th class="num-col">Out</th><th class="num-col">Net</th>
              ${showUnknownCol ? '<th class="num-col">Out, method<br>not recorded</th>' : ''}
            </tr>
          </thead>
          <tbody>${methodDayRows}
            <tr style="font-weight:700;border-top:2px solid var(--ink);">
              <td>MONTH</td>
              <td class="num-col">${naira(inSplit.cash)}</td>
              <td class="num-col">${naira(cpSplit.cash + exSplit.cash)}</td>
              <td class="num-col" style="color:${netCashMethod<0?'var(--clay)':'var(--green)'};">${naira(netCashMethod)}</td>
              <td class="num-col">${naira(inSplit.transfer)}</td>
              <td class="num-col">${naira(cpSplit.transfer + exSplit.transfer)}</td>
              <td class="num-col" style="color:${netTransferMethod<0?'var(--clay)':'var(--teal)'};">${naira(netTransferMethod)}</td>
              ${showUnknownCol ? `<td class="num-col flag">${naira(outUnknown)}</td>` : ''}
            </tr>
          </tbody>
        </table></div>

        <div class="lg-card-title" style="margin-top:18px;">Month total, split by where it went</div>
        <div style="overflow-x:auto;"><table>
          <thead><tr>
            <th></th>
            <th class="num-col">Cash</th>
            <th class="num-col">Bank Transfer</th>
            <th class="num-col">Not recorded</th>
            <th class="num-col">Total</th>
          </tr></thead>
          <tbody>
            <tr>
              <td><b>Money in</b> <span class="muted">— payments collected</span></td>
              ${money(inSplit.cash)}${money(inSplit.transfer)}
              <td class="num-col muted">—</td>
              ${money(inSplit.total)}
            </tr>
            <tr>
              <td>Cost of Production <span class="muted">— out</span></td>
              ${money(cpSplit.cash)}${money(cpSplit.transfer)}${gap(cpSplit.unknown)}${money(cpSplit.total)}
            </tr>
            <tr>
              <td>Expenses <span class="muted">— out</span></td>
              ${money(exSplit.cash)}${money(exSplit.transfer)}${gap(exSplit.unknown)}${money(exSplit.total)}
            </tr>
            <tr style="font-weight:700;border-top:2px solid var(--ink);">
              <td>NET</td>
              <td class="num-col" style="color:${netCashMethod<0?'var(--clay)':'var(--green)'};">${naira(netCashMethod)}</td>
              <td class="num-col" style="color:${netTransferMethod<0?'var(--clay)':'var(--teal)'};">${naira(netTransferMethod)}</td>
              ${gap(outUnknown)}
              ${money(inSplit.total - cpSplit.total - exSplit.total)}
            </tr>
          </tbody>
        </table></div>
      </div>

      ${!unrecorded.length ? '' : `
      <div class="lg-card" style="border-left:3px solid var(--clay);">
        <div class="lg-card-title">Spending with no method recorded (${unrecorded.length}) — ${naira(unrecorded.reduce((s,x)=>s+x.amount,0))}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:10px;">
          These were logged before cash/transfer was tracked, so they sit outside the split above.
          Set each one here and it moves into the right column — no need to hunt through past dates.
          Everything from now on asks for the method when you log it.
        </div>
        <div style="overflow-x:auto;"><table>
          <thead><tr><th>Date</th><th>Type</th><th>What</th><th class="num-col">Amount</th><th>Paid with</th></tr></thead>
          <tbody>${unrecorded.map(x=>`<tr>
            <td>${x.date?fmtDate(x.date):'—'}</td>
            <td><span class="muted" style="font-size:11px;">${x.kind==='cp'?'CP':'Expense'}</span></td>
            <td>${esc(x.what)||'—'}${x.note?` <span class="muted">— ${esc(x.note)}</span>`:''}</td>
            <td class="num-col">${naira(x.amount)}</td>
            <td><select class="sm-method-set" data-id="${x.id}" data-kind="${x.kind}" style="font-size:11.5px;padding:3px 4px;width:auto;">
              <option value="" selected>— choose —</option>
              <option value="cash">Cash</option>
              <option value="transfer">Bank Transfer</option>
            </select></td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>`}

      <div class="lg-card">
        <div class="lg-card-title">Shop Details — shown on printed receipts</div>
        <div class="lg-grid cols-3">
          <div><label style="margin-top:0">Business name</label><input id="sm-shopname" value="${esc(s.shopName)}"></div>
          <div><label style="margin-top:0">Phone</label><input id="sm-shopphone" value="${esc(s.shopPhone)}"></div>
          <div><label style="margin-top:0">Address</label><input id="sm-shopaddress" value="${esc(s.shopAddress)}"></div>
        </div>
        <div style="margin-top:10px;" class="lg-row-actions">
          <button class="lg-btn ghost small" id="sm-save-shop">Save Shop Details</button>
          <button class="lg-btn ghost small" id="sm-export-summary" type="button">\u2b07 Month summary CSV</button>
          <button class="lg-btn ghost small" id="sm-export-jobs" type="button">\u2b07 All jobs CSV</button>
          <button class="lg-btn ghost small" id="sm-export-customers" type="button">\u2b07 Customers CSV</button>
        </div>
      </div>

      <div class="lg-card">
        <div class="lg-card-title">Split Settings — applied to each day's Net Profit (cash collected minus cost of production and material cost used)</div>
        <div class="lg-grid cols-3">
          <div><label style="margin-top:0">Tithe %</label><input id="sm-tithe" type="number" min="0" max="100" value="${s.tithePct}"></div>
          <div><label style="margin-top:0">PF %</label><input id="sm-pf" type="number" min="0" max="100" value="${s.pfPct}"></div>
          <div><label style="margin-top:0">EX %</label><input id="sm-ex" type="number" min="0" max="100" value="${s.exPct}"></div>
        </div>
        <div style="margin-top:10px;"><button class="lg-btn ghost small" id="sm-save-split">Save Split</button></div>
      </div>

      <div class="lg-grid cols-3">
        <div class="lg-card"><div class="lg-card-title">Collection Rate</div><div style="font-size:20px;font-weight:600">${(collectionRate*100).toFixed(1)}%</div></div>
        <div class="lg-card"><div class="lg-card-title">Debt as % of Billing</div><div style="font-size:20px;font-weight:600">${(debtPct*100).toFixed(1)}%</div></div>
        <div class="lg-card"><div class="lg-card-title">Active Days Logged</div><div style="font-size:20px;font-weight:600">${activeDays} / ${nDays}</div></div>
      </div>

      <div class="lg-card">
        <div class="lg-card-title">${monthLabel} — Daily &amp; Weekly Summary</div>
        <div style="font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:8px;">"Paid" reflects the date money actually came in — including later payments against old debt — not just the day the job was taken in. "Net Profit" = Paid minus that day's cost of production minus "Mat. Used" (the cost of material actually used on that day's jobs), which is what Tithe/PF/EX are split from. Money spent buying stock (see the footnote below) is tracked separately for reference and doesn't reduce Net Profit directly — it's "recovered" day by day as the stock gets used.</div>
        <div style="overflow-x:auto;"><table><thead><tr>
          <th>Day</th><th class="num-col">Billed</th><th class="num-col">Paid</th><th class="num-col">New Debt</th>
          <th class="num-col">Mat. Used</th>
          <th class="num-col">Net Profit</th><th class="num-col">Tithe (${s.tithePct}%)</th><th class="num-col">PF (${s.pfPct}%)</th><th class="num-col">EX (${s.exPct}%)</th><th class="num-col">Cum. Debt</th>
        </tr></thead><tbody>
        ${buildDailyWeeklyTable()}
        <tr style="font-weight:700;border-top:2px solid var(--ink);">
          <td>MONTH TOTAL</td>
          <td class="num-col">${naira(mBilled)}</td><td class="num-col">${naira(mPaid)}</td>
          <td class="num-col">${naira(mNewDebt)}</td>
          <td class="num-col">${naira(mMatCostUsed)}</td>
          <td class="num-col">${naira(mGrand)}</td>
          <td class="num-col">${naira(mTithe)}</td><td class="num-col">${naira(mPf)}</td><td class="num-col">${naira(mEx)}</td>
          <td class="num-col">${naira(cumDebt)}</td>
        </tr>
        </tbody></table></div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;">This month's cost of production: ${naira(mCp)} &middot; material cost bought: ${naira(mMatCost)} &middot; material cost used: ${naira(mMatCostUsed)} — <a href="#" class="goto-purchase-log" style="color:var(--teal);">see Purchase Log</a></div>
      </div>

      <div class="lg-grid cols-2">
        <div class="lg-card">
          <div class="lg-card-title">${monthLabel} — Best Sellers</div>
          <div style="font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:8px;">Ranked by money billed, not by count — a handful of banners can outweigh a hundred photocopies.</div>
          ${topServices.length ? `<table><thead><tr><th>Service</th><th class="num-col">Times</th><th class="num-col">Billed</th></tr></thead><tbody>
          ${topServices.map(x=>`<tr><td>${esc(x.name)}</td><td class="num-col">${x.count}</td><td class="num-col">${naira(x.value)}</td></tr>`).join('')}
          </tbody></table>` : '<div class="lg-empty">No items billed this month yet.</div>'}
        </div>
        <div class="lg-card">
          <div class="lg-card-title">${monthLabel} — Top Customers</div>
          <div style="font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:8px;">By value billed this month. The debt column is what they still owe on those jobs.</div>
          ${topCustomers.length ? `<table><thead><tr><th>Customer</th><th class="num-col">Jobs</th><th class="num-col">Billed</th><th class="num-col">Debt</th></tr></thead><tbody>
          ${topCustomers.map(x=>`<tr><td>${esc(x.name)}</td><td class="num-col">${x.jobs}</td><td class="num-col">${naira(x.billed)}</td><td class="num-col ${x.debt>0?'flag':''}">${x.debt>0?naira(x.debt):'—'}</td></tr>`).join('')}
          </tbody></table>` : '<div class="lg-empty">No jobs billed this month yet.</div>'}
        </div>
      </div>

      <div class="lg-card">
        <div class="lg-card-title">${monthLabel} — Daily Income &amp; Expenses</div>
        <div style="font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:8px;">Income = cash/bank collected that day. Expenses come from the Expenses tab. Balance is the running total for the month.</div>
        <div style="overflow-x:auto;"><table><thead><tr>
          <th>Day</th><th class="num-col">Income</th><th class="num-col">Expenses</th><th class="num-col">Net</th><th class="num-col">Balance</th>
        </tr></thead><tbody>
        ${ie.rowsHtml}
        <tr style="font-weight:700;border-top:2px solid var(--ink);">
          <td>MONTH TOTAL</td>
          <td class="num-col">${naira(ie.totalIncome)}</td><td class="num-col">${naira(ie.totalExpense)}</td>
          <td class="num-col ${ie.netTotal<0?'flag':''}">${naira(ie.netTotal)}</td><td></td>
        </tr>
        </tbody></table></div>
      </div>
    `;
    // Clear the backlog of entries logged before the method field existed.
    content.querySelectorAll('.sm-method-set').forEach(sel=>{
      sel.addEventListener('change', async ()=>{
        if(!sel.value) return;
        const list = sel.dataset.kind === 'cp' ? state.cpspend : state.expenses;
        const entry = list.find(x=>x.id===sel.dataset.id);
        if(!entry) return;
        entry.method = sel.value;
        await save(sel.dataset.kind === 'cp' ? 'cpspend' : 'expenses');
        toast('Marked as ' + methodLabel(sel.value));
        renderSummary();
      });
    });
    document.getElementById('sm-save-shop').addEventListener('click', async ()=>{
      state.settings.shopName = document.getElementById('sm-shopname').value.trim() || 'YOUR BUSINESS NAME';
      state.settings.shopPhone = document.getElementById('sm-shopphone').value.trim();
      state.settings.shopAddress = document.getElementById('sm-shopaddress').value.trim();
      await save('settings');
      toast('Shop details saved');
      renderSummary();
    });
    document.getElementById('sm-export-jobs').addEventListener('click', ()=>exportJobsCSV(state.jobs.slice().sort((a,b)=>(a.dateReceived||'').localeCompare(b.dateReceived||'')), 'all-jobs'));
    document.getElementById('sm-export-customers').addEventListener('click', exportCustomersCSV);
    document.getElementById('sm-export-summary').addEventListener('click', ()=>{
      const rows = [['Day','Billed','Paid','New Debt','Material Used','Net Profit',`Tithe ${s.tithePct}%`,`PF ${s.pfPct}%`,`EX ${s.exPct}%`,'Expenses','Cost of Production']];
      for(let d=1; d<=nDays; d++){
        const date = dateFor(d);
        const st = dayStats(date);
        if(!st.billed && !st.paid && !st.expenseTotal && !st.cp) continue;
        rows.push([date, plainNum(st.billed), plainNum(st.paid), plainNum(st.newDebt), plainNum(st.matCostUsed),
          plainNum(st.netProfit), plainNum(st.tithe), plainNum(st.pf), plainNum(st.ex), plainNum(st.expenseTotal), plainNum(st.cp)]);
      }
      downloadCSV(`summary-${year}-${pad(month+1)}.csv`, rows);
    });
    document.getElementById('sm-save-split').addEventListener('click', async ()=>{
      state.settings.tithePct = Number(document.getElementById('sm-tithe').value)||0;
      state.settings.pfPct = Number(document.getElementById('sm-pf').value)||0;
      state.settings.exPct = Number(document.getElementById('sm-ex').value)||0;
      await save('settings');
      toast('Split settings saved');
      renderSummary();
    });
  }

  // ---------- NEW JOB ----------
  let draftItems = [{service:'', category:'', qty:1, unit:'', unitPrice:0, desc:'', descQty:0, descUnit:'', descUnitPrice:0}];
  let draftMaterials = [{name:'', qty:0, unitCost:0, waste:0}];
  function renderNewJob(){
    const options = state.pricelist.map(p=>`<option value="${p.id}" data-price="${p.price}">${esc(p.name)} — ${naira(p.price)}</option>`).join('');
    content.innerHTML = `
      <div class="lg-card">
        <div class="lg-card-title">Job Intake — Received</div>
        <div class="lg-grid cols-3">
          <div><label>Customer Name</label><input id="nj-customer" placeholder="e.g. WALKIN, OLIVER..."></div>
          <div><label>Phone (optional)</label><input id="nj-phone" placeholder="080..."></div>
          <div><label>Date Received</label><input id="nj-date" type="date" value="${todayISO()}"></div>
        </div>
        <div class="lg-grid cols-2" style="margin-top:4px;">
          <div><label style="margin-top:0">Promised / Due Date</label><input id="nj-due" type="date"></div>
          <div class="readout" style="align-self:end;font-size:11px;color:var(--muted);padding-bottom:8px;">When you told the customer it would be ready. Pending Jobs sorts by this, and anything past its date gets flagged.</div>
        </div>
        <label>Job Description / Notes</label>
        <input id="nj-desc" placeholder="e.g. Rollup banner + design">

        <div style="margin-top:14px;">
          <label style="margin-top:0">Items / Services</label>
          <div id="nj-items"></div>
          <button class="lg-btn ghost small" id="nj-add-item" type="button">+ Add item</button>
        </div>

        <div class="lg-grid cols-3" style="margin-top:14px;">
          <div><label>Paid — Cash</label><input id="nj-cash" type="number" min="0" value="0"></div>
          <div><label>Paid — Bank/Transfer</label><input id="nj-bank" type="number" min="0" value="0"></div>
          <div><label>Cost of Production (CP)</label><input id="nj-cp" type="number" min="0" value="0"></div>
        </div>
        <div class="lg-grid cols-2" style="margin-top:4px;">
          <div><label>Discount (₦)</label><input id="nj-discount" type="number" min="0" value="0" placeholder="0"></div>
          <div class="readout" style="align-self:end;font-size:11px;color:var(--muted);padding-bottom:8px;">Knocked off the items subtotal below — for a special rate, bulk order, or loyal customer.</div>
        </div>

        <label style="margin-top:14px;">Materials Used (optional — updates Inventory automatically, one row per material)</label>
        <datalist id="nj-material-list">${state.materials.map(m=>`<option value="${esc(m.name)}">`).join('')}</datalist>
        <div id="nj-materials"></div>
        <button class="lg-btn ghost small" id="nj-add-material" type="button">+ Add material</button>
        <div class="readout" style="font-size:11px;color:var(--muted);margin-top:6px;">Total material used + wasted: <span id="nj-material-grandtotal">₦0</span> — both are deducted from stock, and both come out of today's (and this month's) profit. This job's own profit isn't reduced by it directly.</div>

        <div class="lg-grid cols-2" style="margin-top:4px;">
          <div><label>Operator</label><input id="nj-operator" placeholder="who's handling it"></div>
          <div><label>Status</label>
            <select id="nj-status">${STATUSES.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
          </div>
        </div>


        <div style="margin-top:16px;padding-top:12px;border-top:1px dashed var(--rule);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div style="font-size:13px;line-height:1.6;">
            <span id="nj-subtotal-wrap" style="display:none;">Subtotal: <strong id="nj-subtotal">₦0</strong> &nbsp;|&nbsp; Discount: <strong id="nj-discount-amt" class="flag">−₦0</strong> &nbsp;|&nbsp; </span>
            Total: <strong id="nj-total">₦0</strong> &nbsp;|&nbsp; Balance: <strong id="nj-balance" class="flag">₦0</strong>
          </div>
          <div class="lg-row-actions">
            <button class="lg-btn ghost" id="nj-quote" type="button" title="Save as a quotation — no job, no debt, nothing counted until the customer agrees">Save as Quote</button>
            <button class="lg-btn" id="nj-save" type="button">Save Job</button>
          </div>
        </div>
      </div>
    `;

    function renderItemRows(){
      const wrap = document.getElementById('nj-items');
      wrap.innerHTML = draftItems.map((it,idx)=>`
        <div class="item-row" data-idx="${idx}">
          <div><label style="margin-top:0">Item name</label><input class="it-name" value="${esc(it.service)}" placeholder="type or pick from catalog \u2192"></div>
          <div><label style="margin-top:0">Quick pick</label>
            <select class="it-service">
              <option value="">catalog\u2026</option>
              ${options}
            </select>
          </div>
          <div><label style="margin-top:0">Qty</label><input class="it-qty" type="number" min="0" value="${it.qty}"></div>
          <div><label style="margin-top:0">Unit</label><input class="it-unit" value="${esc(it.unit||'')}" placeholder="pc, sheet, hr..."></div>
          <div><label style="margin-top:0">Unit Price</label><input class="it-price" type="number" min="0" value="${it.unitPrice}"></div>
          <div><label style="margin-top:0">Amount</label><input class="it-amt" type="text" value="${naira((Number(it.qty)||0)*(Number(it.unitPrice)||0))}" disabled></div>
          <div><button class="lg-btn danger small it-remove" type="button" title="Remove">\u2715</button></div>
          <div style="grid-column:1/-1;margin-top:6px;padding-top:8px;border-top:1px dashed var(--rule);">
            <label style="margin-top:0;font-size:10.5px;">Custom Job Description <span style="text-transform:none;font-weight:400;color:var(--muted);">— for jobs where the price isn't a fixed catalog rate. Note what it covers and give it its own qty/unit/price; that amount is added to this line's total.</span></label>
            <div class="item-desc-row">
              <div><input class="it-desc" value="${esc(it.desc||'')}" placeholder="e.g. custom size 3x6ft banner, matte lamination, rush job"></div>
              <div><input class="it-desc-qty" type="number" min="0" value="${it.descQty||0}" placeholder="Qty"></div>
              <div><input class="it-desc-unit" value="${esc(it.descUnit||'')}" placeholder="Unit"></div>
              <div><input class="it-desc-price" type="number" min="0" value="${it.descUnitPrice||0}" placeholder="Unit Price"></div>
              <div><input class="it-desc-amt" type="text" value="${naira((Number(it.descQty)||0)*(Number(it.descUnitPrice)||0))}" disabled></div>
            </div>
          </div>
        </div>
      `).join('');
      wrap.querySelectorAll('.item-row').forEach(row=>{
        const idx = Number(row.dataset.idx);
        const name = row.querySelector('.it-name');
        const svc = row.querySelector('.it-service');
        const qty = row.querySelector('.it-qty');
        const unit = row.querySelector('.it-unit');
        const price = row.querySelector('.it-price');
        const desc = row.querySelector('.it-desc');
        const descQty = row.querySelector('.it-desc-qty');
        const descUnit = row.querySelector('.it-desc-unit');
        const descPrice = row.querySelector('.it-desc-price');
        name.addEventListener('input', ()=>{ draftItems[idx].service = name.value; });
        unit.addEventListener('input', ()=>{ draftItems[idx].unit = unit.value; });
        desc.addEventListener('input', ()=>{ draftItems[idx].desc = desc.value; });
        descQty.addEventListener('input', ()=>{ draftItems[idx].descQty = descQty.value; recalcTotals(); updateAmt(row, idx); });
        descUnit.addEventListener('input', ()=>{ draftItems[idx].descUnit = descUnit.value; });
        descPrice.addEventListener('input', ()=>{ draftItems[idx].descUnitPrice = descPrice.value; recalcTotals(); updateAmt(row, idx); });
        svc.addEventListener('change', ()=>{
          const opt = svc.selectedOptions[0];
          const p = state.pricelist.find(pp=>pp.id===opt.value);
          if(p){
            draftItems[idx].service = p.name; draftItems[idx].category = p.category;
            name.value = p.name; price.value = p.price; draftItems[idx].unitPrice = p.price;
            recalcTotals(); updateAmt(row, idx); svc.value='';
          }
        });
        qty.addEventListener('input', ()=>{ draftItems[idx].qty = qty.value; recalcTotals(); updateAmt(row, idx); });
        price.addEventListener('input', ()=>{ draftItems[idx].unitPrice = price.value; recalcTotals(); updateAmt(row, idx); });
        row.querySelector('.it-remove').addEventListener('click', ()=>{
          if(draftItems.length>1){ draftItems.splice(idx,1); renderItemRows(); recalcTotals(); }
        });
      });
    }
    function updateAmt(row, idx){
      row.querySelector('.it-amt').value = naira((Number(draftItems[idx].qty)||0)*(Number(draftItems[idx].unitPrice)||0));
      row.querySelector('.it-desc-amt').value = naira((Number(draftItems[idx].descQty)||0)*(Number(draftItems[idx].descUnitPrice)||0));
    }
    function recalcTotals(){
      const rawTotal = draftItems.reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.unitPrice)||0)+(Number(it.descQty)||0)*(Number(it.descUnitPrice)||0),0);
      const discount = Math.min(Number(document.getElementById('nj-discount').value)||0, rawTotal);
      const total = Math.max(rawTotal - discount, 0);
      const paid = (Number(document.getElementById('nj-cash').value)||0) + (Number(document.getElementById('nj-bank').value)||0);
      const subtotalWrap = document.getElementById('nj-subtotal-wrap');
      subtotalWrap.style.display = discount>0 ? 'inline' : 'none';
      document.getElementById('nj-subtotal').textContent = naira(rawTotal);
      document.getElementById('nj-discount-amt').textContent = '−' + naira(discount);
      document.getElementById('nj-total').textContent = naira(total);
      document.getElementById('nj-balance').textContent = naira(Math.max(total-paid,0));
    }
    renderItemRows();
    document.getElementById('nj-add-item').addEventListener('click', ()=>{ draftItems.push({service:'',category:'',qty:1,unit:'',unitPrice:0,desc:'',descQty:0,descUnit:'',descUnitPrice:0}); renderItemRows(); });
    document.getElementById('nj-cash').addEventListener('input', recalcTotals);
    document.getElementById('nj-bank').addEventListener('input', recalcTotals);
    document.getElementById('nj-discount').addEventListener('input', recalcTotals);
    recalcTotals();

    // Materials Used: one row per material, unit cost auto-fills from Material Prices when the
    // name matches something already tracked; still editable by hand for a brand-new material.
    function renderMaterialRows(){
      const wrap = document.getElementById('nj-materials');
      wrap.innerHTML = draftMaterials.map((m,idx)=>`
        <div class="material-row" data-idx="${idx}">
          <div><label style="margin-top:0">Material name</label><input class="mt-name" list="nj-material-list" value="${esc(m.name)}" placeholder="e.g. SAV, A4, FLEX"></div>
          <div><label style="margin-top:0">Qty used</label><input class="mt-qty" type="number" min="0" value="${m.qty}"></div>
          <div><label style="margin-top:0">Qty wasted</label><input class="mt-waste" type="number" min="0" value="${m.waste||0}" title="Paper jammed, spoiled prints, etc. — still deducts from stock and counts as a cost."></div>
          <div>
            <label style="margin-top:0">Unit cost (\u20a6)</label><input class="mt-cost" type="number" min="0" value="${m.unitCost}">
            <div class="readout mt-hint" style="font-size:10px;color:var(--muted);margin-top:2px;">${m.name?'':'pulled from Material Prices'}</div>
          </div>
          <div><label style="margin-top:0">Total</label><input class="mt-total" type="text" value="${naira(((Number(m.qty)||0)+(Number(m.waste)||0))*(Number(m.unitCost)||0))}" disabled></div>
          <div><button class="lg-btn danger small mt-remove" type="button" title="Remove">\u2715</button></div>
        </div>
      `).join('');
      wrap.querySelectorAll('.material-row').forEach(row=>{
        const idx = Number(row.dataset.idx);
        const nameInp = row.querySelector('.mt-name');
        const qtyInp = row.querySelector('.mt-qty');
        const wasteInp = row.querySelector('.mt-waste');
        const costInp = row.querySelector('.mt-cost');
        const hint = row.querySelector('.mt-hint');
        function updateRowTotal(){
          const qty = Number(draftMaterials[idx].qty)||0;
          const waste = Number(draftMaterials[idx].waste)||0;
          row.querySelector('.mt-total').value = naira((qty+waste)*(Number(draftMaterials[idx].unitCost)||0));
          updateMaterialGrandTotal();
        }
        nameInp.addEventListener('input', ()=>{
          draftMaterials[idx].name = nameInp.value;
          const match = state.materials.find(mm=>normName(mm.name)===normName(nameInp.value));
          if(match){
            costInp.value = match.unitCost || 0;
            draftMaterials[idx].unitCost = match.unitCost || 0;
            hint.textContent = 'pulled from Material Prices (' + naira(match.unitCost||0) + '/' + (match.unit||'unit') + ')';
          } else if(nameInp.value.trim()){
            hint.textContent = 'new material — type its cost, it\'ll be saved to Material Prices';
          } else {
            hint.textContent = 'pulled from Material Prices';
          }
          updateRowTotal();
        });
        qtyInp.addEventListener('input', ()=>{ draftMaterials[idx].qty = qtyInp.value; updateRowTotal(); });
        wasteInp.addEventListener('input', ()=>{ draftMaterials[idx].waste = wasteInp.value; updateRowTotal(); });
        costInp.addEventListener('input', ()=>{ draftMaterials[idx].unitCost = costInp.value; updateRowTotal(); });
        row.querySelector('.mt-remove').addEventListener('click', ()=>{
          if(draftMaterials.length>1){ draftMaterials.splice(idx,1); renderMaterialRows(); }
          else { draftMaterials[0] = {name:'',qty:0,unitCost:0,waste:0}; renderMaterialRows(); }
        });
      });
      updateMaterialGrandTotal();
    }
    function updateMaterialGrandTotal(){
      const total = draftMaterials.reduce((s,m)=>s+((Number(m.qty)||0)+(Number(m.waste)||0))*(Number(m.unitCost)||0),0);
      const el = document.getElementById('nj-material-grandtotal');
      if(el) el.textContent = naira(total);
    }
    renderMaterialRows();
    document.getElementById('nj-add-material').addEventListener('click', ()=>{
      draftMaterials.push({name:'',qty:0,unitCost:0,waste:0}); renderMaterialRows();
    });

    // A quote is the same shape as a job so every total/receipt helper works on it, but it
    // lives in state.quotes — so it never counts as revenue, debt, CP, or material usage
    // until it's converted.
    document.getElementById('nj-quote').addEventListener('click', async ()=>{
      const items = draftItems.filter(it=>Number(it.qty)>0 || Number(it.descQty)>0).map(it=>({
        service: (it.service||'').trim() || 'ITEM', category: it.category||'', qty:Number(it.qty)||0, unit:(it.unit||'').trim(), unitPrice:Number(it.unitPrice)||0,
        desc:(it.desc||'').trim(), descQty:Number(it.descQty)||0, descUnit:(it.descUnit||'').trim(), descUnitPrice:Number(it.descUnitPrice)||0
      }));
      if(items.length===0){ toast('Add at least one item with a quantity'); return; }
      const rawTotalV = items.reduce((s,it)=>s+it.qty*it.unitPrice+it.descQty*it.descUnitPrice,0);
      const quote = {
        id: uid(),
        customerName: document.getElementById('nj-customer').value.trim() || 'WALKIN',
        phone: document.getElementById('nj-phone').value.trim(),
        dateCreated: todayISO(),
        validUntil: shiftDate(todayISO(), 14),
        description: document.getElementById('nj-desc').value.trim(),
        items,
        discount: Math.min(Number(document.getElementById('nj-discount').value)||0, rawTotalV),
        cp: Number(document.getElementById('nj-cp').value)||0,
        materials: draftMaterials
          .filter(m=>(m.name||'').trim() && (Number(m.qty)>0 || Number(m.waste)>0))
          .map(m=>({name:m.name.trim(), qty:Number(m.qty)||0, unitCost:Number(m.unitCost)||0, waste:Number(m.waste)||0})),
        operator: document.getElementById('nj-operator').value.trim(),
        dueDate: document.getElementById('nj-due').value || '',
        payments: [],
      };
      state.quotes.push(quote);
      await save('quotes');
      draftItems = [{service:'',category:'',qty:1,unit:'',unitPrice:0,desc:'',descQty:0,descUnit:'',descUnitPrice:0}];
      draftMaterials = [{name:'',qty:0,unitCost:0,waste:0}];
      toast('Quote saved \u2014 ' + quote.customerName);
      state.tab = 'quotes';
      renderAll();
    });

    document.getElementById('nj-save').addEventListener('click', async (e)=>{
      await withButtonGuard(e.currentTarget, 'Saving…', async ()=>{
      const customerName = document.getElementById('nj-customer').value.trim() || 'WALKIN';
      const items = draftItems.filter(it=>Number(it.qty)>0 || Number(it.descQty)>0).map(it=>({
        service: (it.service||'').trim() || 'ITEM', category: it.category||'', qty:Number(it.qty)||0, unit:(it.unit||'').trim(), unitPrice:Number(it.unitPrice)||0,
        desc:(it.desc||'').trim(), descQty:Number(it.descQty)||0, descUnit:(it.descUnit||'').trim(), descUnitPrice:Number(it.descUnitPrice)||0
      }));
      if(items.length===0){ toast('Add at least one item with a quantity'); return; }
      const dateReceived = document.getElementById('nj-date').value || todayISO();
      const cashV = Number(document.getElementById('nj-cash').value)||0;
      const bankV = Number(document.getElementById('nj-bank').value)||0;
      const rawTotalV = items.reduce((s,it)=>s+it.qty*it.unitPrice+it.descQty*it.descUnitPrice,0);
      const discountV = Math.min(Number(document.getElementById('nj-discount').value)||0, rawTotalV);
      const materials = draftMaterials
        .filter(m=>(m.name||'').trim() && (Number(m.qty)>0 || Number(m.waste)>0))
        .map(m=>({name:m.name.trim(), qty:Number(m.qty)||0, unitCost:Number(m.unitCost)||0, waste:Number(m.waste)||0}));
      const job = {
        id: uid(),
        customerName, phone: document.getElementById('nj-phone').value.trim(),
        dateReceived,
        description: document.getElementById('nj-desc').value.trim(),
        items,
        discount: discountV,
        paidCash: cashV, paidBank: bankV,   // kept for reference; totals now read from `payments`
        payments: (cashV>0 || bankV>0) ? [{date: dateReceived, cash: cashV, bank: bankV, note:'Job intake'}] : [],
        cp: Number(document.getElementById('nj-cp').value)||0,
        materials,
        operator: document.getElementById('nj-operator').value.trim(),
        dueDate: document.getElementById('nj-due').value || '',
        status: document.getElementById('nj-status').value,
        history: [{status: document.getElementById('nj-status').value, date: todayISO()}],
      };
      state.jobs.push(job);
      recomputeAllCustomers();
      items.forEach(it=> upsertPriceListFromJob(it));
      let materialsChanged = false;
      materials.forEach(m=>{
        const existing = state.materials.find(mm=>normName(mm.name)===normName(m.name));
        if(!existing){
          state.materials.push({id: uid(), name: m.name, unit:'unit', unitCost: m.unitCost, opening:0, restocked:0, reorderLevel:0});
          materialsChanged = true;
        }
      });
      // One cloud round trip instead of three or four sequential ones.
      await saveMany(materialsChanged ? ['materials','jobs','customers','pricelist'] : ['jobs','customers','pricelist']);
      draftItems = [{service:'',category:'',qty:1,unit:'',unitPrice:0,desc:'',descQty:0,descUnit:'',descUnitPrice:0}];
      draftMaterials = [{name:'',qty:0,unitCost:0,waste:0}];
      toast('Job saved — ' + customerName);
      state.tab = 'jobs';
      renderAll();
      if(cashV>0 || bankV>0){
        await showReceipt(job, cashV+bankV, {cash:cashV, bank:bankV});
      }
      });
    });
  }

  // ---------- JOBS (kanban + table) ----------
  let jobsView = 'board';
  let jobsViewDate = todayISO();
  let jobsDateFilterOn = true;
  function renderJobs(){
    content.innerHTML = `
      <div class="lg-card">
        <div style="display:flex; gap:10px; align-items:end; flex-wrap:wrap;">
          <div><label style="margin-top:0">Date Received</label><input id="jv-date" type="date" value="${jobsViewDate}" ${jobsDateFilterOn?'':'disabled'}></div>
          <button class="lg-btn ghost small" id="jv-prev" type="button" ${jobsDateFilterOn?'':'disabled'}>\u25c0 Prev day</button>
          <button class="lg-btn ghost small" id="jv-today" type="button" ${jobsDateFilterOn?'':'disabled'}>Today</button>
          <button class="lg-btn ghost small" id="jv-next" type="button" ${jobsDateFilterOn?'':'disabled'}>Next day \u25b6</button>
          <label style="display:flex;align-items:center;gap:6px;font-size:12px;text-transform:none;font-weight:400;color:var(--muted);margin-top:0;">
            <input type="checkbox" id="jv-datefilter" style="width:auto;" ${jobsDateFilterOn?'checked':''}> Filter by date
          </label>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div class="lg-row-actions">
          <button class="lg-btn ${jobsView==='board'?'':'ghost'} small" id="jv-board">Board</button>
          <button class="lg-btn ${jobsView==='table'?'':'ghost'} small" id="jv-table">Table</button>
        </div>
        <div class="lg-row-actions">
          <input id="jobs-search" placeholder="Search customer or description…" style="max-width:260px;">
          <button class="lg-btn ghost small" id="jv-export" type="button">\u2b07 Export CSV</button>
        </div>
      </div>
      <div id="jobs-body"></div>
    `;
    document.getElementById('jv-board').addEventListener('click', ()=>{ jobsView='board'; renderJobs(); });
    document.getElementById('jv-table').addEventListener('click', ()=>{ jobsView='table'; renderJobs(); });
    document.getElementById('jv-date').addEventListener('change', (e)=>{ jobsViewDate = e.target.value || todayISO(); renderJobs(); });

  function renderCPForm(j){

  function renderJobsTable(jobs, withActions){

  function defaultJobsReRender(){

  // ---------- PENDING JOBS ----------
  // Anything not yet DELIVERED lands here automatically — including brand-new jobs and any
  // backlog you log (via New Job, using its real intake date) for work that was already
  // in progress before this ledger existed.
  let pendingSearch = '';
  // renderPending() rebuilds the entire tab, which destroys and recreates #pd-search.
  // These carry focus + caret across that rebuild so typing isn't interrupted, and
  // debounce the rebuild so it runs once after typing settles instead of per keystroke.
  let pendingSearchTimer = null, pendingSearchFocused = false, pendingSearchCaret = 0;
  function pendingJobsList(q){
    // Every job that isn't delivered yet, whatever day it came in on — work left
    // unfinished yesterday is still outstanding today and has to roll over.
    // Deliberately does NOT use filteredJobs(), whose date filter belongs to the
    // Jobs tab and was previously hiding the entire backlog from this list.
    return state.jobs
      .filter(j => j.status!=='DELIVERED' && matchesJobQuery(j, q))
      .sort(byDueThenDate);
  }
  function renderPending(){
    const jobs = pendingJobsList(pendingSearch);
    const totalBilled = jobs.reduce((s,j)=>s+jobTotals(j).totalBilled,0);
    const totalOwed = jobs.reduce((s,j)=>s+jobTotals(j).debt,0);
    const lateCount = jobs.filter(j=>dueInfo(j).overdue).length;
    content.innerHTML = `
      <div class="lg-card">
        <div class="lg-card-title">Pending Jobs — anything not yet Delivered</div>
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">
          This list keeps itself up to date — every job you create in New Job stays here until you mark it Delivered, soonest promised date first. Jobs with no promised date sit at the bottom.
          Got jobs that were already in progress before you started using this ledger? Log them in New Job with their real (past) intake date — they'll show up here right away, right alongside new work.
        </div>
        <div class="lg-row-actions">
          <button class="lg-btn" id="pd-add" type="button">+ Enter a Pending / Backlog Job</button>
          <input id="pd-search" placeholder="Search customer or description…" style="max-width:240px;" value="${esc(pendingSearch)}">
          <button class="lg-btn ghost small" id="pd-export" type="button">\u2b07 Export CSV</button>
        </div>
      </div>
      <div class="lg-grid cols-4">
        <div class="lg-card lg-kpi"><div class="num">${jobs.length}</div><div class="lbl">Jobs Pending</div></div>
        <div class="lg-card lg-kpi ${lateCount?'debt':''}"><div class="num">${lateCount}</div><div class="lbl">Past Promised Date</div></div>
        <div class="lg-card lg-kpi"><div class="num">${naira(totalBilled)}</div><div class="lbl">Total Value Pending</div></div>
        <div class="lg-card lg-kpi debt"><div class="num">${naira(totalOwed)}</div><div class="lbl">Still Owed on These</div></div>
      </div>
      <div class="lg-card">${renderJobsTable(jobs, true)}</div>
    `;
    document.getElementById('pd-add').addEventListener('click', ()=>{ state.tab='newjob'; renderAll(); });
    document.getElementById('pd-export').addEventListener('click', ()=>exportJobsCSV(jobs, 'pending-jobs'));
    const search = document.getElementById('pd-search');
    if(pendingSearchFocused){
      search.focus();
      try{ search.setSelectionRange(pendingSearchCaret, pendingSearchCaret); }catch(e){}
      pendingSearchFocused = false;
    }
    search.addEventListener('input', ()=>{
      pendingSearch = search.value;
      pendingSearchCaret = search.selectionStart;
      pendingSearchFocused = true;
      clearTimeout(pendingSearchTimer);
      pendingSearchTimer = setTimeout(renderPending, 180);
    });
    attachStatusHandlers(renderPending);
    attachDeleteHandlers(renderPending);
    attachPaymentHandlers(renderPending);
    attachWasteHandlers(renderPending);
    attachCPHandlers(renderPending);
    attachGuideHandlers(renderPending);
  }
  function attachStatusHandlers(reRender){

    document.querySelectorAll('.job-status-select').forEach(sel=>{
      sel.addEventListener('change', async ()=>{
        const j = state.jobs.find(j=>j.id===sel.dataset.id);

        j.status = sel.value;
        j.history = j.history||[];
        j.history.push({status:sel.value, date: todayISO()});
        await save('jobs');
        toast(j.customerName + ' → ' + sel.value);
        reRender();
      });
    });
  }
  function attachDeleteHandlers(reRender){
    reRender = reRender || defaultJobsReRender;

      btn.addEventListener('click', async (e)=>{
        await withButtonGuard(e.currentTarget, 'Removing…', async ()=>{
          state.jobs = state.jobs.filter(j=>j.id!==btn.dataset.id);
          recomputeAllCustomers();
          await saveMany(['jobs','customers']);
          toast('Job removed');
          reRender();

  function attachGuideHandlers(reRender){
    reRender = reRender || defaultJobsReRender;
    document.querySelectorAll('.job-guide-toggle').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        openGuideId = (openGuideId===btn.dataset.id) ? null : btn.dataset.id;

        const idx = Number(cb.dataset.idx);
        j.checklist = j.checklist || {};

        reRender();

  function attachPaymentHandlers(reRender){
    reRender = reRender || defaultJobsReRender;
    document.querySelectorAll('.job-payment-toggle').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        openPaymentId = (openPaymentId===btn.dataset.id) ? null : btn.dataset.id;
        reRender();

      btn.addEventListener('click', ()=>{
        openPaymentId = null;
        reRender();
      });
    });
    document.querySelectorAll('.job-receipt').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const j = state.jobs.find(j=>j.id===btn.dataset.id);
        if(!j || !j.payments || !j.payments.length) return;
        const last = j.payments[j.payments.length-1];
        await showReceipt(j, (Number(last.cash)||0)+(Number(last.bank)||0), {cash:Number(last.cash)||0, bank:Number(last.bank)||0});

        const bank = Number(form.querySelector('.pay-bank').value)||0;
        if(cash<=0 && bank<=0){ toast('Enter a cash or bank amount'); return; }
        const j = state.jobs.find(j=>j.id===btn.dataset.id);
        if(!j) return;
        j.payments = j.payments || [];
        j.payments.push({date: todayISO(), cash, bank, note:'Payment'});
        recomputeAllCustomers();
        await saveMany(['jobs','customers']);
        toast('Payment recorded — ' + naira(cash+bank));
        openPaymentId = null;
        reRender();

  function attachWasteHandlers(reRender){
    reRender = reRender || defaultJobsReRender;
    document.querySelectorAll('.job-waste-toggle').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        openWasteId = (openWasteId===btn.dataset.id) ? null : btn.dataset.id;
        reRender();
      });
    });
    document.querySelectorAll('.waste-cancel').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        openWasteId = null;
        reRender();
      });
    });
    document.querySelectorAll('.waste-submit').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const form = btn.closest('.pay-form');
        const materialName = form.querySelector('.waste-material').value.trim();
        const qty = Number(form.querySelector('.waste-qty').value)||0;
        if(!materialName){ toast('Enter a material name'); return; }
        if(qty<=0){ toast('Enter a quantity greater than 0'); return; }
        const j = state.jobs.find(j=>j.id===btn.dataset.id);
        if(!j) return;
        j.materials = jobMaterialsList(j); // normalize old single-material jobs into the array format
        const key = normName(materialName);
        let m = j.materials.find(mm=>normName(mm.name)===key);
        if(m){
          m.waste = (Number(m.waste)||0) + qty;
        } else {
          // material wasn't already on this job — look up its going rate so the cost is still counted
          const known = state.materials.find(mm=>normName(mm.name)===key);
          j.materials.push({name: materialName, qty:0, unitCost: known?known.unitCost:0, waste: qty});
          if(!known){
            state.materials.push({id: uid(), name: materialName, unit:'unit', unitCost:0, opening:0, restocked:0, reorderLevel:0});
            await save('materials');
          }
        }
        await save('jobs');
        toast('Waste recorded — ' + materialName + ' \u00d7' + qty);
        openWasteId = null;
        reRender();
      });
    });
  }

  function attachCPHandlers(reRender){
    reRender = reRender || defaultJobsReRender;

        openCPId = (openCPId===btn.dataset.id) ? null : btn.dataset.id;
        reRender();
      });

    document.querySelectorAll('.cp-cancel').forEach(btn=>{

        reRender();

        const cp = Number(form.querySelector('.cp-value').value)||0;

        reRender();
      });
    });

  function upsertPriceListFromJob(item){
    if(!item.service || item.service==='ITEM') return; // nothing meaningful to file under
    const key = normName(item.service);
    let p = state.pricelist.find(pp=>normName(pp.name)===key);
    if(p){
      p.price = item.unitPrice;
      p.timesUsed = (p.timesUsed||0) + 1;
      p.lastUpdated = todayISO();
    } else {
      state.pricelist.push({
        id: uid(), name: item.service.trim(), category: item.category || 'GENERAL',
        unit:'pc', price: item.unitPrice, timesUsed:1, lastUpdated: todayISO()
      });
    }
  }

  // ---------- INVENTORY ----------
  function computeMaterialUsage(){
    const map = {}; // NORM_KEY -> {qty, cost, waste, wasteCost}
    state.jobs.forEach(j=>{
      jobMaterialsList(j).forEach(m=>{
        if(!m.name) return;
        const key = normName(m.name);
        if(!map[key]) map[key] = {qty:0, cost:0, waste:0, wasteCost:0};
        map[key].qty += Number(m.qty)||0;
        map[key].cost += (Number(m.qty)||0) * (Number(m.unitCost)||0);
        map[key].waste += Number(m.waste)||0;
        map[key].wasteCost += (Number(m.waste)||0) * (Number(m.unitCost)||0);
      });
    });
    return map;
  }
  function computeDailyMaterialUsage(){
    const map = {}; // NORM_KEY -> {date: {qty, cost}}
    state.jobs.forEach(j=>{
      if(!j.dateReceived) return;
      jobMaterialsList(j).forEach(m=>{
        if(!m.name) return;
        const key = normName(m.name);
        if(!map[key]) map[key] = {};
        if(!map[key][j.dateReceived]) map[key][j.dateReceived] = {qty:0, cost:0};
        map[key][j.dateReceived].qty += Number(m.qty)||0;
        map[key][j.dateReceived].cost += (Number(m.qty)||0) * (Number(m.unitCost)||0);
      });
    });
    return map;
  }
  function totalRestocked(m){
    const legacy = Number(m.restocked)||0;
    const logged = (m.purchases||[]).reduce((s,p)=>s+(Number(p.qty)||0),0);
    return legacy + logged;
  }
  function allStockPurchases(){

    });
    return list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  }

  function renderStockUsageGrid(){

    const datesSet = new Set();
    materialKeys.forEach(k=> Object.keys(dailyMap[k]).forEach(d=>datesSet.add(d)));
    const dates = Array.from(datesSet).sort();

    let rowsHtml = '';
    let weekTotals = {}; materialCols.forEach(m=>weekTotals[m.key]=0);
    let weekRowTotal = 0, weekCostTotal = 0;
    let currentWeek = null;
    const grandTotals = {}; materialCols.forEach(m=>grandTotals[m.key]=0);
    let grandRowTotal = 0, grandCostTotal = 0;

    function flushWeek(){
      if(currentWeek===null) return '';
      return `<tr style="font-weight:700;background:rgba(185,121,28,0.08);">
        <td colspan="2">${currentWeek} TOTAL</td>

    dates.forEach(date=>{
      const wk = isoWeekLabel(date);
      if(currentWeek!==null && wk!==currentWeek){
        rowsHtml += flushWeek();

      currentWeek = wk;

      const cells = materialCols.map(m=>{
        const entry = (dailyMap[m.key] && dailyMap[m.key][date]) || {qty:0, cost:0};

      }).join('');
      weekRowTotal += rowTotal; weekCostTotal += rowCost;
      grandRowTotal += rowTotal; grandCostTotal += rowCost;

    });
    rowsHtml += flushWeek();
    rowsHtml += `<tr style="font-weight:700;border-top:2px solid var(--ink);">
      <td colspan="2">GRAND TOTAL</td>
      ${materialCols.map(m=>`<td class="num-col">${grandTotals[m.key]}</td>`).join('')}

      <th>Date</th><th>Week</th>

  function renderNewStockSpendSummary(){

  // ---------- EXPENSES ----------
  // The Expenses tab runs as a purse, same idea as the CP Account: each day the EX share of
  // that day's Net Profit drops in, the expenses you log are what comes out, and the
  // remainder carries into the next day. The expense entries themselves are unchanged —
  // they still feed Net Cash exactly as before. The purse is a layer on top that answers
  // "is there still expense money left, and how much did I carry over?"
  let expensesViewDate = todayISO();

  // Net Profit for one day, mirroring dayStats() — money collected that day, less the cost
  // of production and material used/wasted on jobs received that day.
  function exNetProfitForDate(dateStr){
    let cp=0, matUsed=0, matWaste=0;
    state.jobs.forEach(j=>{
      if(j.dateReceived!==dateStr) return;
      const t = jobTotals(j);
      cp += t.cp; matUsed += t.materialUsedCost; matWaste += t.materialWasteCost;
    });
    let paid = 0;
    state.jobs.forEach(j=>{
      (j.payments||[]).forEach(p=>{ if(p.date===dateStr) paid += (Number(p.cash)||0)+(Number(p.bank)||0); });
    });
    allOldDebtPayments().forEach(p=>{ if(p.date===dateStr) paid += p.cash + p.bank; });
    return Math.max(paid - cp - matUsed - matWaste, 0);
  }
  function exAutoForDate(dateStr){
    return exNetProfitForDate(dateStr) * (Number(state.settings.exPct)||0) / 100;
  }
  function exAdjustFor(dateStr){
    const a = state.exadjust.find(x=>x.date===dateStr);
    return a ? (Number(a.amount)||0) : null;   // null = no override, use the EX share
  }
  function exInflowFor(dateStr){
    const a = exAdjustFor(dateStr);
    return a===null ? exAutoForDate(dateStr) : a;
  }
  function exSpentFor(dateStr){
    return state.expenses.filter(e=>e.date===dateStr).reduce((s,e)=>s+(Number(e.amount)||0),0);
  }
  // Every date that moves the purse — a day that earned EX, a manual adjustment, or spending.
  function exActiveDates(){
    const set = new Set();
    state.jobs.forEach(j=>{
      if(j.dateReceived) set.add(j.dateReceived);
      (j.payments||[]).forEach(p=>{ if(p.date) set.add(p.date); });
    });
    allOldDebtPayments().forEach(p=>{ if(p.date) set.add(p.date); });
    state.exadjust.forEach(a=>{ if(a.date) set.add(a.date); });
    state.expenses.forEach(e=>{ if(e.date) set.add(e.date); });
    return Array.from(set).sort();
  }
  function exOpeningFor(dateStr){
    const start = state.settings.exStartDate || '';
    let bal = Number(state.settings.exOpeningFloat)||0;
    exActiveDates().forEach(d=>{
      if(d >= dateStr) return;
      if(start && d < start) return;
      bal += exInflowFor(d) - exSpentFor(d);
    });
    return bal;
  }
  function exDayRow(dateStr){
    const opening = exOpeningFor(dateStr);
    const inflow  = exInflowFor(dateStr);
    const spent   = exSpentFor(dateStr);
    return {
      opening, inflow, spent,
      available: opening + inflow,
      closing: opening + inflow - spent,
      auto: exAutoForDate(dateStr),
      netProfit: exNetProfitForDate(dateStr),
      adjusted: exAdjustFor(dateStr) !== null,
    };
  }
  function exMonthTable(ym){
    const [yy, mm] = ym.split('-').map(Number);
    const n = daysInMonth(yy, mm-1);
    const pad = x=>String(x).padStart(2,'0');
    let running = exOpeningFor(`${ym}-01`);
    const monthOpening = running;
    let rows = '', inTotal = 0, outTotal = 0, shown = 0;
    for(let d=1; d<=n; d++){
      const date = `${ym}-${pad(d)}`;
      const inflow = exInflowFor(date);
      const spent  = exSpentFor(date);
      const opening = running;
      running = opening + inflow - spent;
      if(!inflow && !spent) continue;
      shown++;
      inTotal += inflow; outTotal += spent;

        <td class="num-col">${naira(spent)}</td>

      </tr>`;

      <th>Day</th><th class="num-col">Carried In</th><th class="num-col">EX In</th>

    <div style="font-size:11px;color:var(--muted);margin-top:6px;">Days with no EX in and nothing spent are skipped. A <b>*</b> marks a day whose EX figure you adjusted by hand.</div>`;
  }

  // ---------- CP ACCOUNT ----------
  // A running "production purse", kept deliberately separate from Expenses and from the
  // profit maths. Each day the CP of that day's jobs drops into the purse, you log what you
  // actually spent producing the work, and whatever is left carries into the next day.
  // Nothing here touches Net Profit, Net Cash, or the Tithe/PF/EX split — this is a
  // cash-in-hand tracker for production money, and it answers one question: is the money
  // still in the purse, and where did the rest of it go?
  let cpViewDate = todayISO();
  const CP_SPEND_SUGGESTIONS = ['Ink / Toner','Paper','Transport','Casual labour','Fuel / Generator','Outsourced printing','Repairs','Miscellaneous'];

  function cpAutoForDate(dateStr){
    return state.jobs.filter(j=>j.dateReceived===dateStr).reduce((s,j)=>s+(Number(j.cp)||0),0);
  }
  function cpAdjustFor(dateStr){
    const a = state.cpadjust.find(x=>x.date===dateStr);
    return a ? (Number(a.amount)||0) : null;   // null = no override, use the auto figure
  }
  function cpInflowFor(dateStr){
    const a = cpAdjustFor(dateStr);
    return a===null ? cpAutoForDate(dateStr) : a;
  }
  function cpSpentFor(dateStr){
    return state.cpspend.filter(e=>e.date===dateStr).reduce((s,e)=>s+(Number(e.amount)||0),0);
  }
  // Every date that moves the purse — a day with job CP, a manual adjustment, or spending.
  function cpActiveDates(){
    const set = new Set();
    state.jobs.forEach(j=>{ if(j.dateReceived && (Number(j.cp)||0)!==0) set.add(j.dateReceived); });
    state.cpadjust.forEach(a=>{ if(a.date) set.add(a.date); });
    state.cpspend.forEach(e=>{ if(e.date) set.add(e.date); });
    return Array.from(set).sort();
  }
  // Opening balance = the float you started with, plus every earlier day's inflow minus
  // its spending. Days before the chosen start date are ignored entirely.
  function cpOpeningFor(dateStr){
    const start = state.settings.cpStartDate || '';
    let bal = Number(state.settings.cpOpeningFloat)||0;
    cpActiveDates().forEach(d=>{
      if(d >= dateStr) return;
      if(start && d < start) return;
      bal += cpInflowFor(d) - cpSpentFor(d);
    });
    return bal;
  }
  function cpDayRow(dateStr){
    const opening = cpOpeningFor(dateStr);
    const inflow  = cpInflowFor(dateStr);
    const spent   = cpSpentFor(dateStr);
    return {
      opening, inflow, spent,
      available: opening + inflow,
      closing: opening + inflow - spent,
      auto: cpAutoForDate(dateStr),
      adjusted: cpAdjustFor(dateStr) !== null,
    };
  }

  function cpMonthTable(ym){
    const [yy, mm] = ym.split('-').map(Number);
    const n = daysInMonth(yy, mm-1);
    const pad = x=>String(x).padStart(2,'0');
    let running = cpOpeningFor(`${ym}-01`);
    const monthOpening = running;
    let rows = '', inTotal = 0, outTotal = 0, shown = 0;
    for(let d=1; d<=n; d++){
      const date = `${ym}-${pad(d)}`;
      const inflow = cpInflowFor(date);
      const spent  = cpSpentFor(date);
      const opening = running;
      running = opening + inflow - spent;
      if(!inflow && !spent) continue;
      shown++;
      inTotal += inflow; outTotal += spent;
      const isToday = date === cpViewDate;
      rows += `<tr style="${isToday?'background:rgba(185,121,28,0.10);font-weight:600;':''}">
        <td><button class="subtle-link cp-jump" data-date="${date}">${fmtDate(date)}</button></td>
        <td class="num-col">${naira(opening)}</td>
        <td class="num-col">${naira(inflow)}${cpAdjustFor(date)!==null?' <span class="muted" title="manually adjusted">*</span>':''}</td>
        <td class="num-col">${naira(opening+inflow)}</td>
        <td class="num-col">${naira(spent)}</td>
        <td class="num-col ${running<0?'flag':''}">${naira(running)}</td>
      </tr>`;
    }
    if(!shown){
      return `<div class="lg-empty">Nothing has moved through the purse this month yet.</div>`;
    }
    return `<div style="overflow-x:auto;"><table><thead><tr>
      <th>Day</th><th class="num-col">Carried In</th><th class="num-col">CP In</th>
      <th class="num-col">Available</th><th class="num-col">Spent</th><th class="num-col">Carried Forward</th>
    </tr></thead><tbody>
      ${rows}
      <tr style="font-weight:700;border-top:2px solid var(--ink);">
        <td>MONTH TOTAL</td>
        <td class="num-col">${naira(monthOpening)}</td>
        <td class="num-col">${naira(inTotal)}</td>
        <td class="num-col">—</td>
        <td class="num-col">${naira(outTotal)}</td>
        <td class="num-col ${running<0?'flag':''}">${naira(running)}</td>
      </tr>
    </tbody></table></div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px;">Days with no CP in and nothing spent are skipped. A <b>*</b> marks a day whose CP figure you adjusted by hand.</div>`;
  }
