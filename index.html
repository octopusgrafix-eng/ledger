  // ---------- late-job alarm ----------
  // Deliberately no AI and no network: a job is late when its promised date has passed
  // and it isn't DELIVERED. That's a date comparison, and it needs to be instant,
  // free, and work offline — so it runs off dueInfo() and nothing else.
  //
  // Which jobs a device has already alerted on is kept in localStorage rather than in
  // the synced ledger: the desktop having shown a notification shouldn't stop the phone
  // from showing its own.
  const ALARM_SEEN_KEY = 'ledgerapp_alarm_seen';
  let alarmTimer = null;

  function alarmSeen(){
    try{ return new Set(JSON.parse(localStorage.getItem(ALARM_SEEN_KEY) || '[]')); }
    catch(e){ return new Set(); }
  }
  function alarmMarkSeen(ids){
    try{ localStorage.setItem(ALARM_SEEN_KEY, JSON.stringify(ids.slice(-300))); }catch(e){}
  }

  function renderAlarm(){
    const el = document.getElementById('lg-alarm');
    if(!el) return;
    const late = overdueJobs();
    if(!late.length){ el.innerHTML = ''; return; }

    const worst = late[0];                       // soonest promised date = longest overdue
    const worstDays = Math.abs(dueInfo(worst).days || 0);
    const preview = late.slice(0,3).map(j=>
      `${esc(j.customerName || 'WALKIN')} <span class="muted">— ${dueInfo(j).note}</span>`
    ).join(' &nbsp;·&nbsp; ');

    el.innerHTML = `<div class="lg-alarm" role="alert">
      <div>
        <div class="al-main"><span class="al-dot"></span>${late.length} job${late.length===1?'':'s'} past the promised date${
          late.length===1 ? '' : ` — longest ${worstDays} day${worstDays===1?'':'s'}`}</div>
        <div class="al-list">${preview}${late.length>3?` <span class="muted">and ${late.length-3} more</span>`:''}</div>
      </div>
      <div class="al-actions">
        <button class="lg-btn small" id="al-goto" type="button">See them</button>
        ${notifySupported() && Notification.permission === 'default'
          ? '<button class="lg-btn ghost small" id="al-notify" type="button" title="Get a desktop or phone notification when a job goes past its date">Alert me</button>'
          : ''}
      </div>
    </div>`;

    document.getElementById('al-goto').addEventListener('click', ()=>{
      state.tab = 'pending';
      renderAll();
    });
    const notifyBtn = document.getElementById('al-notify');
    if(notifyBtn) notifyBtn.addEventListener('click', async ()=>{
      try{
        const res = await Notification.requestPermission();
        toast(res === 'granted' ? 'Alerts on — you’ll be told when a job runs late' : 'Alerts not enabled');
        renderAlarm();
        if(res === 'granted') notifyNewlyLate(late);
      }catch(e){ toast('This browser would not enable alerts'); }
    });
  }

  function notifySupported(){
    return typeof Notification !== 'undefined' && location.protocol === 'https:';
  }
  // Fires once per job, per device — going late is the event, not still being late.
  function notifyNewlyLate(late){
    if(!notifySupported() || Notification.permission !== 'granted') return;
    const seen = alarmSeen();
    const fresh = late.filter(j=>!seen.has(j.id));
    if(!fresh.length) return;
    const body = fresh.length === 1
      ? `${fresh[0].customerName || 'WALKIN'} — ${dueInfo(fresh[0]).note}`
      : fresh.slice(0,3).map(j=>`${j.customerName || 'WALKIN'} (${dueInfo(j).note})`).join(', ')
        + (fresh.length>3 ? ` +${fresh.length-3} more` : '');
    try{
      new Notification(
        fresh.length === 1 ? 'A job is past its promised date' : `${fresh.length} jobs are past their promised date`,
        {body, tag:'lg-late-jobs', icon:'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="10" fill="%23AB4530"/></svg>')}
      );
    }catch(e){ /* some browsers block construction outside a service worker */ }
    alarmMarkSeen([...seen, ...fresh.map(j=>j.id)]);
  }

  // A job can cross its promised date while the app is just sitting open, so re-check
  // on a timer as well as on every render.
  function startAlarmWatch(){
    if(alarmTimer) clearInterval(alarmTimer);
    const tick = ()=>{ renderAlarm(); notifyNewlyLate(overdueJobs()); };
    alarmTimer = setInterval(tick, 5*60*1000);
    tick();
  }

  // ---------- monthly target ----------
  // The target is measured against the same net profit the Split card divides up —
  // cash collected, less cost of production, less the material actually used — so the
  // number here can never disagree with the number on the Summary tab.
  //
  // By default only the PF share counts toward it (the 65%), since that is the part
  // the target is about. Switch targetBasis to 'net' to count the whole net profit.
  function targetStats(){
    const s = state.settings;
    const target = Number(s.monthlyTarget)||0;
    const now = new Date();
    const year = now.getFullYear(), month = now.getMonth();
    const nDays = daysInMonth(year, month);
    const pad = n=>String(n).padStart(2,'0');
    const dateFor = d => `${year}-${pad(month+1)}-${pad(d)}`;
    const today = todayISO();

    const paidByDay = {}, cpByDay = {}, matUsedByDay = {}, matWasteByDay = {};
    for(let d=1; d<=nDays; d++){ const k=dateFor(d); paidByDay[k]=0; cpByDay[k]=0; matUsedByDay[k]=0; matWasteByDay[k]=0; }
    state.jobs.forEach(j=>{
      (j.payments||[]).forEach(p=>{ if(paidByDay.hasOwnProperty(p.date)) paidByDay[p.date] += (Number(p.cash)||0)+(Number(p.bank)||0); });
      if(j.dateReceived && cpByDay.hasOwnProperty(j.dateReceived)){
        const t = jobTotals(j);
        cpByDay[j.dateReceived] += Number(j.cp)||0;
        matUsedByDay[j.dateReceived] += t.materialUsedCost;
        matWasteByDay[j.dateReceived] += t.materialWasteCost;
      }
    });
    allOldDebtPayments().forEach(p=>{ if(paidByDay.hasOwnProperty(p.date)) paidByDay[p.date] += p.cash+p.bank; });

    const sharePct = (s.targetBasis === 'net') ? 100 : (Number(s.pfPct)||0);
    // A target divided by 31 when the shop shuts on Sundays sets a daily number that
    // can't be hit, so rest days are excluded from the divisor.
    const isWorkDay = iso => s.targetWorksSundays || new Date(iso+'T00:00:00').getDay() !== 0;
    const thisWeek = isoWeekLabel(today);

    let achieved=0, weekAchieved=0, todayAchieved=0;
    let workDaysTotal=0, workDaysSoFar=0, weekWorkDays=0;
    const valByDay = {};
    for(let d=1; d<=nDays; d++){
      const date = dateFor(d);
      // Same Net Profit formula as dayStats(), monthStats() and the Summary day table — all four
      // must stay in step, or the target card reports progress against a figure the Summary denies.
      const net = Math.max(paidByDay[date] - cpByDay[date] - matUsedByDay[date] - matWasteByDay[date], 0);
      const val = net * sharePct/100;
      valByDay[date] = val;
      const work = isWorkDay(date);
      if(work) workDaysTotal++;
      if(work && isoWeekLabel(date)===thisWeek) weekWorkDays++;
      if(date <= today){
        achieved += val;
        if(work) workDaysSoFar++;
        if(isoWeekLabel(date)===thisWeek) weekAchieved += val;
        if(date === today) todayAchieved = val;
      }
    }

    const dailyTarget  = workDaysTotal ? target/workDaysTotal : 0;

    // Carry-forward, both ways. `deficit` is the running gap between what the month should
    // have produced by now and what it actually has: positive means ground to make up,
    // negative means you're ahead and today needs less. Either way today's figure is what
    // the day actually has to bring in, not a flat monthly average.
    // Sundays never add a share of their own, but a debt still sits on them and earning on
    // one still pays it down.
    let deficit = 0, todayRequired = dailyTarget, todayCarriedIn = 0, missedDays = 0, beatDays = 0;
    for(let d=1; d<=nDays; d++){
      const date = dateFor(d);
      if(date > today) break;
      const share = isWorkDay(date) ? dailyTarget : 0;
      // Clamped, because a big enough surplus means today needs nothing — not that today
      // owes a negative amount. The surplus itself keeps rolling in `deficit`.
      const required = Math.max(deficit + share, 0);
      if(date === today){ todayRequired = required; todayCarriedIn = deficit; break; }
      const got = valByDay[date];
      if(isWorkDay(date)){ if(got < required) missedDays++; else if(got > required) beatDays++; }
      deficit = deficit + share - got;
    }

    const weeklyTarget = dailyTarget * weekWorkDays;
    const expected     = dailyTarget * workDaysSoFar;   // where you should stand by tonight
    const remaining    = Math.max(target - achieved, 0);
    const daysLeft     = Math.max(workDaysTotal - workDaysSoFar, 0);
    return {
      target, achieved, remaining,
      pct: target ? Math.min(achieved/target, 1) : 0,
      dailyTarget, weeklyTarget, weekAchieved, todayAchieved,
      todayRequired, todayCarriedIn, missedDays, beatDays,
      // A required figure of 0 means the surplus already covers today — that's met, not 0%.
      todayPct: todayRequired>0 ? Math.min(todayAchieved/todayRequired, 1) : 1,
      todayRatio: todayRequired>0 ? todayAchieved/todayRequired : 1,
      isWorkDayToday: isWorkDay(today),
      expected, pace: achieved - expected,
      workDaysTotal, workDaysSoFar, daysLeft,
      // What each remaining day has to bring in to still finish on target. Recomputed
      // daily, so getting ahead lowers it and falling behind raises it.
      neededPerDay: daysLeft>0 ? remaining/daysLeft : remaining,
      basisLabel: s.targetBasis==='net' ? 'net profit' : `PF (${Number(s.pfPct)||0}%)`,
      monthLabel: now.toLocaleDateString('en-NG',{month:'long', year:'numeric'})
    };
  }

  // How close a figure is to its target, as one of the semantic colours. Red through amber to
  // green — the bands are discrete rather than a continuous hue ramp because clay/amber/green
  // already carry meaning everywhere else in the app, and inventing in-between hues would blur it.
  function targetBand(ratio){
    if(ratio >= 1)    return 'met';
    if(ratio >= 0.75) return 'close';
    if(ratio >= 0.40) return 'mid';
    return 'far';
  }
  function emptyTargetCard(title){
    return `<div class="lg-card lg-target">
      <div class="lg-card-title">${title}</div>
      <div style="font-size:12.5px;color:var(--muted);">
        No target set. Add one on the <b>Summary</b> tab and this shows what you need
        each week and each day to reach it.
      </div>
    </div>`;
  }

  // The whole month at a glance — lives on the Dashboard.
  function renderMonthTargetCard(){
    const t = targetStats();
    if(!t.target) return emptyTargetCard('Monthly Target');
    const ahead = t.pace >= 0;
    const band = targetBand(t.pct);
    return `<div class="lg-card lg-target tg-${band}">
      <div class="lg-card-title">Monthly Target — ${t.monthLabel} <span class="muted" style="text-transform:none;letter-spacing:0;">· counting ${t.basisLabel}</span></div>
      <div class="tg-head">
        <div class="tg-big">${naira(t.achieved)} <span class="tg-of">of ${naira(t.target)}</span></div>
        <div class="tg-pct">${Math.round(t.pct*100)}%</div>
      </div>
      <div class="tg-bar"><span style="width:${(t.pct*100).toFixed(1)}%"></span></div>
      <div class="tg-pace ${ahead?'ok':'behind'}">
        ${ahead
          ? `Ahead by ${naira(t.pace)} — you should be at ${naira(t.expected)} by tonight`
          : `Behind by ${naira(Math.abs(t.pace))} — you should be at ${naira(t.expected)} by tonight`}
      </div>
      <div class="lg-grid cols-3" style="margin-top:12px;">
        <div class="lg-kpi teal"><div class="num">${naira(t.weekAchieved)}</div><div class="lbl">This week of ${naira(t.weeklyTarget)}</div></div>
        <div class="lg-kpi paid"><div class="num">${naira(t.achieved)}</div><div class="lbl">Month so far · ${t.workDaysSoFar} of ${t.workDaysTotal} working days</div></div>
        <div class="lg-kpi" style="border-left-color:var(--ok-blue);"><div class="num">${naira(t.neededPerDay)}</div><div class="lbl">Needed / day · ${t.daysLeft} day${t.daysLeft===1?'':'s'} left</div></div>
      </div>
    </div>`;
  }

  // Just today — lives on Daily View. Carries forward whatever earlier days fell short by,
  // so this is the one number that says what the day actually has to bring in.
  function renderDayTargetCard(){
    const t = targetStats();
    if(!t.target) return emptyTargetCard("Today's Target");
    const band = targetBand(t.todayRatio);
    const over = t.todayAchieved - t.todayRequired;
    const short = t.todayRequired - t.todayAchieved;
    return `<div class="lg-card lg-target tg-${band}">
      <div class="lg-card-title">Today's Target — ${fmtDate(todayISO())} <span class="muted" style="text-transform:none;letter-spacing:0;">· counting ${t.basisLabel}</span></div>
      <div class="tg-head">
        <div class="tg-big">${naira(t.todayAchieved)} <span class="tg-of">of ${naira(t.todayRequired)}</span></div>
        <div class="tg-pct">${Math.round(t.todayRatio*100)}%</div>
      </div>
      <div class="tg-bar"><span style="width:${(t.todayPct*100).toFixed(1)}%"></span></div>
      <div class="tg-pace ${band==='met'?'ok':'behind'}">
        ${band==='met'
          ? `Target met${over>0?` — ${naira(over)} over, which carries to tomorrow`:''}.`
          : `${naira(short)} to go today — whatever's left carries to tomorrow`}
      </div>
      ${t.todayCarriedIn>0 ? `<div class="tg-carry">
        Includes <b>${naira(t.todayCarriedIn)}</b> carried over from ${t.missedDays} earlier day${t.missedDays===1?'':'s'} that fell short — the plain daily share is ${naira(t.dailyTarget)}.
      </div>` : ''}
      ${t.todayCarriedIn<0 ? `<div class="tg-carry">
        You're <b>${naira(Math.abs(t.todayCarriedIn))}</b> ahead from ${t.beatDays} earlier day${t.beatDays===1?'':'s'} that beat the target, so today's share drops from ${naira(t.dailyTarget)} to <b>${naira(t.todayRequired)}</b>.
      </div>` : ''}
      ${!t.isWorkDayToday ? `<div class="tg-carry">Today is a rest day, so no new share was added${t.todayCarriedIn>0?' — this is carried-over ground only':''}.</div>` : ''}
    </div>`;
  }

  // ---------- render shell ----------
  function renderTabs(){
    tabsEl.innerHTML = TABS.map(t=>`<button class="lg-tab ${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
    tabsEl.querySelectorAll('.lg-tab').forEach(b=>{
      b.addEventListener('click', ()=>{ state.tab = b.dataset.tab; renderAll(); });
    });
  }

  // renderAll() runs on far more than tab changes — recording a payment, changing a
  // status, a debounced search keystroke all land here and replace #lg-content
  // wholesale. Replaying an entrance on each of those would make routine data entry
  // feel like it stutters, so the animation is gated on the tab genuinely changing.
  let lastRenderedTab = null;
  let lastDayTargetMet = null;   // null until the first Daily View paint, so it never animates on load
  function renderAll(){
    renderTabs();
    if(!state.loaded){ content.innerHTML = '<div class="lg-empty">Loading ledger…</div>'; return; }
    renderAlarm();
    const tabChanged = state.tab !== lastRenderedTab;
    lastRenderedTab = state.tab;
    if(tabChanged) queueMicrotask(()=>{
      content.classList.remove('lg-enter');
      void content.offsetWidth;          // reflow, so the animation restarts rather than being ignored
      content.classList.add('lg-enter');
    });
    if(state.tab==='dashboard') renderDashboard();
    else if(state.tab==='dayview') renderDayView();
    else if(state.tab==='summary') renderSummary();
    else if(state.tab==='newjob') renderNewJob();
    else if(state.tab==='jobs') renderJobs();
    else if(state.tab==='pending') renderPending();
    else if(state.tab==='prices') renderPrices();
    else if(state.tab==='matprices') renderMaterialPrices();
    else if(state.tab==='customers') renderCustomers();
    else if(state.tab==='inventory') renderInventory();
    else if(state.tab==='expenses') renderExpenses();
    else if(state.tab==='cpaccount') renderCPAccount();
    else if(state.tab==='quotes') renderQuotes();
    else if(state.tab==='staff') renderStaff();
  }

  // ---------- DASHBOARD ----------
  function renderDashboard(){
    const m = monthStats();
    const late = overdueJobs();
    const incomeSeries = (()=>{
      const now = new Date(), ym = now.toISOString().slice(0,7);
      const n = daysInMonth(now.getFullYear(), now.getMonth());
      const pad = x=>String(x).padStart(2,'0');
      // One pass over the payments to bucket them by date, instead of re-scanning every
      // job (and rebuilding allOldDebtPayments()) once per day of the month.
      const byDate = Object.create(null);
      state.jobs.forEach(j=>(j.payments||[]).forEach(p=>{
        if(!p || !p.date) return;
        byDate[p.date] = (byDate[p.date]||0) + (Number(p.cash)||0) + (Number(p.bank)||0);
      }));
      allOldDebtPayments().forEach(p=>{
        if(!p || !p.date) return;
        byDate[p.date] = (byDate[p.date]||0) + p.cash + p.bank;
      });
      const out = [];
      for(let d=1; d<=n; d++){
        const date = `${ym}-${pad(d)}`;
        out.push({label: fmtDate(date), value: byDate[date]||0, tick: (d===1||d%5===0)?String(d):''});
      }
      return out;
    })();
    const usage = computeMaterialUsage();
    const reorder = state.materials.filter(mt => {
      const u = usage[normName(mt.name)]||{qty:0,waste:0};
      const remaining = Number(mt.opening||0)+Number(mt.restocked||0)-u.qty-u.waste;
      return Number(mt.reorderLevel||0)>0 && remaining <= Number(mt.reorderLevel||0);
    });
    content.innerHTML = `
      ${renderMonthTargetCard()}
      <div class="lg-grid cols-4">
        <div class="lg-card lg-kpi"><div class="num">${naira(m.todayBilled)}</div><div class="lbl">Billed Today</div></div>
        <div class="lg-card lg-kpi paid"><div class="num">${naira(m.todayJobIncome)}</div><div class="lbl">Income for Today</div></div>
        <div class="lg-card lg-kpi ${m.oldDebtPaidToday>0?'teal':''}"><div class="num">${naira(m.oldDebtPaidToday)}</div><div class="lbl">Total Old Debt</div></div>
        <div class="lg-card lg-kpi" style="border-left-color:var(--ink);"><div class="num">${naira(m.todayPaid)}</div><div class="lbl">Grand Total</div></div>
      </div>
      <div class="lg-grid cols-4">
        <div class="lg-card lg-kpi teal"><div class="num">${naira(m.billed)}</div><div class="lbl">Billed This Month</div></div>
        <div class="lg-card lg-kpi debt"><div class="num">${naira(m.outstanding)}</div><div class="lbl">Debt Outstanding${m.outstandingOld>0?` <span style="font-weight:400;">(${naira(m.outstandingOld)} is old debt)</span>`:''}</div></div>
        <div class="lg-card"><div class="lg-card-title">Collection Rate</div><div style="font-size:20px;font-weight:600">${(m.collectionRate*100).toFixed(1)}%</div></div>
        <div class="lg-card"><div class="lg-card-title">Net Profit (Month)</div><div style="font-size:20px;font-weight:600">${naira(m.profit)}</div></div>
      </div>
      <div class="lg-grid cols-4">
        <div class="lg-card"><div class="lg-card-title">Jobs This Month</div><div style="font-size:20px;font-weight:600">${m.jobCount}</div></div>
        <div class="lg-card"><div class="lg-card-title">Old Debt Paid This Month</div><div style="font-size:20px;font-weight:600;${m.oldDebtPaidMonth>0?'color:var(--teal);':''}">${naira(m.oldDebtPaidMonth)}</div></div>
        <div class="lg-card"><div class="lg-card-title">Cost of Production (Month)</div><div style="font-size:20px;font-weight:600">${naira(m.cp)}</div></div>
        <div class="lg-card"><div class="lg-card-title">Material Cost — Bought (Month)</div><div style="font-size:20px;font-weight:600">${naira(m.matCost)}</div><div style="font-size:10.5px;margin-top:2px;"><a href="#" class="goto-purchase-log" style="color:var(--teal);">view Purchase Log \u2192</a></div></div>
      </div>
      <div class="lg-grid cols-3">
        <div class="lg-card"><div class="lg-card-title">Material Cost — Used (Month)</div><div style="font-size:20px;font-weight:600">${naira(m.matCostUsed)}</div><div style="font-size:10.5px;margin-top:2px;color:var(--muted);">this is what comes out of Net Profit</div></div>
        <div class="lg-card"><div class="lg-card-title">Material Cost — Wasted (Month)</div><div style="font-size:20px;font-weight:600;${m.matWasteCost>0?'color:var(--clay);':''}">${naira(m.matWasteCost)}</div><div style="font-size:10.5px;margin-top:2px;color:var(--muted);">spoiled/wasted material, also comes out of Net Profit</div></div>
        <div class="lg-card"><div class="lg-card-title">Expenses (Month)</div><div style="font-size:20px;font-weight:600">${naira(m.monthExpenseTotal)}</div></div>
        <div class="lg-card"><div class="lg-card-title">Net Cash (Month, after expenses &amp; stock buys)</div><div style="font-size:20px;font-weight:600">${naira(m.netCash)}</div><div style="font-size:10px;color:var(--muted);margin-top:2px;">${naira(m.paid)} in − ${naira(m.monthExpenseTotal)} expenses − ${naira(m.matCost)} stock bought</div></div>
      </div>
      <div class="lg-card">
        <div class="lg-card-title">Jobs by Stage</div>
        <div class="lg-grid cols-4">
          ${STATUSES.map(s=>`<div><span class="stamp ${STATUS_CLASS[s]}">${s}</span><div style="margin-top:6px;font-size:18px;font-weight:600">${m.byStatus[s]||0}</div></div>`).join('')}
        </div>
      </div>
      ${reorder.length ? `
      <div class="lg-card">
        <div class="lg-card-title" style="color:var(--clay)">Reorder Alerts</div>
        ${reorder.map(mt=>{
          const u = usage[normName(mt.name)]||{qty:0,waste:0};
          const remaining = Number(mt.opening||0)+Number(mt.restocked||0)-u.qty-u.waste;
          return `<div class="flag">⚠ ${mt.name} — remaining ${remaining} ${mt.unit||''} (reorder level ${mt.reorderLevel})</div>`;
        }).join('')}
      </div>` : ''}
      ${late.length ? `
      <div class="lg-card" style="border-left:3px solid var(--clay);">
        <div class="lg-card-title" style="color:var(--clay)">Past Promised Date (${late.length})</div>
        <table><thead><tr><th>Customer</th><th>Description</th><th>Due</th><th>Status</th></tr></thead><tbody>
        ${late.slice(0,8).map(j=>{const d=dueInfo(j);return `<tr>
          <td>${esc(j.customerName)}</td>
          <td class="muted">${esc(j.description || (j.items[0]?j.items[0].service:'—'))}</td>
          <td class="flag">${d.label} <span style="font-size:10px;">(${d.note})</span></td>
          <td><span class="stamp ${STATUS_CLASS[j.status]}">${j.status}</span></td>
        </tr>`;}).join('')}
        </tbody></table>
        ${late.length>8?`<div style="font-size:11px;color:var(--muted);margin-top:6px;">…and ${late.length-8} more on the Pending Jobs tab.</div>`:''}
      </div>` : ''}
      <div class="lg-card">
        <div class="lg-card-title">Money In, Day by Day \u2014 This Month</div>
        ${barChartSVG(incomeSeries, {title:'Daily income this month', colour:'var(--green)', left:'1st', right:'end of month'})}
      </div>
      <div class="lg-card">
        <div class="lg-card-title">Recent Jobs</div>
        ${renderJobsTable(state.jobs.slice().sort((a,b)=>(b.dateReceived||'').localeCompare(a.dateReceived||'')).slice(0,8), false)}
      </div>
    `;
  }

  // ---------- DAILY VIEW (full income & jobs for one day) ----------
  let dayViewDate = todayISO();
  function shiftDate(iso, delta){
    const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+delta); return isoOf(d);
  }
  function dayStats(dateStr){
    recomputeAllCustomers();
    const jobsToday = state.jobs.filter(j=>j.dateReceived===dateStr);
    let billed=0, newDebt=0, cp=0, matCostUsed=0, matWasteCost=0;
    jobsToday.forEach(j=>{
      const t=jobTotals(j);
      billed+=t.totalBilled; newDebt+=t.debt; cp+=t.cp; matCostUsed+=t.materialUsedCost; matWasteCost+=t.materialWasteCost;
    });
    const matCost = materialPurchaseCostOnDate(dateStr);
    let paid = 0;
    let jobIncome = 0;
    let oldDebtPaid = 0;
    const paymentsToday = [];
    state.jobs.forEach(j=>{
      (j.payments||[]).forEach(p=>{
        if(p.date===dateStr){
          const amt = (Number(p.cash)||0)+(Number(p.bank)||0);
          paid += amt;
          jobIncome += amt;
          paymentsToday.push({job:j, payment:p, amount:amt, isOldDebt:false});
        }
      });
    });
    allOldDebtPayments().forEach(p=>{
      if(p.date===dateStr){
        const amt = p.cash+p.bank;
        paid += amt;
        oldDebtPaid += amt;
        paymentsToday.push({job:{customerName:p.customerName, description:'Old Debt Payment', dateReceived:dateStr, items:[]}, payment:p, amount:amt, isOldDebt:true});
      }
    });
    const expensesToday = state.expenses.filter(e=>e.date===dateStr);
    const expenseTotal = expensesToday.reduce((s,e)=>s+(Number(e.amount)||0),0);
    const netProfit = Math.max(paid-cp-matCostUsed-matWasteCost, 0);
    const s = state.settings;
    const tithe = netProfit*s.tithePct/100, pf = netProfit*s.pfPct/100, ex = netProfit*s.exPct/100;
    const netCash = paid - expenseTotal - matCost;
    return {jobsToday, billed, newDebt, cp, matCost, matCostUsed, matWasteCost, paid, jobIncome, oldDebtPaid, paymentsToday, expensesToday, expenseTotal, netProfit, tithe, pf, ex, netCash};
  }

    // One beat of acknowledgement the first time today's target goes green — not on every

  // ---------- SUMMARY (monthly, day-by-day — mirrors the day-sheet totals) ----------
  function daysInMonth(year, month){ return new Date(year, month+1, 0).getDate(); }
  function renderSummary(){
    recomputeAllCustomers();
    const now = new Date();
    const year = now.getFullYear(), month = now.getMonth();
    const nDays = daysInMonth(year, month);
    const s = state.settings;
    const pad = n=>String(n).padStart(2,'0');
    const dateFor = d => `${year}-${pad(month+1)}-${pad(d)}`;

    // Billed & new-debt keyed by job creation date
    const byDay = {};
    for(let d=1; d<=nDays; d++) byDay[dateFor(d)] = {billed:0, newDebt:0};
    state.jobs.forEach(j=>{
      if(!j.dateReceived || !byDay.hasOwnProperty(j.dateReceived)) return;
      const t = jobTotals(j);
      byDay[j.dateReceived].billed += t.totalBilled;
      byDay[j.dateReceived].newDebt += t.debt;
    });

    // Paid, keyed by the ACTUAL date each payment was recorded (not just job intake day —
    // this is what makes debt collected later show up on the day it was really paid)
    const paidByDay = {};
    for(let d=1; d<=nDays; d++) paidByDay[dateFor(d)] = 0;
    state.jobs.forEach(j=>{
      (j.payments||[]).forEach(p=>{
        if(paidByDay.hasOwnProperty(p.date)) paidByDay[p.date] += (Number(p.cash)||0)+(Number(p.bank)||0);
      });
    });
    allOldDebtPayments().forEach(p=>{
      if(paidByDay.hasOwnProperty(p.date)) paidByDay[p.date] += p.cash+p.bank;
    });

    // Cost of production keyed by job intake date; material cost (bought) keyed by purchase date;
    // material cost (used) and (wasted) also keyed by job intake date — both come out of Net Profit
    const cpByDay = {}, matCostByDay = {}, matCostUsedByDay = {}, matWasteByDay = {};
    for(let d=1; d<=nDays; d++){ cpByDay[dateFor(d)] = 0; matCostByDay[dateFor(d)] = 0; matCostUsedByDay[dateFor(d)] = 0; matWasteByDay[dateFor(d)] = 0; }
    state.jobs.forEach(j=>{
      if(!j.dateReceived || !cpByDay.hasOwnProperty(j.dateReceived)) return;
      cpByDay[j.dateReceived] += Number(j.cp)||0;
      matCostUsedByDay[j.dateReceived] += jobTotals(j).materialUsedCost;
      matWasteByDay[j.dateReceived] += jobTotals(j).materialWasteCost;
    });
    allStockPurchases().forEach(p=>{
      if(matCostByDay.hasOwnProperty(p.date)) matCostByDay[p.date] += p.qty*p.unitCost;
    });

    // Expenses keyed by date
    const expByDay = {};
    for(let d=1; d<=nDays; d++) expByDay[dateFor(d)] = 0;
    state.expenses.forEach(e=>{
      if(expByDay.hasOwnProperty(e.date)) expByDay[e.date] += Number(e.amount)||0;
    });

    let cumDebt = 0, mBilled=0, mPaid=0, mNewDebt=0, mGrand=0, mTithe=0, mPf=0, mEx=0, activeDays=0, mCp=0, mMatCost=0, mMatCostUsed=0, mMatWaste=0;
    const rows = [];
    for(let d=1; d<=nDays; d++){
      const date = dateFor(d);
      const billed = byDay[date].billed;
      const newDebt = byDay[date].newDebt;
      const paid = paidByDay[date];
      const cp = cpByDay[date];
      const matCost = matCostByDay[date];
      const matCostUsed = matCostUsedByDay[date];
      const matWaste = matWasteByDay[date];
      cumDebt += newDebt;
      // net profit: cash collected minus cost of production minus the material actually USED and WASTED
      // that day. Matches dayStats() and monthStats() — all three must stay in step, since Tithe/PF/EX
      // are split off this figure.
      const grand = Math.max(paid - cp - matCostUsed - matWaste, 0);
      const tithe = grand * s.tithePct/100;
      const pf = grand * s.pfPct/100;
      const ex = grand * s.exPct/100;
      if(billed>0 || paid>0) activeDays++;
      mBilled+=billed; mPaid+=paid; mNewDebt+=newDebt; mGrand+=grand; mTithe+=tithe; mPf+=pf; mEx+=ex; mCp+=cp; mMatCost+=matCost; mMatCostUsed+=matCostUsed; mMatWaste+=matWaste;
      rows.push({d, date, billed, paid, newDebt, grand, tithe, pf, ex, cumDebt, matCostUsed, matWaste, week: isoWeekLabel(date)});
    }
    const collectionRate = mBilled ? mPaid/mBilled : 0;
    const debtPct = mBilled ? mNewDebt/mBilled : 0;
    const monthLabel = now.toLocaleDateString('en-NG',{month:'long', year:'numeric'});

    function buildDailyWeeklyTable(){
      let html=''; let wk=null; let wkHasData=false;
      let acc={billed:0,paid:0,newDebt:0,grand:0,tithe:0,pf:0,ex:0,matCostUsed:0,matWaste:0};
      function flush(){
        if(wk===null || !wkHasData) return '';
        return `<tr style="font-weight:700;background:rgba(185,121,28,0.08);">
          <td>${wk} TOTAL</td>
          <td class="num-col">${naira(acc.billed)}</td><td class="num-col">${naira(acc.paid)}</td>
          <td class="num-col">${naira(acc.newDebt)}</td><td class="num-col">${naira(acc.matCostUsed)}</td>
          <td class="num-col">${naira(acc.matWaste)}</td><td class="num-col">${naira(acc.grand)}</td>
          <td class="num-col">${naira(acc.tithe)}</td><td class="num-col">${naira(acc.pf)}</td>
          <td class="num-col">${naira(acc.ex)}</td><td></td>
        </tr>`;
      }
      rows.forEach(r=>{
        if(wk!==null && r.week!==wk){ html += flush(); acc={billed:0,paid:0,newDebt:0,grand:0,tithe:0,pf:0,ex:0,matCostUsed:0,matWaste:0}; wkHasData=false; }
        wk = r.week;
        if(r.billed>0 || r.paid>0){
          wkHasData = true;
          html += `<tr>
            <td>${r.d}</td><td class="num-col">${naira(r.billed)}</td><td class="num-col">${naira(r.paid)}</td>
            <td class="num-col ${r.newDebt>0?'flag':''}">${naira(r.newDebt)}</td>
            <td class="num-col muted">${naira(r.matCostUsed)}</td>
            <td class="num-col ${r.matWaste>0?'flag':'muted'}">${naira(r.matWaste)}</td>
            <td class="num-col">${naira(r.grand)}</td>
            <td class="num-col">${naira(r.tithe)}</td><td class="num-col">${naira(r.pf)}</td><td class="num-col">${naira(r.ex)}</td>
            <td class="num-col">${naira(r.cumDebt)}</td>
          </tr>`;
        }
        acc.billed+=r.billed; acc.paid+=r.paid; acc.newDebt+=r.newDebt; acc.grand+=r.grand; acc.tithe+=r.tithe; acc.pf+=r.pf; acc.ex+=r.ex; acc.matCostUsed+=r.matCostUsed; acc.matWaste+=r.matWaste;
      });
      html += flush();
      return html || `<tr><td colspan="11" class="lg-empty">No jobs logged yet this month</td></tr>`;
    }

    function buildIncomeExpenseTable(){
      let html=''; let running=0; let wk=null; let wkHasData=false;
      let acc={income:0,expense:0,net:0};
      function flush(){
        if(wk===null || !wkHasData) return '';
        return `<tr style="font-weight:700;background:rgba(46,101,95,0.08);">
          <td>${wk} TOTAL</td>
          <td class="num-col">${naira(acc.income)}</td><td class="num-col">${naira(acc.expense)}</td>
          <td class="num-col ${acc.net<0?'flag':''}">${naira(acc.net)}</td><td></td>
        </tr>`;
      }
      rows.forEach(r=>{
        const income = r.paid, expense = expByDay[r.date], net = income-expense;
        running += net;
        if(wk!==null && r.week!==wk){ html += flush(); acc={income:0,expense:0,net:0}; wkHasData=false; }
        wk = r.week;
        if(income>0 || expense>0){
          wkHasData = true;
          html += `<tr>
            <td>${r.d}</td><td class="num-col">${naira(income)}</td>
            <td class="num-col">${expense>0?naira(expense):'—'}</td>
            <td class="num-col ${net<0?'flag':''}">${naira(net)}</td>
            <td class="num-col">${naira(running)}</td>
          </tr>`;
        }
        acc.income+=income; acc.expense+=expense; acc.net+=net;
      });
      html += flush();
      const totalExpense = Object.values(expByDay).reduce((s,v)=>s+v,0);
      return {rowsHtml: html || `<tr><td colspan="5" class="lg-empty">No income or expenses logged yet this month</td></tr>`,
        totalIncome: mPaid, totalExpense, netTotal: mPaid-totalExpense};
    }
    const ie = buildIncomeExpenseTable();

    // Best sellers and top customers, scoped to jobs received this month.
    const ymNow = `${year}-${pad(month+1)}`;
    const monthJobsList = state.jobs.filter(j=>(j.dateReceived||'').slice(0,7)===ymNow);
    const svcMap = new Map();
    monthJobsList.forEach(j=>(j.items||[]).forEach(it=>{
      const key = normName(it.service) || 'ITEM';
      const value = (Number(it.qty)||0)*(Number(it.unitPrice)||0) + (Number(it.descQty)||0)*(Number(it.descUnitPrice)||0);
      const count = (Number(it.qty)||0) + (Number(it.descQty)||0);
      if(!svcMap.has(key)) svcMap.set(key, {name:key, count:0, value:0});
      const e = svcMap.get(key); e.count += count; e.value += value;
    }));
    const topServices = Array.from(svcMap.values()).filter(x=>x.value>0).sort((a,b)=>b.value-a.value).slice(0,6);
    const custMap = new Map();
    monthJobsList.forEach(j=>{
      const key = normName(j.customerName || 'WALKIN');
      const t = jobTotals(j);
      if(!custMap.has(key)) custMap.set(key, {name:key, jobs:0, billed:0, debt:0});
      const e = custMap.get(key); e.jobs += 1; e.billed += t.totalBilled; e.debt += t.debt;
    });
    const topCustomers = Array.from(custMap.values()).filter(x=>x.billed>0).sort((a,b)=>b.billed-a.billed).slice(0,6);

    // ---- Cash vs bank transfer for the month ----
    // Money in comes from the cash/bank amounts already recorded on every payment.
    // Money out comes from the method recorded on each CP spend and expense.
    const inMonth = iso => (iso||'').slice(0,7) === ymNow;
    const monthPayments = [];
    state.jobs.forEach(j=>(j.payments||[]).forEach(p=>{ if(inMonth(p.date)) monthPayments.push(p); }));
    allOldDebtPayments().forEach(p=>{ if(inMonth(p.date)) monthPayments.push(p); });
    const inSplit = splitPayments(monthPayments);
    const cpSplit = splitByMethod(state.cpspend.filter(e=>inMonth(e.date)));
    const exSplit = splitByMethod(state.expenses.filter(e=>inMonth(e.date)));
    const netCashMethod     = inSplit.cash - cpSplit.cash - exSplit.cash;
    const netTransferMethod = inSplit.transfer - cpSplit.transfer - exSplit.transfer;
    const outUnknown = cpSplit.unknown + exSplit.unknown;
    const money = v => `<td class="num-col">${naira(v)}</td>`;
    const gap = v => v>0
      ? `<td class="num-col flag">${naira(v)}</td>`
      : `<td class="num-col muted">—</td>`;

    // Same cash/transfer figures, but keyed by day so the month can be read as a
    // running record rather than a single lump.
    const methodByDay = {};
    for(let d=1; d<=nDays; d++) methodByDay[dateFor(d)] = {inCash:0, inTransfer:0, outCash:0, outTransfer:0, outUnknown:0};
    state.jobs.forEach(j=>(j.payments||[]).forEach(p=>{
      const m = methodByDay[p.date]; if(!m) return;
      m.inCash += Number(p.cash)||0; m.inTransfer += Number(p.bank)||0;
    }));
    allOldDebtPayments().forEach(p=>{
      const m = methodByDay[p.date]; if(!m) return;
      m.inCash += p.cash; m.inTransfer += p.bank;
    });
    state.cpspend.concat(state.expenses).forEach(e=>{
      const m = methodByDay[e.date]; if(!m) return;
      const a = Number(e.amount)||0;
      if(e.method==='cash') m.outCash += a;
      else if(e.method==='transfer') m.outTransfer += a;
      else m.outUnknown += a;
    });
    const showUnknownCol = outUnknown > 0;
    const methodCols = showUnknownCol ? 8 : 7;

    function buildMethodDayTable(){
      let html=''; let wk=null; let wkHasData=false;
      let acc={inCash:0,inTransfer:0,outCash:0,outTransfer:0,outUnknown:0};
      const cells = (m, bold) => {
        const netCash = m.inCash - m.outCash, netTr = m.inTransfer - m.outTransfer;
        return `<td class="num-col">${m.inCash?naira(m.inCash):'—'}</td>
          <td class="num-col">${m.outCash?naira(m.outCash):'—'}</td>
          <td class="num-col" style="${bold?'':'font-weight:600;'}color:${netCash<0?'var(--clay)':'var(--green)'};">${naira(netCash)}</td>
          <td class="num-col">${m.inTransfer?naira(m.inTransfer):'—'}</td>
          <td class="num-col">${m.outTransfer?naira(m.outTransfer):'—'}</td>
          <td class="num-col" style="${bold?'':'font-weight:600;'}color:${netTr<0?'var(--clay)':'var(--teal)'};">${naira(netTr)}</td>
          ${showUnknownCol ? `<td class="num-col ${m.outUnknown?'flag':'muted'}">${m.outUnknown?naira(m.outUnknown):'—'}</td>` : ''}`;
      };
      function flush(){
        if(wk===null || !wkHasData) return '';
        return `<tr style="font-weight:700;background:rgba(46,101,95,0.08);">
          <td>${wk} TOTAL</td>${cells(acc, true)}
        </tr>`;
      }
      rows.forEach(r=>{
        const m = methodByDay[r.date];
        const active = m.inCash || m.inTransfer || m.outCash || m.outTransfer || m.outUnknown;
        if(wk!==null && r.week!==wk){ html += flush(); acc={inCash:0,inTransfer:0,outCash:0,outTransfer:0,outUnknown:0}; wkHasData=false; }
        wk = r.week;
        if(active){
          wkHasData = true;
          html += `<tr><td>${r.d}</td>${cells(m)}</tr>`;
        }
        acc.inCash+=m.inCash; acc.inTransfer+=m.inTransfer;
        acc.outCash+=m.outCash; acc.outTransfer+=m.outTransfer; acc.outUnknown+=m.outUnknown;
      });
      html += flush();
      return html || `<tr><td colspan="${methodCols}" class="lg-empty">Nothing moved in or out yet this month</td></tr>`;
    }
    const methodDayRows = buildMethodDayTable();

    // Everything still missing a method, across ALL dates and both kinds of spending.
    // Without this you would have to page through the CP Account and Expenses tabs one
    // day at a time hunting for entries logged before the field existed.
    const unrecorded = []
      .concat(state.cpspend.filter(e=>!e.method).map(e=>({kind:'cp', id:e.id, date:e.date, what:e.item, note:e.note, amount:Number(e.amount)||0})))
      .concat(state.expenses.filter(e=>!e.method).map(e=>({kind:'ex', id:e.id, date:e.date, what:e.category, note:e.note, amount:Number(e.amount)||0})))
      .sort((a,b)=>(b.date||'').localeCompare(a.date||''));

    // ---- Production speed: intake through to the work being finished ----
    // Scoped by when the job was FINISHED, so the month reflects work completed in it.
    // Jobs missing either end of the pair are counted but kept out of the averages —
    // an average built on half-known times would be worse than no average.
    const timed = [];
    let notTimed = 0;
    state.jobs.forEach(j=>{
      const done = (j.history||[]).filter(x=>x.status==='READY' || x.status==='DELIVERED');
      if(!done.length) return;                                   // still in progress

        <datalist id="nj-material-list">${state.materials.map(m=>`<option value="${esc(m.name)}">`).join('')}</datalist>
        <div id="nj-materials"></div>
        <button class="lg-btn ghost small" id="nj-add-material" type="button">+ Add material</button>
        <div class="readout" style="font-size:11px;color:var(--muted);margin-top:6px;">Total material used + wasted: <span id="nj-material-grandtotal">₦0</span> — both are deducted from stock, and both come out of today's (and this month's) profit. This job's own profit isn't reduced by it directly.</div>
      </details>

      <div class="lg-card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <div style="font-size:13px;line-height:1.6;">
            <span id="nj-subtotal-wrap" style="display:none;">Subtotal: <strong id="nj-subtotal">₦0</strong> &nbsp;|&nbsp; Discount: <strong id="nj-discount-amt" class="flag">−₦0</strong> &nbsp;|&nbsp; </span>
            Total: <strong id="nj-total">₦0</strong> &nbsp;|&nbsp; Balance: <strong id="nj-balance" class="flag">₦0</strong>
          </div>
          <div class="lg-row-actions">
            <button class="lg-btn ghost" id="nj-quote" type="button" title="Save as a quotation — no job, no debt, nothing counted until the customer agrees">Save as Quote</button>
            <button class="lg-btn" id="nj-save" type="button">Save Job</button>
          </div>
        </div>
      </div>
    `;

    function renderItemRows(){
      const wrap = document.getElementById('nj-items');
      // An item that already carries custom pricing shows it expanded — otherwise the
      // figures would be invisible and easy to forget about.
      draftItems.forEach(it=>{
        if(it._descOpen === undefined) it._descOpen = !!((it.desc||'').trim() || Number(it.descQty)>0 || Number(it.descUnitPrice)>0);
      });
      wrap.innerHTML = draftItems.map((it,idx)=>`
        <div class="item-row" data-idx="${idx}">
          <div><label style="margin-top:0">Item</label><input class="it-name" list="nj-item-list" value="${esc(it.service)}" placeholder="type, or pick from your price list"></div>
          <div><label style="margin-top:0">Qty</label><input class="it-qty" type="number" min="0" value="${it.qty}"></div>
          <div><label style="margin-top:0">Unit</label><input class="it-unit" value="${esc(it.unit||'')}" placeholder="pc, sheet, hr..."></div>
          <div><label style="margin-top:0">Unit Price</label><input class="it-price" type="number" min="0" value="${it.unitPrice}"></div>
          <div><label style="margin-top:0">Amount</label><div class="it-amt readout">${naira((Number(it.qty)||0)*(Number(it.unitPrice)||0))}</div></div>
          <div><button class="lg-btn danger small it-remove" type="button" title="Remove">\u2715</button></div>
          <div style="grid-column:1/-1;">
            <button type="button" class="subtle-link it-desc-toggle">${it._descOpen ? '− hide custom pricing' : '+ custom pricing'}</button>
            <div class="it-desc-wrap"${it._descOpen ? '' : ' hidden'} style="margin-top:6px;padding-top:8px;border-top:1px dashed var(--rule);">
            <label style="margin-top:0;font-size:10.5px;">Custom Job Description <span style="text-transform:none;font-weight:400;color:var(--muted);">— for jobs where the price isn't a fixed catalog rate. Note what it covers and give it its own qty/unit/price; that amount is added to this line's total.</span></label>
            <div class="item-desc-row">
              <div><input class="it-desc" value="${esc(it.desc||'')}" placeholder="e.g. custom size 3x6ft banner, matte lamination, rush job"></div>
              <div><input class="it-desc-qty" type="number" min="0" value="${it.descQty||0}" placeholder="Qty"></div>
              <div><input class="it-desc-unit" value="${esc(it.descUnit||'')}" placeholder="Unit"></div>
              <div><input class="it-desc-price" type="number" min="0" value="${it.descUnitPrice||0}" placeholder="Unit Price"></div>
              <div><div class="it-desc-amt readout">${naira((Number(it.descQty)||0)*(Number(it.descUnitPrice)||0))}</div></div>
            </div>
            </div>
          </div>
        </div>
      `).join('');
      wrap.querySelectorAll('.item-row').forEach(row=>{
        const idx = Number(row.dataset.idx);
        const name = row.querySelector('.it-name');
        const qty = row.querySelector('.it-qty');
        const unit = row.querySelector('.it-unit');
        const price = row.querySelector('.it-price');
        const desc = row.querySelector('.it-desc');
        const descQty = row.querySelector('.it-desc-qty');
        const descUnit = row.querySelector('.it-desc-unit');
        const descPrice = row.querySelector('.it-desc-price');
        // One box instead of a name field plus a separate "quick pick" dropdown: typing
        // filters the price list via <datalist>, and choosing an entry fills in the
        // price and unit for you. Typing a name that isn't on the list still works.
        name.addEventListener('input', ()=>{
          draftItems[idx].service = name.value;
          const p = state.pricelist.find(pp=>normName(pp.name)===normName(name.value));
          if(p){
            draftItems[idx].category = p.category;
            draftItems[idx].unitPrice = p.price;
            price.value = p.price;
            if(!draftItems[idx].unit && p.unit){ draftItems[idx].unit = p.unit; unit.value = p.unit; }
            recalcTotals(); updateAmt(row, idx);
          }
        });
        row.querySelector('.it-desc-toggle').addEventListener('click', ()=>{
          draftItems[idx]._descOpen = !draftItems[idx]._descOpen;
          renderItemRows();
        });
        unit.addEventListener('input', ()=>{ draftItems[idx].unit = unit.value; });
        desc.addEventListener('input', ()=>{ draftItems[idx].desc = desc.value; });
        descQty.addEventListener('input', ()=>{ draftItems[idx].descQty = descQty.value; recalcTotals(); updateAmt(row, idx); });
        descUnit.addEventListener('input', ()=>{ draftItems[idx].descUnit = descUnit.value; });
        descPrice.addEventListener('input', ()=>{ draftItems[idx].descUnitPrice = descPrice.value; recalcTotals(); updateAmt(row, idx); });
        qty.addEventListener('input', ()=>{ draftItems[idx].qty = qty.value; recalcTotals(); updateAmt(row, idx); });
        price.addEventListener('input', ()=>{ draftItems[idx].unitPrice = price.value; recalcTotals(); updateAmt(row, idx); });
        row.querySelector('.it-remove').addEventListener('click', ()=>{
          if(draftItems.length>1){ draftItems.splice(idx,1); renderItemRows(); recalcTotals(); }
        });
      });
    }
    // These are read-outs, not inputs — a disabled text box reads as something you're
    // meant to fill in, so they render as plain text and are written via textContent.
    function updateAmt(row, idx){
      row.querySelector('.it-amt').textContent = naira((Number(draftItems[idx].qty)||0)*(Number(draftItems[idx].unitPrice)||0));
      row.querySelector('.it-desc-amt').textContent = naira((Number(draftItems[idx].descQty)||0)*(Number(draftItems[idx].descUnitPrice)||0));
    }
    function recalcTotals(){
      const rawTotal = draftItems.reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.unitPrice)||0)+(Number(it.descQty)||0)*(Number(it.descUnitPrice)||0),0);
      const discount = Math.min(Number(document.getElementById('nj-discount').value)||0, rawTotal);
      const total = Math.max(rawTotal - discount, 0);
      const paid = (Number(document.getElementById('nj-cash').value)||0) + (Number(document.getElementById('nj-bank').value)||0);
      const subtotalWrap = document.getElementById('nj-subtotal-wrap');
      subtotalWrap.style.display = discount>0 ? 'inline' : 'none';
      document.getElementById('nj-subtotal').textContent = naira(rawTotal);
      document.getElementById('nj-discount-amt').textContent = '−' + naira(discount);
      document.getElementById('nj-total').textContent = naira(total);
      document.getElementById('nj-balance').textContent = naira(Math.max(total-paid,0));
    }
    // Recall a saved customer instead of retyping them. Typing filters the roster via
    // <datalist>; a name that matches someone already on it fills in their phone and
    // flags anything they still owe — which is exactly what you want to know at the
    // moment you're taking new work from them.
    recomputeAllCustomers();
    (function wireCustomerRecall(){
      const custInput = document.getElementById('nj-customer');
      const phoneInput = document.getElementById('nj-phone');
      const hint = document.getElementById('nj-customer-hint');
      // Once a phone has been typed by hand, stop overwriting it — recalling a saved
      // number must never clobber one the user has just entered.
      let phoneTouched = false;
      phoneInput.addEventListener('input', ()=>{ phoneTouched = true; });
      function applyCustomer(){
        const match = state.customers.find(c=>normName(c.name)===normName(custInput.value));
        if(!match){ hint.innerHTML = ''; return; }
        if(match.phone && !phoneTouched) phoneInput.value = match.phone;
        const owed = Number(match.totalDebt)||0;
        const jobs = Number(match.jobCount)||0;
        hint.innerHTML = `✓ Saved customer — ${jobs} job${jobs===1?'':'s'} so far`
          + (match.phone && !phoneTouched ? ', phone filled in' : '')
          + (owed>0 ? ` &nbsp;·&nbsp; <span class="flag">still owes ${naira(owed)}</span>` : '');
      }
      custInput.addEventListener('input', applyCustomer);
      custInput.addEventListener('change', applyCustomer);
    })();

    renderItemRows();
    document.getElementById('nj-add-item').addEventListener('click', ()=>{ draftItems.push({service:'',category:'',qty:1,unit:'',unitPrice:0,desc:'',descQty:0,descUnit:'',descUnitPrice:0}); renderItemRows(); });
    document.getElementById('nj-cash').addEventListener('input', recalcTotals);
    document.getElementById('nj-bank').addEventListener('input', recalcTotals);
    document.getElementById('nj-discount').addEventListener('input', recalcTotals);
    recalcTotals();

    // Materials Used: one row per material, unit cost auto-fills from Material Prices when the
    // name matches something already tracked; still editable by hand for a brand-new material.
    function renderMaterialRows(){
      const wrap = document.getElementById('nj-materials');
      wrap.innerHTML = draftMaterials.map((m,idx)=>`
        <div class="material-row" data-idx="${idx}">
          <div><label style="margin-top:0">Material name</label><input class="mt-name" list="nj-material-list" value="${esc(m.name)}" placeholder="e.g. SAV, A4, FLEX"></div>
          <div><label style="margin-top:0">Qty used</label><input class="mt-qty" type="number" min="0" value="${m.qty}"></div>
          <div><label style="margin-top:0">Qty wasted</label><input class="mt-waste" type="number" min="0" value="${m.waste||0}" title="Paper jammed, spoiled prints, etc. — still deducts from stock and counts as a cost."></div>
          <div>
            <label style="margin-top:0">Unit cost (\u20a6)</label><input class="mt-cost" type="number" min="0" value="${m.unitCost}">
            <div class="readout mt-hint" style="font-size:10px;color:var(--muted);margin-top:2px;">${m.name?'':'pulled from Material Prices'}</div>
          </div>
          <div><label style="margin-top:0">Total</label><input class="mt-total" type="text" value="${naira(((Number(m.qty)||0)+(Number(m.waste)||0))*(Number(m.unitCost)||0))}" disabled></div>
          <div><button class="lg-btn danger small mt-remove" type="button" title="Remove">\u2715</button></div>
        </div>
      `).join('');
      wrap.querySelectorAll('.material-row').forEach(row=>{
        const idx = Number(row.dataset.idx);
        const nameInp = row.querySelector('.mt-name');
        const qtyInp = row.querySelector('.mt-qty');
        const wasteInp = row.querySelector('.mt-waste');
        const costInp = row.querySelector('.mt-cost');
        const hint = row.querySelector('.mt-hint');
        function updateRowTotal(){
          const qty = Number(draftMaterials[idx].qty)||0;
          const waste = Number(draftMaterials[idx].waste)||0;
          row.querySelector('.mt-total').value = naira((qty+waste)*(Number(draftMaterials[idx].unitCost)||0));
          updateMaterialGrandTotal();
        }
        nameInp.addEventListener('input', ()=>{
          draftMaterials[idx].name = nameInp.value;
          const match = state.materials.find(mm=>normName(mm.name)===normName(nameInp.value));
          if(match){
            costInp.value = match.unitCost || 0;
            draftMaterials[idx].unitCost = match.unitCost || 0;
            hint.textContent = 'pulled from Material Prices (' + naira(match.unitCost||0) + '/' + (match.unit||'unit') + ')';
          } else if(nameInp.value.trim()){
            hint.textContent = 'new material — type its cost, it\'ll be saved to Material Prices';
          } else {
            hint.textContent = 'pulled from Material Prices';
          }
          updateRowTotal();
        });
        qtyInp.addEventListener('input', ()=>{ draftMaterials[idx].qty = qtyInp.value; updateRowTotal(); });
        wasteInp.addEventListener('input', ()=>{ draftMaterials[idx].waste = wasteInp.value; updateRowTotal(); });
        costInp.addEventListener('input', ()=>{ draftMaterials[idx].unitCost = costInp.value; updateRowTotal(); });
        row.querySelector('.mt-remove').addEventListener('click', ()=>{
          if(draftMaterials.length>1){ draftMaterials.splice(idx,1); renderMaterialRows(); }
          else { draftMaterials[0] = {name:'',qty:0,unitCost:0,waste:0}; renderMaterialRows(); }
        });
      });
      updateMaterialGrandTotal();
    }
    function updateMaterialGrandTotal(){
      const total = draftMaterials.reduce((s,m)=>s+((Number(m.qty)||0)+(Number(m.waste)||0))*(Number(m.unitCost)||0),0);
      const el = document.getElementById('nj-material-grandtotal');
      if(el) el.textContent = naira(total);
    }
    renderMaterialRows();
    document.getElementById('nj-add-material').addEventListener('click', ()=>{
      draftMaterials.push({name:'',qty:0,unitCost:0,waste:0}); renderMaterialRows();
    });

    // A quote is the same shape as a job so every total/receipt helper works on it, but it
    // lives in state.quotes — so it never counts as revenue, debt, CP, or material usage
    // until it's converted.
    document.getElementById('nj-quote').addEventListener('click', async ()=>{
      const items = draftItems.filter(it=>Number(it.qty)>0 || Number(it.descQty)>0).map(it=>({
        service: (it.service||'').trim() || 'ITEM', category: it.category||'', qty:Number(it.qty)||0, unit:(it.unit||'').trim(), unitPrice:Number(it.unitPrice)||0,
        desc:(it.desc||'').trim(), descQty:Number(it.descQty)||0, descUnit:(it.descUnit||'').trim(), descUnitPrice:Number(it.descUnitPrice)||0
      }));
      if(items.length===0){ toast('Add at least one item with a quantity'); return; }
      const rawTotalV = items.reduce((s,it)=>s+it.qty*it.unitPrice+it.descQty*it.descUnitPrice,0);
      const quote = {
        id: uid(),
        customerName: document.getElementById('nj-customer').value.trim() || 'WALKIN',
        phone: document.getElementById('nj-phone').value.trim(),
        dateCreated: todayISO(),
        validUntil: shiftDate(todayISO(), 14),
        description: document.getElementById('nj-desc').value.trim(),
        items,
        discount: Math.min(Number(document.getElementById('nj-discount').value)||0, rawTotalV),
        cp: Number(document.getElementById('nj-cp').value)||0,
        materials: draftMaterials
          .filter(m=>(m.name||'').trim() && (Number(m.qty)>0 || Number(m.waste)>0))
          .map(m=>({name:m.name.trim(), qty:Number(m.qty)||0, unitCost:Number(m.unitCost)||0, waste:Number(m.waste)||0})),
        operator: document.getElementById('nj-operator').value.trim(),
        dueDate: document.getElementById('nj-due').value || '',
        payments: [],
      };
      state.quotes.push(quote);
      await save('quotes');
      draftItems = [{service:'',category:'',qty:1,unit:'',unitPrice:0,desc:'',descQty:0,descUnit:'',descUnitPrice:0}];
      draftMaterials = [{name:'',qty:0,unitCost:0,waste:0}];
      toast('Quote saved \u2014 ' + quote.customerName);
      state.tab = 'quotes';
      renderAll();
    });

    document.getElementById('nj-save').addEventListener('click', async (e)=>{
      await withButtonGuard(e.currentTarget, 'Saving…', async ()=>{
      const customerName = document.getElementById('nj-customer').value.trim() || 'WALKIN';
      const items = draftItems.filter(it=>Number(it.qty)>0 || Number(it.descQty)>0).map(it=>({
        service: (it.service||'').trim() || 'ITEM', category: it.category||'', qty:Number(it.qty)||0, unit:(it.unit||'').trim(), unitPrice:Number(it.unitPrice)||0,
        desc:(it.desc||'').trim(), descQty:Number(it.descQty)||0, descUnit:(it.descUnit||'').trim(), descUnitPrice:Number(it.descUnitPrice)||0
      }));
      if(items.length===0){ toast('Add at least one item with a quantity'); return; }
      const dateReceived = document.getElementById('nj-date').value || todayISO();
      const cashV = Number(document.getElementById('nj-cash').value)||0;
      const bankV = Number(document.getElementById('nj-bank').value)||0;
      const rawTotalV = items.reduce((s,it)=>s+it.qty*it.unitPrice+it.descQty*it.descUnitPrice,0);
      const discountV = Math.min(Number(document.getElementById('nj-discount').value)||0, rawTotalV);
      const materials = draftMaterials
        .filter(m=>(m.name||'').trim() && (Number(m.qty)>0 || Number(m.waste)>0))
        .map(m=>({name:m.name.trim(), qty:Number(m.qty)||0, unitCost:Number(m.unitCost)||0, waste:Number(m.waste)||0}));
      const job = {
        id: uid(),
        customerName, phone: document.getElementById('nj-phone').value.trim(),
        dateReceived,
        description: document.getElementById('nj-desc').value.trim(),
        items,
        discount: discountV,
        paidCash: cashV, paidBank: bankV,   // kept for reference; totals now read from `payments`
        payments: (cashV>0 || bankV>0) ? [{date: dateReceived, cash: cashV, bank: bankV, note:'Job intake'}] : [],
        cp: Number(document.getElementById('nj-cp').value)||0,
        materials,
        operator: document.getElementById('nj-operator').value.trim(),
        dueDate: document.getElementById('nj-due').value || '',
        status: document.getElementById('nj-status').value,
        // Only stamp a real time when the job is being logged on the day it came in.
        // Backdated backlog entries get the date but no time, because the actual
        // hour it arrived isn't known — it can be filled in on the job's details.
        history: [Object.assign(
          {status: document.getElementById('nj-status').value, date: dateReceived || todayISO()},
          (dateReceived === todayISO() || !dateReceived) ? {at: nowISO()} : {}
        )],
      };
      state.jobs.push(job);
      recomputeAllCustomers();
      items.forEach(it=> upsertPriceListFromJob(it));
      let materialsChanged = false;
      materials.forEach(m=>{
        const existing = state.materials.find(mm=>normName(mm.name)===normName(m.name));
        if(!existing){
          state.materials.push({id: uid(), name: m.name, unit:'unit', unitCost: m.unitCost, opening:0, restocked:0, reorderLevel:0});
          materialsChanged = true;
        }
      });
      // One cloud round trip instead of three or four sequential ones.
      await saveMany(materialsChanged ? ['materials','jobs','customers','pricelist'] : ['jobs','customers','pricelist']);
      draftItems = [{service:'',category:'',qty:1,unit:'',unitPrice:0,desc:'',descQty:0,descUnit:'',descUnitPrice:0}];
      draftMaterials = [{name:'',qty:0,unitCost:0,waste:0}];
      toast('Job saved — ' + customerName);
      state.tab = 'jobs';
      renderAll();
      if(cashV>0 || bankV>0){
        await showReceipt(job, cashV+bankV, {cash:cashV, bank:bankV});
      }
      });
    });
  }

  // ---------- JOBS (kanban + table) ----------
  let jobsView = 'board';
  let jobsViewDate = todayISO();
  let jobsDateFilterOn = true;
  // Persisted so the view survives a re-render, and so other tabs can drive it —
  // the Customers tab jumps here pre-filtered to one customer's outstanding jobs.
  let jobsSearch = '';
  function renderJobs(){
    content.innerHTML = `
      <div class="lg-card">
        <div style="display:flex; gap:10px; align-items:end; flex-wrap:wrap;">
          <div><label style="margin-top:0">Date Received</label><input id="jv-date" type="date" value="${jobsViewDate}" ${jobsDateFilterOn?'':'disabled'}></div>
          <button class="lg-btn ghost small" id="jv-prev" type="button" ${jobsDateFilterOn?'':'disabled'}>\u25c0 Prev day</button>
          <button class="lg-btn ghost small" id="jv-today" type="button" ${jobsDateFilterOn?'':'disabled'}>Today</button>
          <button class="lg-btn ghost small" id="jv-next" type="button" ${jobsDateFilterOn?'':'disabled'}>Next day \u25b6</button>
          <label style="display:flex;align-items:center;gap:6px;font-size:12px;text-transform:none;font-weight:400;color:var(--muted);margin-top:0;">
            <input type="checkbox" id="jv-datefilter" style="width:auto;" ${jobsDateFilterOn?'checked':''}> Filter by date
          </label>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div class="lg-row-actions">
          <button class="lg-btn ${jobsView==='board'?'':'ghost'} small" id="jv-board">Board</button>
          <button class="lg-btn ${jobsView==='table'?'':'ghost'} small" id="jv-table">Table</button>
        </div>
        <div class="lg-row-actions">
          <input id="jobs-search" placeholder="Search customer or description…" value="${esc(jobsSearch)}" style="max-width:260px;">
          <button class="lg-btn ghost small" id="jv-export" type="button">\u2b07 Export CSV</button>
        </div>
      </div>
      <div id="jobs-body"></div>
    `;
    document.getElementById('jv-board').addEventListener('click', ()=>{ jobsView='board'; renderJobs(); });
    document.getElementById('jv-table').addEventListener('click', ()=>{ jobsView='table'; renderJobs(); });
    document.getElementById('jv-date').addEventListener('change', (e)=>{ jobsViewDate = e.target.value || todayISO(); renderJobs(); });
    document.getElementById('jv-prev').addEventListener('click', ()=>{ jobsViewDate = shiftDate(jobsViewDate,-1); renderJobs(); });
    document.getElementById('jv-next').addEventListener('click', ()=>{ jobsViewDate = shiftDate(jobsViewDate,1); renderJobs(); });
    document.getElementById('jv-today').addEventListener('click', ()=>{ jobsViewDate = todayISO(); renderJobs(); });
    document.getElementById('jv-datefilter').addEventListener('change', (e)=>{ jobsDateFilterOn = e.target.checked; renderJobs(); });
    const search = document.getElementById('jobs-search');
    // Debounced: rebuilding the whole jobs table on every keystroke is the single
    // slowest interaction in the app once the ledger has a few hundred jobs.
    let jobsSearchTimer = null;
    search.addEventListener('input', ()=>{
      jobsSearch = search.value;
      clearTimeout(jobsSearchTimer);
      jobsSearchTimer = setTimeout(()=>renderJobsBody(jobsSearch), 180);
    });
    document.getElementById('jv-export').addEventListener('click', ()=>exportJobsCSV(filteredJobs(jobsSearch), 'jobs'));
    renderJobsBody(jobsSearch);
  }
  function matchesJobQuery(j, q){
    q = (q||'').toUpperCase();
    return !q || normName(j.customerName).includes(q) || (j.description||'').toUpperCase().includes(q);
  }
  // NOTE: this applies the Jobs tab's date filter, so it is only appropriate for the
  // Jobs tab itself. Anything that needs to see jobs across all dates — Pending Jobs
  // especially — must not go through here.
  function filteredJobs(q){
    return state.jobs.filter(j => {
      if(jobsDateFilterOn && j.dateReceived !== jobsViewDate) return false;
      return matchesJobQuery(j, q);
    });
  }
  function renderJobsBody(q){
    const body = document.getElementById('jobs-body');
    const jobs = filteredJobs(q).sort((a,b)=>(b.dateReceived||'').localeCompare(a.dateReceived||''));
    const filterNote = `<div style="font-size:11px;color:var(--muted);margin-bottom:8px;">${jobsDateFilterOn ? `Showing jobs received on ${fmtDate(jobsViewDate)} (${jobs.length})` : `Showing all jobs, every date (${jobs.length})`}</div>`;
    if(jobsView==='table'){
      body.innerHTML = `<div class="lg-card">${filterNote}${renderJobsTable(jobs, true)}</div>`;
      attachStatusHandlers();
      attachDeleteHandlers();
      attachPaymentHandlers();
      attachWasteHandlers();
      attachCPHandlers();
    attachGuideHandlers();
      return;
    }
    body.innerHTML = `${filterNote}<div class="kanban">${STATUSES.map(s=>{
      const col = jobs.filter(j=>j.status===s);
      return `<div class="kanban-col">
        <div class="kanban-col-head"><span>${s}</span><span>${col.length}</span></div>
        ${col.length? col.map(j=>renderJobCard(j)).join('') : '<div class="lg-empty" style="padding:12px;font-size:12px;">No jobs</div>'}
      </div>`;
    }).join('')}</div>`;
    attachStatusHandlers();
    attachDeleteHandlers();
    attachPaymentHandlers();
    attachWasteHandlers();
    attachCPHandlers();
    attachGuideHandlers();
  }
  let openPaymentId = null;
  let openWasteId = null;

      ${guide.map((g,i)=>`
        <label style="display:flex;gap:7px;align-items:flex-start;font-size:12.5px;margin-bottom:5px;text-transform:none;letter-spacing:0;color:var(--ink);${checked[i]?'text-decoration:line-through;color:var(--muted);':''}">
          <input type="checkbox" class="guide-chk" data-id="${j.id}" data-idx="${i}" style="width:auto;margin-top:2px;" ${checked[i]?'checked':''}>
          <span>${esc(g)}</span>
        </label>`).join('')}
      ${renderStageTimes(j)}
    </div>`;

  // The stage trail, with each recorded moment editable. A job marked DELIVERED the
  // morning after it actually went out would otherwise be recorded as slower than it
  // was, and there would be no way to put it right.
  function renderStageTimes(j){
    const hist = j.history || [];
    const prod = productionMs(j);
    const reached = STATUSES.filter(s => hist.some(x=>x.status===s));
    if(!reached.length) return '';
    return `<div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--rule);">
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;">
        Stage times
        ${prod!=null
          ? `<span style="color:var(--teal);font-weight:600;letter-spacing:0;text-transform:none;">&nbsp;· production took ${fmtDuration(prod)}</span>`
          : `<span class="muted" style="letter-spacing:0;text-transform:none;">&nbsp;· not timed</span>`}
      </div>
      ${reached.map(s=>{
        const entry = hist.find(x=>x.status===s) || {};
        return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap;">
          <span style="font-size:11.5px;min-width:104px;">${s}</span>
          <input type="datetime-local" class="stage-at" data-id="${j.id}" data-status="${s}"
                 value="${toLocalInput(entry.at)}"
                 style="width:auto;font-size:11.5px;padding:3px 5px;">
          ${!entry.at ? `<span class="muted" style="font-size:11px;">no time recorded${entry.date?` — logged ${fmtDate(entry.date)}`:''}</span>` : ''}
        </div>`;
      }).join('')}
    </div>`;
  }
  function renderJobCard(j){
    const t = jobTotals(j);
    return `<div class="job-card" data-id="${j.id}">
      <div class="jc-top"><span>${esc(j.customerName)}</span><span class="jc-amt">${naira(t.totalBilled)}</span></div>
      <div class="jc-desc">${esc(j.description || (j.items[0]?j.items[0].service:''))} &middot; ${fmtDate(j.dateReceived)}</div>
      ${t.debt>0 ? `<div class="flag">Owes ${naira(t.debt)}</div>`:''}
      ${t.credit>0 ? `<div style="color:var(--teal);font-weight:600;">Credit ${naira(t.credit)}</div>`:''}
      ${jobMaterialsList(j).length ? `<div style="font-size:11px;color:var(--muted);">Materials used: ${jobMaterialsList(j).map(m=>`${esc(m.name)} \u00d7${m.qty}${Number(m.waste)>0?` <span style="color:var(--clay);">(+${m.waste} wasted)</span>`:''}`).join(', ')} (${naira(t.materialUsedCost)} used${t.materialWasteCost>0?` + ${naira(t.materialWasteCost)} wasted`:''} — counted in today's material cost; see <a href="#" class="goto-purchase-log" style="color:var(--teal);">Purchase Log</a> for what was spent buying stock)</div>` : ''}
      ${t.discount>0 ? `<div style="font-size:11px;color:var(--muted);">Discount applied: −${naira(t.discount)} (subtotal was ${naira(t.rawTotal)})</div>` : ''}
      <div style="font-size:11px;color:var(--muted);">Cost of Production: ${naira(t.cp)}${t.cp===0?' <span style="color:var(--clay);">(not set yet)</span>':''}${j.operator?` &middot; ${esc(j.operator)}`:''}</div>
      ${(()=>{const d=dueInfo(j); if(!d.has) return '<div style="font-size:11px;color:var(--muted);">No promised date set</div>';
        return `<div style="font-size:11px;${d.overdue?'color:var(--clay);font-weight:600;':(d.soon?'color:var(--amber-deep);font-weight:600;':'color:var(--muted);')}">Due ${d.label}${d.note?` \u2014 ${d.note}`:''}</div>`;})()}
      <select class="job-status-select" data-id="${j.id}">
